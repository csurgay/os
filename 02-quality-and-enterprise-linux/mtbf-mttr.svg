<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 302" width="760" height="302" role="img" aria-label="A system alternates between working and being repaired" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>A system alternates between working and being repaired</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .c2{fill:#d9822b}.c2s{stroke:#d9822b}.c2f{fill:#d9822b;fill-opacity:.14}.tint{fill:#f4f3ee}
  .bad{fill:#c8372d}.bads{stroke:#c8372d}.badf{fill:#c8372d;fill-opacity:.14}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}.acct{fill:#7aa9f5}
    .c2{fill:#eb9a4b}.c2s{stroke:#eb9a4b}.c2f{fill:#eb9a4b;fill-opacity:.2}.tint{fill:#22221f}
    .bad{fill:#ff7b70}.bads{stroke:#ff7b70}.badf{fill:#ff7b70;fill-opacity:.2}
  }
</style>
<defs><marker id="mt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="edgef"/></marker></defs>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">A system alternates between working and being repaired</text>
<rect x="40" y="96" width="210" height="34" rx="0" class="tint"/><rect x="40" y="96" width="210" height="34" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<rect x="250" y="96" width="50" height="34" rx="0" class="badf"/><rect x="250" y="96" width="50" height="34" rx="0" fill="none" class="bads" stroke-width="1.5"/>
<rect x="300" y="96" width="260" height="34" rx="0" class="tint"/><rect x="300" y="96" width="260" height="34" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<rect x="560" y="96" width="40" height="34" rx="0" class="badf"/><rect x="560" y="96" width="40" height="34" rx="0" fill="none" class="bads" stroke-width="1.5"/>
<rect x="600" y="96" width="120" height="34" rx="0" class="tint"/><rect x="600" y="96" width="120" height="34" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<text x="145" y="118" font-size="12.5" font-weight="400" class="ink" text-anchor="middle">working</text>
<text x="430" y="118" font-size="12.5" font-weight="400" class="ink" text-anchor="middle">working</text>
<text x="275" y="150" font-size="11.5" font-weight="400" class="bad" text-anchor="middle">failure,</text>
<text x="275" y="166" font-size="11.5" font-weight="400" class="bad" text-anchor="middle">repair</text>
<text x="580" y="150" font-size="11.5" font-weight="400" class="bad" text-anchor="middle">repair</text>
<path d="M300 74H560" fill="none" class="acc" stroke-width="1.5" marker-start="url(#mt)" marker-end="url(#mt)"/>
<text x="430.0" y="66" font-size="12" font-weight="600" class="acct" text-anchor="middle">MTTF: time to failure</text>
<path d="M560 192H600" fill="none" class="edge" stroke-width="1.5" marker-start="url(#mt)" marker-end="url(#mt)"/>
<text x="580.0" y="184" font-size="12" font-weight="600" class="ink" text-anchor="middle">MTTR</text>
<path d="M250 224H560" fill="none" class="edge" stroke-width="1.5" marker-start="url(#mt)" marker-end="url(#mt)"/>
<text x="405.0" y="216" font-size="12" font-weight="600" class="ink" text-anchor="middle">MTBF: from one failure to the next = MTTR + MTTF</text>
<text x="24" y="266" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Averaged over many failures: availability = MTTF / (MTTF + MTTR), the share of time the system is working.</text>
<text x="24" y="284" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">When repairs are short, MTBF ≈ MTTF, so availability ≈ MTBF / (MTBF + MTTR).</text>
</svg>
