<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">RHEL promises ten years per major version; Fedora about thirteen months</text>
<text x="24" y="50" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Support periods by year (approximate; Red Hat's future dates are subject to change)</text>
