<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="RHEL promises ten years per major version; Fedora about thirteen months" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>RHEL promises ten years per major version; Fedora about thirteen months</title>
<style>
