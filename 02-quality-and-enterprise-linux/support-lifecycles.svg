<rect x="431.78181818181696" y="272" width="28.70000000000357" height="20" rx="3" class="c2f"/><rect x="431.78181818181696" y="272" width="28.70000000000357" height="20" rx="3" fill="none" class="c2s" stroke-width="1.5"/>
