<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-label="A badly timed interrupt lets two processes into the critical section" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>A badly timed interrupt lets two processes into the critical section</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .bad{fill:#c8372d}.bads{stroke:#c8372d}.tint{fill:#f4f3ee}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}.acct{fill:#7aa9f5}
    .bad{fill:#ff7b70}.bads{stroke:#ff7b70}.tint{fill:#22221f}
  }
</style>
<defs><marker id="rc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="edgef"/></marker><marker id="rca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="acct"/></marker></defs>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">A badly timed interrupt lets two processes into the critical section</text>
<text x="24" y="70" font-size="13" font-weight="600" class="ink" text-anchor="start">A. The lock itself: test and take are two separate steps (S = 1 means free)</text>
<text x="24" y="109" font-size="13" font-weight="600" class="ink" text-anchor="start">P1</text>
<line x1="70" y1="104" x2="682.0" y2="104" class="grid"/>
<text x="24" y="153" font-size="13" font-weight="600" class="ink" text-anchor="start">P2</text>
<line x1="70" y1="148" x2="682.0" y2="148" class="grid"/>
<text x="24" y="192" font-size="13" font-weight="600" class="ink mono" text-anchor="start">S</text>
<rect x="156.0" y="89.0" width="116" height="30" rx="6" class="tint"/>
<rect x="156.0" y="89.0" width="116" height="30" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="164.0" y="109" font-size="11.5" font-weight="600" class="acct" text-anchor="start">1</text>
<text x="220" y="109" font-size="12.5" font-weight="400" class="ink mono" text-anchor="middle">S == 0 ?</text>
<text x="214" y="192" font-size="12.5" font-weight="400" class="ink mono" text-anchor="middle">S = 1</text>
<rect x="286.0" y="133.0" width="116" height="30" rx="6" class="tint"/>
<rect x="286.0" y="133.0" width="116" height="30" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="294.0" y="153" font-size="11.5" font-weight="600" class="acct" text-anchor="start">2</text>
<text x="350" y="153" font-size="12.5" font-weight="400" class="ink mono" text-anchor="middle">S == 0 ?</text>
<path d="M272.0 104L286.0 148" fill="none" class="acc" stroke-width="1.5" marker-end="url(#rca)" stroke-dasharray="4 3"/>
<text x="344" y="192" font-size="12.5" font-weight="400" class="ink mono" text-anchor="middle">S = 1</text>
<rect x="416.0" y="89.0" width="116" height="30" rx="6" class="tint"/>
<rect x="416.0" y="89.0" width="116" height="30" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="424.0" y="109" font-size="11.5" font-weight="600" class="acct" text-anchor="start">3</text>
<text x="480" y="109" font-size="12.5" font-weight="400" class="ink mono" text-anchor="middle">S = 0</text>
<path d="M402.0 148L416.0 104" fill="none" class="acc" stroke-width="1.5" marker-end="url(#rca)" stroke-dasharray="4 3"/>
<text x="474" y="192" font-size="12.5" font-weight="400" class="ink mono" text-anchor="middle">S = 0</text>
<rect x="546.0" y="133.0" width="116" height="30" rx="6" class="tint"/>
<rect x="546.0" y="133.0" width="116" height="30" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="554.0" y="153" font-size="11.5" font-weight="600" class="acct" text-anchor="start">4</text>
<text x="610" y="153" font-size="12.5" font-weight="400" class="ink mono" text-anchor="middle">S = 0</text>
<path d="M532.0 104L546.0 148" fill="none" class="acc" stroke-width="1.5" marker-end="url(#rca)" stroke-dasharray="4 3"/>
<text x="604" y="192" font-size="12.5" font-weight="600" class="bad mono" text-anchor="middle">S = 0</text>
<text x="24" y="218" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Both saw S = 1, so both entered. Dashed arrows: a timer interrupt switched to the other process.</text>
<text x="24" y="260" font-size="13" font-weight="600" class="ink" text-anchor="start">B. Inside the critical section: another process changes X in between</text>
<text x="24" y="299" font-size="13" font-weight="600" class="ink" text-anchor="start">P1</text>
<line x1="70" y1="294" x2="552.0" y2="294" class="grid"/>
<text x="24" y="343" font-size="13" font-weight="600" class="ink" text-anchor="start">P2</text>
<line x1="70" y1="338" x2="552.0" y2="338" class="grid"/>
<text x="24" y="382" font-size="13" font-weight="600" class="ink mono" text-anchor="start">X</text>
<rect x="156.0" y="279.0" width="116" height="30" rx="6" class="tint"/>
<rect x="156.0" y="279.0" width="116" height="30" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="164.0" y="299" font-size="11.5" font-weight="600" class="acct" text-anchor="start">1</text>
<text x="220" y="299" font-size="12.5" font-weight="400" class="ink mono" text-anchor="middle">X := 0</text>
<text x="214" y="382" font-size="12.5" font-weight="400" class="ink mono" text-anchor="middle">X = 0</text>
<rect x="286.0" y="323.0" width="116" height="30" rx="6" class="tint"/>
<rect x="286.0" y="323.0" width="116" height="30" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="294.0" y="343" font-size="11.5" font-weight="600" class="acct" text-anchor="start">2</text>
<text x="350" y="343" font-size="12.5" font-weight="400" class="ink mono" text-anchor="middle">X := 1</text>
<path d="M272.0 294L286.0 338" fill="none" class="acc" stroke-width="1.5" marker-end="url(#rca)" stroke-dasharray="4 3"/>
<text x="344" y="382" font-size="12.5" font-weight="400" class="ink mono" text-anchor="middle">X = 1</text>
<rect x="416.0" y="279.0" width="116" height="30" rx="6" class="tint"/>
<rect x="416.0" y="279.0" width="116" height="30" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="424.0" y="299" font-size="11.5" font-weight="600" class="acct" text-anchor="start">3</text>
<text x="480" y="299" font-size="12.5" font-weight="400" class="ink mono" text-anchor="middle">X++</text>
<path d="M402.0 338L416.0 294" fill="none" class="acc" stroke-width="1.5" marker-end="url(#rca)" stroke-dasharray="4 3"/>
<text x="474" y="382" font-size="12.5" font-weight="600" class="bad mono" text-anchor="middle">X = 2</text>
<text x="24" y="408" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">P1 expected X = 1 after its own two steps, but P2 changed X in between.</text>
</svg>
