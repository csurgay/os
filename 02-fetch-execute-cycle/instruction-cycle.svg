<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 292" width="760" height="292" role="img" aria-label="After every instruction, the CPU checks for interrupts" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>After every instruction, the CPU checks for interrupts</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}
  }
</style>
<defs><marker id="cyc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="edgef"/></marker></defs>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">After every instruction, the CPU checks for interrupts</text>
<path d="M164.0 120H188.0" fill="none" class="edge" stroke-width="1.25" marker-end="url(#cyc)"/>
<path d="M324.0 120H348.0" fill="none" class="edge" stroke-width="1.25" marker-end="url(#cyc)"/>
<path d="M484.0 120H536" fill="none" class="edge" stroke-width="1.25" marker-end="url(#cyc)"/>
<path d="M600 80V64H96V92.0" fill="none" class="edge" stroke-width="1.25" marker-end="url(#cyc)"/>
<path d="M600 160V212" fill="none" class="edge" stroke-width="1.25" marker-end="url(#cyc)"/>
<path d="M480.0 240H96V148.0" fill="none" class="edge" stroke-width="1.25" marker-end="url(#cyc)"/>
<rect x="28.0" y="92.0" width="136" height="56" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="96" y="116" font-size="13" font-weight="600" class="ink" text-anchor="middle">Fetch</text>
<text x="96" y="134" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">fetch instruction</text>
<rect x="188.0" y="92.0" width="136" height="56" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="256" y="116" font-size="13" font-weight="600" class="ink" text-anchor="middle">Decode</text>
<text x="256" y="134" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">decode CIR</text>
<rect x="348.0" y="92.0" width="136" height="56" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="416" y="116" font-size="13" font-weight="600" class="ink" text-anchor="middle">Execute</text>
<text x="416" y="134" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">operate or jump</text>
<polygon points="536,120 600,80 664,120 600,160" class="accf"/><polygon points="536,120 600,80 664,120 600,160" fill="none" class="acc" stroke-width="2"/>
<text x="600" y="118" font-size="13" font-weight="600" class="ink" text-anchor="middle">Interrupt</text>
<text x="600" y="134" font-size="13" font-weight="600" class="ink" text-anchor="middle">pending?</text>
<rect x="480.0" y="212" width="240" height="56" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="600" y="236" font-size="13" font-weight="600" class="ink" text-anchor="middle">Interrupt handling</text>
<text x="600" y="254" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">save PC, SR; PC ← handler address</text>
<text x="348.0" y="56" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">no: next instruction</text>
<text x="610" y="192" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">yes</text>
<text x="288.0" y="232" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">the handler's instructions are fetched too</text>
</svg>
