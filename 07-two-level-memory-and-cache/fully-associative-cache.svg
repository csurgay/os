<text x="730" y="241" font-size="12" font-weight="600" class="ink" text-anchor="middle">HIT: word selected</text>
<text x="730" y="276" font-size="11" font-weight="400" class="quiet" text-anchor="middle">by the offset</text>
<text x="24" y="352" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Content-addressable: the cache is searched by what it holds (the tag), with one comparator per line, all working in parallel.</text>
<text x="24" y="370" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Any block can go into any line, so there are no conflicts, but the comparators are costly: only small caches (such as many TLBs) are built this way.</text>
<text x="24" y="388" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">When the cache is full, a replacement algorithm must choose a victim: ideally the line that nobody has used for the longest time.</text>
</svg>
