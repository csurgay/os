<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 394" width="880" height="394" role="img" aria-label="A direct-mapped cache: the index picks one line, the tag says whose it is" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>A direct-mapped cache: the index picks one line, the tag says whose it is</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .c2{fill:#d9822b}.c2s{stroke:#d9822b}.c2f{fill:#d9822b;fill-opacity:.14}.tint{fill:#f4f3ee}
  .bad{fill:#c8372d}.bads{stroke:#c8372d}.badf{fill:#c8372d;fill-opacity:.14}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}.acct{fill:#7aa9f5}
    .c2{fill:#eb9a4b}.c2s{stroke:#eb9a4b}.c2f{fill:#eb9a4b;fill-opacity:.2}.tint{fill:#22221f}
    .bad{fill:#ff7b70}.bads{stroke:#ff7b70}.badf{fill:#ff7b70;fill-opacity:.2}
  }
</style>
<defs><marker id="dm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="edgef"/></marker><marker id="dmb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="acct"/></marker></defs>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">A direct-mapped cache: the index picks one line, the tag says whose it is</text>
<text x="60" y="62" font-size="12" font-weight="600" class="quiet" text-anchor="start">32-bit address</text>
<rect x="60" y="70" width="128" height="32" rx="3" class="c2f"/><rect x="60" y="70" width="128" height="32" rx="3" fill="none" class="c2s" stroke-width="1.5"/>
<text x="124.0" y="91" font-size="12" font-weight="600" class="ink" text-anchor="middle">tag (8 bits)</text>
<rect x="188" y="70" width="160" height="32" rx="3" class="accf"/><rect x="188" y="70" width="160" height="32" rx="3" fill="none" class="acc" stroke-width="2"/>
<text x="268.0" y="91" font-size="12" font-weight="600" class="ink" text-anchor="middle">index (10 bits)</text>
<rect x="348" y="70" width="224" height="32" rx="3" class="tint"/><rect x="348" y="70" width="224" height="32" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="460.0" y="91" font-size="12" font-weight="600" class="ink" text-anchor="middle">offset (14 bits)</text>
<text x="60" y="150" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">1024 lines</text>
<rect x="60" y="160" width="28" height="28" rx="0" class="tint"/><rect x="60" y="160" width="28" height="28" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<text x="74.0" y="179" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">V</text>
<rect x="88" y="160" width="28" height="28" rx="0" class="tint"/><rect x="88" y="160" width="28" height="28" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<text x="102.0" y="179" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">D</text>
<rect x="116" y="160" width="70" height="28" rx="0" class="tint"/><rect x="116" y="160" width="70" height="28" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<text x="151.0" y="179" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">tag</text>
<rect x="186" y="160" width="400" height="28" rx="0" class="tint"/><rect x="186" y="160" width="400" height="28" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<text x="386.0" y="179" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">line: 4096 words of 32 bits (16 KiB)</text>
<rect x="60" y="188" width="28" height="30" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<rect x="88" y="188" width="28" height="30" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<rect x="116" y="188" width="70" height="30" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<rect x="186" y="188" width="400" height="30" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<text x="52" y="208" font-size="11" font-weight="400" class="quiet" text-anchor="end">0</text>
<rect x="60" y="218" width="28" height="30" rx="0" class="accf"/><rect x="60" y="218" width="28" height="30" rx="0" fill="none" class="acc" stroke-width="2"/>
<rect x="88" y="218" width="28" height="30" rx="0" class="accf"/><rect x="88" y="218" width="28" height="30" rx="0" fill="none" class="acc" stroke-width="2"/>
<rect x="116" y="218" width="70" height="30" rx="0" class="accf"/><rect x="116" y="218" width="70" height="30" rx="0" fill="none" class="acc" stroke-width="2"/>
<rect x="186" y="218" width="400" height="30" rx="0" class="accf"/><rect x="186" y="218" width="400" height="30" rx="0" fill="none" class="acc" stroke-width="2"/>
<text x="52" y="238" font-size="11" font-weight="400" class="quiet" text-anchor="end">209</text>
<text x="74" y="238" font-size="12" font-weight="600" class="ink" text-anchor="middle">1</text>
<text x="102" y="238" font-size="12" font-weight="600" class="ink" text-anchor="middle">0</text>
<text x="151" y="238" font-size="12" font-weight="600" class="ink" text-anchor="middle">0x12</text>
<rect x="416" y="222" width="40" height="22" class="c2f"/>
<text x="436" y="238" font-size="10.5" font-weight="400" class="ink" text-anchor="middle">word</text>
<rect x="60" y="248" width="28" height="30" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<rect x="88" y="248" width="28" height="30" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<rect x="116" y="248" width="70" height="30" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<rect x="186" y="248" width="400" height="30" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<text x="52" y="268" font-size="11" font-weight="400" class="quiet" text-anchor="end">⋮</text>
<rect x="60" y="278" width="28" height="30" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<rect x="88" y="278" width="28" height="30" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<rect x="116" y="278" width="70" height="30" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<rect x="186" y="278" width="400" height="30" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<text x="52" y="298" font-size="11" font-weight="400" class="quiet" text-anchor="end">1023</text>
<path d="M300 102C300 130 40 150 36 200C34 222 44 232 56 233" fill="none" class="edge" stroke-width="1.5" marker-end="url(#dm)"/>
<text x="170" y="140" font-size="11" font-weight="400" class="quiet" text-anchor="start">index selects the line</text>
<path d="M124 102C124 180 151 190 151 226" fill="none" class="edge" stroke-width="1.5" marker-end="url(#dm)"/>
<text x="118" y="128" font-size="11" font-weight="400" class="quiet" text-anchor="end">compare</text>
<path d="M500 102C520 160 420 190 410 226" fill="none" class="edge" stroke-width="1.5" marker-end="url(#dm)"/>
<text x="510" y="150" font-size="11" font-weight="400" class="quiet" text-anchor="start">offset selects the word</text>
<rect x="620" y="160" width="230" height="64" rx="8" class="accf"/><rect x="620" y="160" width="230" height="64" rx="8" fill="none" class="acc" stroke-width="2"/>
<text x="632" y="182" font-size="12" font-weight="600" class="ink" text-anchor="start">HIT: V = 1 and stored tag = tag</text>
<text x="632" y="202" font-size="11" font-weight="400" class="quiet" text-anchor="start">the word comes from the cache</text>
<rect x="620" y="236" width="230" height="92" rx="8" class="c2f"/><rect x="620" y="236" width="230" height="92" rx="8" fill="none" class="c2s" stroke-width="1.5"/>
<text x="632" y="258" font-size="12" font-weight="600" class="ink" text-anchor="start">MISS: load the whole line</text>
<text x="632" y="278" font-size="11" font-weight="400" class="quiet" text-anchor="start">from RAM; if D = 1, first write</text>
<text x="632" y="294" font-size="11" font-weight="400" class="quiet" text-anchor="start">the old line back (write-back)</text>
<text x="632" y="312" font-size="11" font-weight="400" class="quiet" text-anchor="start">then set V = 1, D = 0, new tag</text>
<text x="24" y="360" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">The lecture notes' toy example: 4 GiB of RAM (32-bit addresses) and a 16 MiB cache of 1024 lines of 16 KiB. Real caches use 64-byte lines</text>
<text x="24" y="378" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">and far more lines; the mechanism is the same. V (valid): the line holds real data; D (dirty): it was written and differs from RAM.</text>
</svg>
