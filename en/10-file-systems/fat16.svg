<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 352" width="880" height="352" role="img" aria-label="FAT16: the layout of the measured 32 MiB volume, and the file C.DAT as a chain of clusters" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>FAT16: the layout of the measured 32 MiB volume, and the file C.DAT as a chain of clusters</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .c2{fill:#d9822b}.c2s{stroke:#d9822b}.c2f{fill:#d9822b;fill-opacity:.14}.tint{fill:#f4f3ee}
  .bad{fill:#c8372d}.bads{stroke:#c8372d}.badf{fill:#c8372d;fill-opacity:.14}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}.acct{fill:#7aa9f5}
    .c2{fill:#eb9a4b}.c2s{stroke:#eb9a4b}.c2f{fill:#eb9a4b;fill-opacity:.2}.tint{fill:#22221f}
    .bad{fill:#ff7b70}.bads{stroke:#ff7b70}.badf{fill:#ff7b70;fill-opacity:.2}
  }
</style>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">FAT16: the layout of the measured 32 MiB volume, and the file C.DAT as a chain of clusters</text>
<marker id="a8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="edgef"/></marker>
<rect x="24" y="54" width="50" height="40" rx="3" class="c2f"/><rect x="24" y="54" width="50" height="40" rx="3" fill="none" class="c2s" stroke-width="1.5"/>
<text x="49.0" y="79" font-size="12" font-weight="600" class="ink" text-anchor="middle">boot</text>
<text x="24" y="110" font-size="10.5" font-weight="400" class="quiet" text-anchor="start">0</text>
<rect x="74" y="54" width="110" height="40" rx="3" class="accf"/><rect x="74" y="54" width="110" height="40" rx="3" fill="none" class="acc" stroke-width="2"/>
<text x="129.0" y="79" font-size="12" font-weight="600" class="ink" text-anchor="middle">FAT #1</text>
<text x="74" y="110" font-size="10.5" font-weight="400" class="quiet" text-anchor="start">4</text>
<rect x="184" y="54" width="110" height="40" rx="3" class="accf"/><rect x="184" y="54" width="110" height="40" rx="3" fill="none" class="acc" stroke-width="2"/>
<text x="239.0" y="79" font-size="12" font-weight="600" class="ink" text-anchor="middle">FAT #2</text>
<text x="184" y="110" font-size="10.5" font-weight="400" class="quiet" text-anchor="start">68</text>
<rect x="294" y="54" width="90" height="40" rx="3" class="c2f"/><rect x="294" y="54" width="90" height="40" rx="3" fill="none" class="c2s" stroke-width="1.5"/>
<text x="339.0" y="79" font-size="12" font-weight="600" class="ink" text-anchor="middle">root dir</text>
<text x="294" y="110" font-size="10.5" font-weight="400" class="quiet" text-anchor="start">132</text>
<rect x="384" y="54" width="470" height="40" rx="3" class="tint"/><rect x="384" y="54" width="470" height="40" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="619.0" y="79" font-size="12" font-weight="600" class="ink" text-anchor="middle">data area: clusters 2, 3, 4, …</text>
<text x="384" y="110" font-size="10.5" font-weight="400" class="quiet" text-anchor="start">164</text>
<text x="854" y="110" font-size="10.5" font-weight="400" class="quiet" text-anchor="end">65535</text>
<text x="24" y="128" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">sector numbers (512 bytes each); one cluster = 4 sectors = 2 KiB</text>
<rect x="24" y="160" width="230" height="64" rx="8" class="c2f"/><rect x="24" y="160" width="230" height="64" rx="8" fill="none" class="c2s" stroke-width="1.5"/>
<text x="36" y="182" font-size="12" font-weight="600" class="ink" text-anchor="start">root directory entry 2</text>
<text x="36" y="202" font-size="12" font-weight="400" class="ink" text-anchor="start">C.DAT  size 9000  first 3</text>
<path d="M254 198H300" fill="none" class="edge" stroke-width="1.25" marker-end="url(#a8)"/>
<text x="300" y="154" font-size="11.5" font-weight="600" class="ink" text-anchor="start">FAT entries (index: value)</text>
<rect x="300" y="178" width="44" height="40" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="322" y="192" font-size="10" font-weight="400" class="quiet" text-anchor="middle">0</text>
<text x="322" y="210" font-size="11.5" font-weight="400" class="ink" text-anchor="middle">0xfff8</text>
<rect x="346" y="178" width="44" height="40" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="368" y="192" font-size="10" font-weight="400" class="quiet" text-anchor="middle">1</text>
<text x="368" y="210" font-size="11.5" font-weight="400" class="ink" text-anchor="middle">0xffff</text>
<rect x="392" y="178" width="44" height="40" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="414" y="192" font-size="10" font-weight="400" class="quiet" text-anchor="middle">2</text>
<text x="414" y="210" font-size="11.5" font-weight="400" class="ink" text-anchor="middle">EOC</text>
<rect x="438" y="178" width="44" height="40" rx="3" class="accf"/><rect x="438" y="178" width="44" height="40" rx="3" fill="none" class="acc" stroke-width="2"/>
<text x="460" y="192" font-size="10" font-weight="400" class="quiet" text-anchor="middle">3</text>
<text x="460" y="210" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">4</text>
<rect x="484" y="178" width="44" height="40" rx="3" class="accf"/><rect x="484" y="178" width="44" height="40" rx="3" fill="none" class="acc" stroke-width="2"/>
<text x="506" y="192" font-size="10" font-weight="400" class="quiet" text-anchor="middle">4</text>
<text x="506" y="210" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">5</text>
<rect x="530" y="178" width="44" height="40" rx="3" class="accf"/><rect x="530" y="178" width="44" height="40" rx="3" fill="none" class="acc" stroke-width="2"/>
<text x="552" y="192" font-size="10" font-weight="400" class="quiet" text-anchor="middle">5</text>
<text x="552" y="210" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">8</text>
<rect x="576" y="178" width="44" height="40" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="598" y="192" font-size="10" font-weight="400" class="quiet" text-anchor="middle">6</text>
<text x="598" y="210" font-size="11.5" font-weight="400" class="ink" text-anchor="middle">7</text>
<rect x="622" y="178" width="44" height="40" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="644" y="192" font-size="10" font-weight="400" class="quiet" text-anchor="middle">7</text>
<text x="644" y="210" font-size="11.5" font-weight="400" class="ink" text-anchor="middle">EOC</text>
<rect x="668" y="178" width="44" height="40" rx="3" class="accf"/><rect x="668" y="178" width="44" height="40" rx="3" fill="none" class="acc" stroke-width="2"/>
<text x="690" y="192" font-size="10" font-weight="400" class="quiet" text-anchor="middle">8</text>
<text x="690" y="210" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">9</text>
<rect x="714" y="178" width="44" height="40" rx="3" class="accf"/><rect x="714" y="178" width="44" height="40" rx="3" fill="none" class="acc" stroke-width="2"/>
<text x="736" y="192" font-size="10" font-weight="400" class="quiet" text-anchor="middle">9</text>
<text x="736" y="210" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">EOC</text>
<rect x="760" y="178" width="44" height="40" rx="3" class="tint"/><rect x="760" y="178" width="44" height="40" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="782" y="192" font-size="10" font-weight="400" class="quiet" text-anchor="middle">10</text>
<text x="782" y="210" font-size="11.5" font-weight="400" class="ink" text-anchor="middle">free</text>
<rect x="806" y="178" width="44" height="40" rx="3" class="tint"/><rect x="806" y="178" width="44" height="40" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="828" y="192" font-size="10" font-weight="400" class="quiet" text-anchor="middle">11</text>
<text x="828" y="210" font-size="11.5" font-weight="400" class="ink" text-anchor="middle">free</text>
<path d="M460 220C460 240 506 240 506 222" fill="none" class="acc" stroke-width="1.5" marker-end="url(#a8)"/>
<path d="M506 220C506 240 552 240 552 222" fill="none" class="acc" stroke-width="1.5" marker-end="url(#a8)"/>
<path d="M552 220C552 240 690 240 690 222" fill="none" class="acc" stroke-width="1.5" marker-end="url(#a8)"/>
<path d="M690 220C690 240 736 240 736 222" fill="none" class="acc" stroke-width="1.5" marker-end="url(#a8)"/>
<text x="300" y="264" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">C.DAT = clusters 3 → 4 → 5 → 8 → 9 → end of chain (it reused the clusters of a deleted file: fragmented)</text>
<text x="300" y="282" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">B.DAT = clusters 6 → 7;  HELLO.TXT = cluster 2</text>
<text x="24" y="320" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">To read byte n of a file, follow the chain n / 2048 steps through the FAT: the FAT is kept in RAM, so this is fast, but seeking is O(n).</text>
<text x="24" y="338" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Deleting only marks the clusters free and overwrites the first byte of the name with 0xE5: the data stays until reused.</text>
</svg>
