<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 286" width="880" height="286" role="img" aria-label="ext4 on disk: the measured 512 MiB file system is four block groups of 128 MiB" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>ext4 on disk: the measured 512 MiB file system is four block groups of 128 MiB</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .c2{fill:#d9822b}.c2s{stroke:#d9822b}.c2f{fill:#d9822b;fill-opacity:.14}.tint{fill:#f4f3ee}
  .bad{fill:#c8372d}.bads{stroke:#c8372d}.badf{fill:#c8372d;fill-opacity:.14}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}.acct{fill:#7aa9f5}
    .c2{fill:#eb9a4b}.c2s{stroke:#eb9a4b}.c2f{fill:#eb9a4b;fill-opacity:.2}.tint{fill:#22221f}
    .bad{fill:#ff7b70}.bads{stroke:#ff7b70}.badf{fill:#ff7b70;fill-opacity:.2}
  }
</style>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">ext4 on disk: the measured 512 MiB file system is four block groups of 128 MiB</text>
<marker id="a9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="edgef"/></marker>
<rect x="24" y="54" width="204" height="40" rx="3" class="accf"/><rect x="24" y="54" width="204" height="40" rx="3" fill="none" class="acc" stroke-width="2"/>
<text x="126" y="72" font-size="12" font-weight="600" class="ink" text-anchor="middle">block group 0</text>
<text x="126" y="88" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">blocks 0–32767</text>
<rect x="236" y="54" width="204" height="40" rx="3" class="tint"/><rect x="236" y="54" width="204" height="40" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="338" y="72" font-size="12" font-weight="600" class="ink" text-anchor="middle">block group 1</text>
<text x="338" y="88" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">blocks 32768–65535</text>
<rect x="448" y="54" width="204" height="40" rx="3" class="c2f"/><rect x="448" y="54" width="204" height="40" rx="3" fill="none" class="c2s" stroke-width="1.5"/>
<text x="550" y="72" font-size="12" font-weight="600" class="ink" text-anchor="middle">block group 2</text>
<text x="550" y="88" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">blocks 65536–98303</text>
<rect x="660" y="54" width="204" height="40" rx="3" class="tint"/><rect x="660" y="54" width="204" height="40" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="762" y="72" font-size="12" font-weight="600" class="ink" text-anchor="middle">block group 3</text>
<text x="762" y="88" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">blocks 98304–131071</text>
<text x="550" y="112" font-size="11" font-weight="600" class="ink" text-anchor="middle">the 16 MiB journal: blocks 65536–69631</text>
<path d="M24 94L24 140" fill="none" class="edge" stroke-width="1" stroke-dasharray="4 3"/>
<path d="M228 94L856 140" fill="none" class="edge" stroke-width="1" stroke-dasharray="4 3"/>
<rect x="24" y="140" width="62" height="54" rx="3" class="c2f"/><rect x="24" y="140" width="62" height="54" rx="3" fill="none" class="c2s" stroke-width="1.5"/>
<text x="55.0" y="162" font-size="11" font-weight="600" class="ink" text-anchor="middle">super-</text>
<text x="55.0" y="177" font-size="11" font-weight="600" class="ink" text-anchor="middle">block</text>
<text x="24" y="210" font-size="10" font-weight="400" class="quiet" text-anchor="start">0</text>
<rect x="86" y="140" width="62" height="54" rx="3" class="c2f"/><rect x="86" y="140" width="62" height="54" rx="3" fill="none" class="c2s" stroke-width="1.5"/>
<text x="117.0" y="162" font-size="11" font-weight="600" class="ink" text-anchor="middle">group</text>
<text x="117.0" y="177" font-size="11" font-weight="600" class="ink" text-anchor="middle">descr.</text>
<text x="86" y="210" font-size="10" font-weight="400" class="quiet" text-anchor="start">1</text>
<rect x="148" y="140" width="72" height="54" rx="3" class="tint"/><rect x="148" y="140" width="72" height="54" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="184.0" y="162" font-size="11" font-weight="600" class="ink" text-anchor="middle">reserved</text>
<text x="184.0" y="177" font-size="11" font-weight="600" class="ink" text-anchor="middle">GDT</text>
<text x="148" y="210" font-size="10" font-weight="400" class="quiet" text-anchor="start">2</text>
<rect x="220" y="140" width="64" height="54" rx="3" class="accf"/><rect x="220" y="140" width="64" height="54" rx="3" fill="none" class="acc" stroke-width="2"/>
<text x="252.0" y="162" font-size="11" font-weight="600" class="ink" text-anchor="middle">block</text>
<text x="252.0" y="177" font-size="11" font-weight="600" class="ink" text-anchor="middle">bitmaps</text>
<text x="220" y="210" font-size="10" font-weight="400" class="quiet" text-anchor="start">65</text>
<rect x="284" y="140" width="64" height="54" rx="3" class="accf"/><rect x="284" y="140" width="64" height="54" rx="3" fill="none" class="acc" stroke-width="2"/>
<text x="316.0" y="162" font-size="11" font-weight="600" class="ink" text-anchor="middle">inode</text>
<text x="316.0" y="177" font-size="11" font-weight="600" class="ink" text-anchor="middle">bitmaps</text>
<text x="284" y="210" font-size="10" font-weight="400" class="quiet" text-anchor="start">69</text>
<rect x="348" y="140" width="150" height="54" rx="3" class="accf"/><rect x="348" y="140" width="150" height="54" rx="3" fill="none" class="acc" stroke-width="2"/>
<text x="423.0" y="162" font-size="11" font-weight="600" class="ink" text-anchor="middle">inode tables of</text>
<text x="423.0" y="177" font-size="11" font-weight="600" class="ink" text-anchor="middle">groups 0–3</text>
<text x="348" y="210" font-size="10" font-weight="400" class="quiet" text-anchor="start">73</text>
<rect x="498" y="140" width="358" height="54" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="677.0" y="162" font-size="11" font-weight="600" class="ink" text-anchor="middle">data blocks</text>
<text x="498" y="210" font-size="10" font-weight="400" class="quiet" text-anchor="start">2121</text>
<text x="24" y="236" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">With flex_bg, the bitmaps and inode tables of 16 groups are packed together, so group 0 holds those of all four groups:</text>
<text x="24" y="254" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">bitmaps at 65–68 and 69–72, inode tables at 73–2120 (512 blocks each). Groups 1 and 3 keep backup superblocks (sparse_super).</text>
<text x="24" y="272" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">The inode count is fixed at mkfs time (here 8,192 per group): when inodes run out, the disk is "full" with free space left.</text>
</svg>
