<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" role="img" aria-label="The top of the Linux directory tree (Filesystem Hierarchy Standard)">
<title>The top of the Linux directory tree (Filesystem Hierarchy Standard)</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .c2{fill:#d9822b}.c2s{stroke:#d9822b}.c2f{fill:#d9822b;fill-opacity:.14}.tint{fill:#f4f3ee}
  .bad{fill:#c8372d}.bads{stroke:#c8372d}.badf{fill:#c8372d;fill-opacity:.14}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}.acct{fill:#7aa9f5}
    .c2{fill:#eb9a4b}.c2s{stroke:#eb9a4b}.c2f{fill:#eb9a4b;fill-opacity:.2}.tint{fill:#22221f}
    .bad{fill:#ff7b70}.bads{stroke:#ff7b70}.badf{fill:#ff7b70;fill-opacity:.2}
  }
</style>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">The top of the Linux directory tree (Filesystem Hierarchy Standard)</text>
<rect x="400" y="48" width="80" height="30" rx="4" fill="none" class="edge" stroke-width="1.25"/>
<text x="440" y="68" font-size="14" font-weight="600" class="ink" text-anchor="middle">/</text>
<path d="M440 78V94" fill="none" class="edge" stroke-width="1"/>
<path d="M103.0 94H783.0" fill="none" class="edge" stroke-width="1"/>
<rect x="24" y="108" width="158" height="86" rx="6" class="accf"/><rect x="24" y="108" width="158" height="86" rx="6" fill="none" class="acc" stroke-width="2"/>
<text x="34" y="128" font-size="13" font-weight="600" class="ink" text-anchor="start">/boot</text>
<text x="34" y="148" font-size="11" font-weight="400" class="ink" text-anchor="start">kernel (vmlinuz),</text>
<text x="34" y="164" font-size="11" font-weight="400" class="ink" text-anchor="start">initramfs, GRUB;</text>
<text x="34" y="180" font-size="11" font-weight="400" class="ink" text-anchor="start">/boot/efi (ESP)</text>
<path d="M103.0 94V108" fill="none" class="edge" stroke-width="1"/>
<rect x="194" y="108" width="158" height="86" rx="6" class="accf"/><rect x="194" y="108" width="158" height="86" rx="6" fill="none" class="acc" stroke-width="2"/>
<text x="204" y="128" font-size="13" font-weight="600" class="ink" text-anchor="start">/etc</text>
<text x="204" y="148" font-size="11" font-weight="400" class="ink" text-anchor="start">host-specific</text>
<text x="204" y="164" font-size="11" font-weight="400" class="ink" text-anchor="start">configuration:</text>
<text x="204" y="180" font-size="11" font-weight="400" class="ink" text-anchor="start">fstab, passwd …</text>
<path d="M273.0 94V108" fill="none" class="edge" stroke-width="1"/>
<rect x="364" y="108" width="158" height="86" rx="6" class="accf"/><rect x="364" y="108" width="158" height="86" rx="6" fill="none" class="acc" stroke-width="2"/>
<text x="374" y="128" font-size="13" font-weight="600" class="ink" text-anchor="start">/usr</text>
<text x="374" y="148" font-size="11" font-weight="400" class="ink" text-anchor="start">installed software,</text>
<text x="374" y="164" font-size="11" font-weight="400" class="ink" text-anchor="start">read-only, shareable:</text>
<text x="374" y="180" font-size="11" font-weight="400" class="ink" text-anchor="start">bin lib sbin share</text>
<path d="M443.0 94V108" fill="none" class="edge" stroke-width="1"/>
<rect x="534" y="108" width="158" height="86" rx="6" class="accf"/><rect x="534" y="108" width="158" height="86" rx="6" fill="none" class="acc" stroke-width="2"/>
<text x="544" y="128" font-size="13" font-weight="600" class="ink" text-anchor="start">/opt</text>
<text x="544" y="148" font-size="11" font-weight="400" class="ink" text-anchor="start">add-on packages,</text>
<text x="544" y="164" font-size="11" font-weight="400" class="ink" text-anchor="start">each in its own</text>
<text x="544" y="180" font-size="11" font-weight="400" class="ink" text-anchor="start">/opt/&lt;package&gt;</text>
<path d="M613.0 94V108" fill="none" class="edge" stroke-width="1"/>
<rect x="704" y="108" width="158" height="86" rx="6" class="c2f"/><rect x="704" y="108" width="158" height="86" rx="6" fill="none" class="c2s" stroke-width="1.5"/>
<text x="714" y="128" font-size="13" font-weight="600" class="ink" text-anchor="start">/home, /root</text>
<text x="714" y="148" font-size="11" font-weight="400" class="ink" text-anchor="start">users' home</text>
<text x="714" y="164" font-size="11" font-weight="400" class="ink" text-anchor="start">directories; root's</text>
<text x="714" y="180" font-size="11" font-weight="400" class="ink" text-anchor="start">home is /root</text>
<path d="M783.0 94V108" fill="none" class="edge" stroke-width="1"/>
<rect x="24" y="206" width="158" height="86" rx="6" class="c2f"/><rect x="24" y="206" width="158" height="86" rx="6" fill="none" class="c2s" stroke-width="1.5"/>
<text x="34" y="226" font-size="13" font-weight="600" class="ink" text-anchor="start">/var</text>
<text x="34" y="246" font-size="11" font-weight="400" class="ink" text-anchor="start">variable data that</text>
<text x="34" y="262" font-size="11" font-weight="400" class="ink" text-anchor="start">survives reboots:</text>
<text x="34" y="278" font-size="11" font-weight="400" class="ink" text-anchor="start">log spool lib www</text>
<rect x="194" y="206" width="158" height="86" rx="6" class="c2f"/><rect x="194" y="206" width="158" height="86" rx="6" fill="none" class="c2s" stroke-width="1.5"/>
<text x="204" y="226" font-size="13" font-weight="600" class="ink" text-anchor="start">/srv</text>
<text x="204" y="246" font-size="11" font-weight="400" class="ink" text-anchor="start">data this host</text>
<text x="204" y="262" font-size="11" font-weight="400" class="ink" text-anchor="start">serves (web, FTP)</text>
<rect x="364" y="206" width="158" height="86" rx="6" class="tint"/><rect x="364" y="206" width="158" height="86" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="374" y="226" font-size="13" font-weight="600" class="ink" text-anchor="start">/tmp</text>
<text x="374" y="246" font-size="11" font-weight="400" class="ink" text-anchor="start">temporary files,</text>
<text x="374" y="262" font-size="11" font-weight="400" class="ink" text-anchor="start">may be cleaned,</text>
<text x="374" y="278" font-size="11" font-weight="400" class="ink" text-anchor="start">often a tmpfs</text>
<rect x="534" y="206" width="158" height="86" rx="6" class="tint"/><rect x="534" y="206" width="158" height="86" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="544" y="226" font-size="13" font-weight="600" class="ink" text-anchor="start">/run</text>
<text x="544" y="246" font-size="11" font-weight="400" class="ink" text-anchor="start">runtime data since</text>
<text x="544" y="262" font-size="11" font-weight="400" class="ink" text-anchor="start">boot (PIDs, sockets),</text>
<text x="544" y="278" font-size="11" font-weight="400" class="ink" text-anchor="start">a tmpfs</text>
<rect x="704" y="206" width="158" height="86" rx="6" class="tint"/><rect x="704" y="206" width="158" height="86" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="714" y="226" font-size="13" font-weight="600" class="ink" text-anchor="start">/mnt, /media</text>
<text x="714" y="246" font-size="11" font-weight="400" class="ink" text-anchor="start">mount points for</text>
<text x="714" y="262" font-size="11" font-weight="400" class="ink" text-anchor="start">temporary and</text>
<text x="714" y="278" font-size="11" font-weight="400" class="ink" text-anchor="start">removable media</text>
<rect x="24" y="304" width="158" height="86" rx="6" fill="none" class="edge" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="34" y="324" font-size="13" font-weight="600" class="ink" text-anchor="start">/dev</text>
<text x="34" y="344" font-size="11" font-weight="400" class="quiet" text-anchor="start">device files:</text>
<text x="34" y="360" font-size="11" font-weight="400" class="quiet" text-anchor="start">sda nvme0n1 tty</text>
<text x="34" y="376" font-size="11" font-weight="400" class="quiet" text-anchor="start">null zero random</text>
<rect x="194" y="304" width="158" height="86" rx="6" fill="none" class="edge" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="204" y="324" font-size="13" font-weight="600" class="ink" text-anchor="start">/proc</text>
<text x="204" y="344" font-size="11" font-weight="400" class="quiet" text-anchor="start">processes, mounts,</text>
<text x="204" y="360" font-size="11" font-weight="400" class="quiet" text-anchor="start">partitions, memory</text>
<text x="204" y="376" font-size="11" font-weight="400" class="quiet" text-anchor="start">(generated)</text>
<rect x="364" y="304" width="158" height="86" rx="6" fill="none" class="edge" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="374" y="324" font-size="13" font-weight="600" class="ink" text-anchor="start">/sys</text>
<text x="374" y="344" font-size="11" font-weight="400" class="quiet" text-anchor="start">devices, drivers,</text>
<text x="374" y="360" font-size="11" font-weight="400" class="quiet" text-anchor="start">kernel settings</text>
<text x="374" y="376" font-size="11" font-weight="400" class="quiet" text-anchor="start">(generated)</text>
<rect x="538" y="312" width="18" height="12" rx="2" class="accf"/><rect x="538" y="312" width="18" height="12" rx="2" fill="none" class="acc" stroke-width="2"/>
<text x="564" y="322" font-size="11" font-weight="400" class="quiet" text-anchor="start">static: changes when software is installed</text>
<rect x="538" y="330" width="18" height="12" rx="2" class="c2f"/><rect x="538" y="330" width="18" height="12" rx="2" fill="none" class="c2s" stroke-width="1.5"/>
<text x="564" y="340" font-size="11" font-weight="400" class="quiet" text-anchor="start">variable: grows while the system runs</text>
<rect x="538" y="348" width="18" height="12" rx="2" class="tint"/><rect x="538" y="348" width="18" height="12" rx="2" fill="none" class="edge" stroke-width="1.25"/>
<text x="564" y="358" font-size="11" font-weight="400" class="quiet" text-anchor="start">temporary or volatile</text>
<rect x="538" y="366" width="18" height="12" rx="2" fill="none" class="edge" stroke-width="1.2" stroke-dasharray="3 2"/>
<text x="564" y="376" font-size="11" font-weight="400" class="quiet" text-anchor="start">virtual: generated by the kernel</text>
<text x="24" y="416" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">/bin, /sbin, /lib are symbolic links to /usr/bin, /usr/sbin, /usr/lib on current distributions (the usr-merge).</text>
</svg>
