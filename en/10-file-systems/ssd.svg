<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">An SSD: a controller in front of many NAND flash chips working in parallel</text>
<marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="edgef"/></marker>
<rect x="24" y="60" width="120" height="210" rx="8" class="tint"/><rect x="24" y="60" width="120" height="210" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="84" y="90" font-size="13" font-weight="600" class="ink" text-anchor="middle">host</text>
<text x="84" y="112" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">SATA, SAS</text>
<text x="84" y="128" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">or NVMe</text>
<text x="84" y="144" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">over PCIe</text>
<text x="84" y="180" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">sees logical</text>
<text x="84" y="196" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">blocks (LBAs)</text>
<path d="M144 165H184" fill="none" class="edge" stroke-width="1.25" marker-end="url(#a2)"/>
<rect x="184" y="60" width="230" height="210" rx="8" class="accf"/><rect x="184" y="60" width="230" height="210" rx="8" fill="none" class="acc" stroke-width="2"/>
<text x="299" y="86" font-size="13" font-weight="600" class="ink" text-anchor="middle">controller (firmware)</text>
<text x="200" y="112" font-size="11.5" font-weight="600" class="ink" text-anchor="start">• flash translation layer:</text>
<text x="200" y="134" font-size="11.5" font-weight="400" class="ink" text-anchor="start">   logical page → physical page</text>
<text x="200" y="156" font-size="11.5" font-weight="400" class="ink" text-anchor="start">• garbage collection</text>
<text x="200" y="178" font-size="11.5" font-weight="400" class="ink" text-anchor="start">• wear leveling</text>
<text x="200" y="200" font-size="11.5" font-weight="400" class="ink" text-anchor="start">• error correction (ECC)</text>
<text x="200" y="222" font-size="11.5" font-weight="400" class="ink" text-anchor="start">• bad block management</text>
<rect x="200" y="234" width="198" height="26" rx="4" class="c2f"/><rect x="200" y="234" width="198" height="26" rx="4" fill="none" class="c2s" stroke-width="1.5"/>
<text x="299" y="252" font-size="11" font-weight="400" class="ink" text-anchor="middle">DRAM: mapping table, cache</text>
