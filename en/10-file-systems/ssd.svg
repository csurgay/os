<text x="680" y="389" font-size="11" font-weight="400" class="ink" text-anchor="start">erased page</text>
<text x="24" y="456" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">read and program (write): one page, 4–16 KiB, tens of µs to 1 ms   ·   erase: a whole block of hundreds of pages, several ms</text>
<text x="24" y="474" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">A page cannot be overwritten in place: a new version goes to an erased page, and the old one becomes invalid.</text>
