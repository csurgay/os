<text x="190" y="62" font-size="12" font-weight="600" class="quiet" text-anchor="start">physical volumes (PV)</text>
<text x="400" y="62" font-size="12" font-weight="600" class="quiet" text-anchor="start">volume group (VG)</text>
<text x="580" y="62" font-size="12" font-weight="600" class="quiet" text-anchor="start">logical volumes (LV)</text>
<text x="760" y="62" font-size="12" font-weight="600" class="quiet" text-anchor="start">file systems</text>
<text x="190" y="78" font-size="10.5" font-weight="400" class="quiet" text-anchor="start">cut into 4 MiB extents</text>
