<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 471" width="780" height="471" role="img" aria-label="Race to idle or slow and steady? It depends on what else stays awake (a model)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Race to idle or slow and steady? It depends on what else stays awake (a model)</title>
