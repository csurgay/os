<rect x="440.0" y="380.0" width="10.0" height="10.0" class="acct" fill-opacity="0.85"/>
<text x="456" y="389" font-size="11" font-weight="400" class="ink" text-anchor="start">P_rest = 0.3 W (memory awake)</text>
<rect x="440.0" y="397.0" width="10.0" height="10.0" class="c2" fill-opacity="0.85"/>
<text x="456" y="406" font-size="11" font-weight="400" class="ink" text-anchor="start">P_rest = 1 W (screen, radio)</text>
<text x="650" y="372" font-size="11" font-weight="400" class="quiet" text-anchor="start">▼ least energy</text>
<text x="24" y="437" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Model of energy.py: E = C·V²·f·t + (I_leak·V + P_rest)·t + P_idle·(2 s − t), W = 10⁹ cycles. When nothing else is awake, the slowest</text>
<text x="24" y="455" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">point wins; the more of the system must stay awake while the core works, the faster the best point (race to idle).</text>
