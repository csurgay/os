<text x="726.0" y="208" font-size="15" font-weight="600" class="ink" text-anchor="middle">3</text>
<text x="528" y="234" font-size="13" font-weight="600" class="ink" text-anchor="middle">chmod 7743 f   →   ls -l shows   -rwsr-S-wt</text>
<text x="24" y="272" font-size="12.5" font-weight="600" class="ink" text-anchor="start">How ls shows a special bit: it shares the position of an x</text>
<text x="40" y="298" font-size="11.5" font-weight="600" class="quiet" text-anchor="start"></text>
<text x="300" y="298" font-size="11.5" font-weight="600" class="quiet" text-anchor="middle">x not set</text>
<text x="420" y="298" font-size="11.5" font-weight="600" class="quiet" text-anchor="middle">x set</text>
<text x="40" y="322" font-size="12" font-weight="400" class="ink" text-anchor="start">special bit not set</text>
<text x="300" y="322" font-size="14" font-weight="600" class="ink" text-anchor="middle">-</text>
<text x="420" y="322" font-size="14" font-weight="600" class="ink" text-anchor="middle">x</text>
<text x="40" y="348" font-size="12" font-weight="400" class="ink" text-anchor="start">setuid / setgid set</text>
<text x="300" y="348" font-size="14" font-weight="600" class="bad" text-anchor="middle">S</text>
<text x="420" y="348" font-size="14" font-weight="600" class="acct" text-anchor="middle">s</text>
<text x="40" y="374" font-size="12" font-weight="400" class="ink" text-anchor="start">sticky set</text>
<text x="300" y="374" font-size="14" font-weight="600" class="bad" text-anchor="middle">T</text>
<text x="420" y="374" font-size="14" font-weight="600" class="acct" text-anchor="middle">t</text>
<text x="500" y="298" font-size="11.5" font-weight="600" class="ink" text-anchor="start">Capital S or T is a warning sign:</text>
<text x="500" y="318" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">the special bit is set, but the x it modifies</text>
<text x="500" y="336" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">is not, so it usually has no effect.</text>
<text x="500" y="362" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Type field: 1000 regular, 0100 directory,</text>
<text x="500" y="380" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">1010 symlink, 0001 FIFO, 1100 socket,</text>
<text x="500" y="398" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">0110 block device, 0010 character device</text>
</svg>
