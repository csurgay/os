<text x="76" y="208" font-size="11" font-weight="400" class="quiet" text-anchor="end">octal</text>
<text x="176" y="208" font-size="12" font-weight="400" class="quiet" text-anchor="middle">regular file</text>
<text x="330.0" y="208" font-size="15" font-weight="600" class="ink" text-anchor="middle">7</text>
<text x="462.0" y="208" font-size="15" font-weight="600" class="ink" text-anchor="middle">7</text>
