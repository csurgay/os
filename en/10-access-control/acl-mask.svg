<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 494" width="880" height="494" role="img" aria-label="A POSIX ACL: owner, group and other classes, and the mask that caps the group class">
<title>A POSIX ACL: owner, group and other classes, and the mask that caps the group class</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .c2{fill:#d9822b}.c2s{stroke:#d9822b}.c2f{fill:#d9822b;fill-opacity:.14}.tint{fill:#f4f3ee}
  .bad{fill:#c8372d}.bads{stroke:#c8372d}.badf{fill:#c8372d;fill-opacity:.14}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}.acct{fill:#7aa9f5}
    .c2{fill:#eb9a4b}.c2s{stroke:#eb9a4b}.c2f{fill:#eb9a4b;fill-opacity:.2}.tint{fill:#22221f}
    .bad{fill:#ff7b70}.bads{stroke:#ff7b70}.badf{fill:#ff7b70;fill-opacity:.2}
  }
</style>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">A POSIX ACL: owner, group and other classes, and the mask that caps the group class</text>
<marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="edgef"/></marker>
<text x="90" y="62" font-size="12.5" font-weight="600" class="quiet" text-anchor="start">plan.txt after setfacl -m u:cons3:--- and chmod g-w</text>
<rect x="90" y="78" width="200" height="34" rx="4" class="tint"/><rect x="90" y="78" width="200" height="34" rx="4" fill="none" class="edge" stroke-width="1.25"/>
<text x="104" y="100" font-size="13" font-weight="600" class="ink" text-anchor="start">user::rw-</text>
<text x="306" y="100" font-size="11" font-weight="400" class="quiet" text-anchor="start">effective:</text>
<text x="372" y="100" font-size="13" font-weight="600" class="ink" text-anchor="start">rw-</text>
<path d="M410 95H436" fill="none" class="edge" stroke-width="1.25" marker-end="url(#a4)"/>
<text x="444" y="100" font-size="11.5" font-weight="400" class="ink" text-anchor="start">owner triple of ls -l</text>
<rect x="90" y="120" width="200" height="34" rx="4" class="accf"/><rect x="90" y="120" width="200" height="34" rx="4" fill="none" class="acc" stroke-width="2"/>
<text x="104" y="142" font-size="13" font-weight="600" class="ink" text-anchor="start">user:cons3:---</text>
<text x="306" y="142" font-size="11" font-weight="400" class="quiet" text-anchor="start">effective:</text>
<text x="372" y="142" font-size="13" font-weight="600" class="ink" text-anchor="start">---</text>
<rect x="90" y="162" width="200" height="34" rx="4" class="accf"/><rect x="90" y="162" width="200" height="34" rx="4" fill="none" class="acc" stroke-width="2"/>
<text x="104" y="184" font-size="13" font-weight="600" class="ink" text-anchor="start">group::rw-</text>
<text x="306" y="184" font-size="11" font-weight="400" class="quiet" text-anchor="start">effective:</text>
<text x="372" y="184" font-size="13" font-weight="600" class="bad" text-anchor="start">r--</text>
<rect x="90" y="204" width="200" height="34" rx="4" class="accf"/><rect x="90" y="204" width="200" height="34" rx="4" fill="none" class="acc" stroke-width="2"/>
<text x="104" y="226" font-size="13" font-weight="600" class="ink" text-anchor="start">mask::r--</text>
<text x="306" y="220" font-size="11" font-weight="400" class="quiet" text-anchor="start">caps the three</text>
<text x="306" y="234" font-size="11" font-weight="400" class="quiet" text-anchor="start">rows above</text>
<path d="M410 221H436" fill="none" class="acc" stroke-width="1.25" marker-end="url(#a4)"/>
<text x="444" y="226" font-size="11.5" font-weight="600" class="acct" text-anchor="start">group triple of ls -l</text>
<rect x="90" y="246" width="200" height="34" rx="4" class="tint"/><rect x="90" y="246" width="200" height="34" rx="4" fill="none" class="edge" stroke-width="1.25"/>
<text x="104" y="268" font-size="13" font-weight="600" class="ink" text-anchor="start">other::r--</text>
<text x="306" y="268" font-size="11" font-weight="400" class="quiet" text-anchor="start">effective:</text>
<text x="372" y="268" font-size="13" font-weight="600" class="ink" text-anchor="start">r--</text>
<path d="M410 263H436" fill="none" class="edge" stroke-width="1.25" marker-end="url(#a4)"/>
<text x="444" y="268" font-size="11.5" font-weight="400" class="ink" text-anchor="start">other triple of ls -l</text>
<path d="M82 80H76V110H82" fill="none" class="edge" stroke-width="1"/>
<text x="70" y="99.0" font-size="11" font-weight="400" class="quiet" text-anchor="end">owner</text>
<text x="70" y="113.0" font-size="11" font-weight="400" class="quiet" text-anchor="end">class</text>
<path d="M82 122H76V236H82" fill="none" class="edge" stroke-width="1"/>
<text x="70" y="183.0" font-size="11" font-weight="400" class="quiet" text-anchor="end">group</text>
<text x="70" y="197.0" font-size="11" font-weight="400" class="quiet" text-anchor="end">class</text>
<path d="M82 248H76V278H82" fill="none" class="edge" stroke-width="1"/>
<text x="70" y="267.0" font-size="11" font-weight="400" class="quiet" text-anchor="end">other</text>
<text x="70" y="281.0" font-size="11" font-weight="400" class="quiet" text-anchor="end">class</text>
<text x="640" y="114" font-size="12" font-weight="600" class="quiet" text-anchor="start">ls -l plan.txt</text>
<rect x="640" y="124" width="18" height="30" rx="3" class="tint"/><rect x="640" y="124" width="18" height="30" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="649.0" y="145" font-size="13.5" font-weight="600" class="ink" text-anchor="middle">-</text>
<rect x="662" y="124" width="46" height="30" rx="3" class="tint"/><rect x="662" y="124" width="46" height="30" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="685.0" y="145" font-size="13.5" font-weight="600" class="ink" text-anchor="middle">rw-</text>
<rect x="712" y="124" width="46" height="30" rx="3" class="accf"/><rect x="712" y="124" width="46" height="30" rx="3" fill="none" class="acc" stroke-width="2"/>
<text x="735.0" y="145" font-size="13.5" font-weight="600" class="ink" text-anchor="middle">r--</text>
<rect x="762" y="124" width="46" height="30" rx="3" class="tint"/><rect x="762" y="124" width="46" height="30" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="785.0" y="145" font-size="13.5" font-weight="600" class="ink" text-anchor="middle">r--</text>
<rect x="812" y="124" width="18" height="30" rx="3" class="tint"/><rect x="812" y="124" width="18" height="30" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="821.0" y="145" font-size="13.5" font-weight="600" class="ink" text-anchor="middle">+</text>
<text x="640" y="184" font-size="12" font-weight="600" class="acct" text-anchor="start">effective = entry AND mask:</text>
<text x="640" y="202" font-size="11.5" font-weight="400" class="ink" text-anchor="start">group::rw- AND mask::r-- = r--</text>
<rect x="40" y="300" width="800" height="74" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="56" y="324" font-size="12.5" font-weight="600" class="ink" text-anchor="start">With an ACL, the group triple is the mask</text>
<text x="56" y="344" font-size="11.5" font-weight="400" class="ink" text-anchor="start">ls -l and chmod g=… show and set the mask, not the owning group's entry, so a program that only knows the</text>
<text x="56" y="362" font-size="11.5" font-weight="400" class="ink" text-anchor="start">nine bits (chmod go-rwx) still limits every named user and group at once. "+" after the bits means: an ACL exists.</text>
<rect x="40" y="388" width="800" height="92" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="56" y="412" font-size="12.5" font-weight="600" class="ink" text-anchor="start">Default ACL (directories only): a template, not a check</text>
<text x="56" y="434" font-size="11.5" font-weight="400" class="ink" text-anchor="start">default:user:cons3:---, default:group::rwx, …  are copied into the access ACL of every new file or</text>
<text x="56" y="452" font-size="11.5" font-weight="400" class="ink" text-anchor="start">subdirectory (subdirectories also inherit the default ACL itself). The umask is then ignored; the mode</text>
<text x="56" y="470" font-size="11.5" font-weight="400" class="ink" text-anchor="start">requested by the program (0666 for files) still caps the result: the new file gets mask::rw-.</text>
</svg>
