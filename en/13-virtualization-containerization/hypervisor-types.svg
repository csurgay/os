<text x="138.0" y="287.89" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">hypervisor (VMM)</text>
<text x="138.0" y="302.39" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">runs in the most privileged mode</text>
