<text x="701.5" y="218.53" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">kernel</text>
<text x="701.5" y="250" font-size="10" font-weight="400" class="quiet" text-anchor="middle">device model</text>
<text x="24" y="376" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Type 1: the hypervisor owns the hardware. Type 2: it is a program on an ordinary OS and uses that OS's drivers.</text>
<text x="24" y="394" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">KVM makes the Linux kernel itself the hypervisor; each VM is an ordinary process (QEMU) with one thread per virtual CPU.</text>
