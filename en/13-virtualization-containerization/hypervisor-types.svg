<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">Where the hypervisor runs: type 1, type 2, and KVM</text>
<text x="24" y="62" font-size="13" font-weight="600" class="ink" text-anchor="start">Type 1 (bare metal)</text>
<text x="24" y="80" font-size="11" font-weight="400" class="quiet" text-anchor="start">Xen, VMware ESXi, Hyper-V</text>
<rect x="24" y="318" width="228" height="32" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="138.0" y="338.14" font-size="11.5" font-weight="400" class="ink" text-anchor="middle">hardware (with VT-x / AMD-V)</text>
<text x="270" y="62" font-size="13" font-weight="600" class="ink" text-anchor="start">Type 2 (hosted)</text>
<text x="270" y="80" font-size="11" font-weight="400" class="quiet" text-anchor="start">VirtualBox, VMware Workstation</text>
<rect x="270" y="318" width="228" height="32" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="384.0" y="338.14" font-size="11.5" font-weight="400" class="ink" text-anchor="middle">hardware (with VT-x / AMD-V)</text>
<text x="516" y="62" font-size="13" font-weight="600" class="ink" text-anchor="start">KVM (Linux as the hypervisor)</text>
<text x="516" y="80" font-size="11" font-weight="400" class="quiet" text-anchor="start">KVM + QEMU, Firecracker</text>
<rect x="516" y="318" width="228" height="32" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="630.0" y="338.14" font-size="11.5" font-weight="400" class="ink" text-anchor="middle">hardware (with VT-x / AMD-V)</text>
