<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 352" width="870" height="352" role="img" aria-label="One memory access: TLB, page-table walk, then the cache" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>One memory access: TLB, page-table walk, then the cache</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .c2{fill:#d9822b}.c2s{stroke:#d9822b}.c2f{fill:#d9822b;fill-opacity:.14}.tint{fill:#f4f3ee}
  .bad{fill:#c8372d}.bads{stroke:#c8372d}.badf{fill:#c8372d;fill-opacity:.14}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}.acct{fill:#7aa9f5}
    .c2{fill:#eb9a4b}.c2s{stroke:#eb9a4b}.c2f{fill:#eb9a4b;fill-opacity:.2}.tint{fill:#22221f}
    .bad{fill:#ff7b70}.bads{stroke:#ff7b70}.badf{fill:#ff7b70;fill-opacity:.2}
  }
</style>
<defs><marker id="tp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="edgef"/></marker></defs>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">One memory access: TLB, page-table walk, then the cache</text>
<rect x="40" y="60" width="170" height="34" rx="3" class="accf"/><rect x="40" y="60" width="170" height="34" rx="3" fill="none" class="acc" stroke-width="2"/>
<text x="125" y="82" font-size="12" font-weight="600" class="ink" text-anchor="middle">virtual address</text>
<rect x="270" y="50" width="160" height="54" rx="6" class="c2f"/><rect x="270" y="50" width="160" height="54" rx="6" fill="none" class="c2s" stroke-width="1.5"/>
<text x="350" y="74" font-size="13" font-weight="600" class="ink" text-anchor="middle">TLB</text>
<text x="350" y="92" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">recent translations</text>
<path d="M210 77H266" fill="none" class="edge" stroke-width="1.5" marker-end="url(#tp)"/>
<rect x="270" y="160" width="160" height="54" rx="6" class="tint"/><rect x="270" y="160" width="160" height="54" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="350" y="184" font-size="12" font-weight="600" class="ink" text-anchor="middle">page-table walk</text>
<text x="350" y="202" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">in memory (slow)</text>
<path d="M350 104V156" fill="none" class="edge" stroke-width="1.5" marker-end="url(#tp)"/>
<text x="358" y="134" font-size="11" font-weight="400" class="quiet" text-anchor="start">TLB miss</text>
<rect x="500" y="100" width="160" height="40" rx="4" class="accf"/><rect x="500" y="100" width="160" height="40" rx="4" fill="none" class="acc" stroke-width="2"/>
<text x="580" y="125" font-size="12" font-weight="600" class="ink" text-anchor="middle">physical address</text>
<path d="M430 77C470 77 480 110 496 116" fill="none" class="edge" stroke-width="1.5" marker-end="url(#tp)"/>
<text x="470" y="72" font-size="11" font-weight="400" class="quiet" text-anchor="start">TLB hit</text>
<path d="M430 187C470 187 480 134 496 128" fill="none" class="edge" stroke-width="1.5" marker-end="url(#tp)"/>
<rect x="500" y="200" width="160" height="54" rx="6" class="c2f"/><rect x="500" y="200" width="160" height="54" rx="6" fill="none" class="c2s" stroke-width="1.5"/>
<text x="580" y="224" font-size="13" font-weight="600" class="ink" text-anchor="middle">cache</text>
<text x="580" y="242" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">(previous lecture)</text>
<path d="M580 140V196" fill="none" class="edge" stroke-width="1.5" marker-end="url(#tp)"/>
<rect x="720" y="200" width="120" height="54" rx="6" class="tint"/><rect x="720" y="200" width="120" height="54" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="780" y="230" font-size="13" font-weight="600" class="ink" text-anchor="middle">RAM</text>
<path d="M660 227H716" fill="none" class="edge" stroke-width="1.5" marker-end="url(#tp)"/>
<text x="688" y="220" font-size="11" font-weight="400" class="quiet" text-anchor="middle">miss</text>
<path d="M350 214C350 300 700 300 760 258" fill="none" class="edge" stroke-width="1.2" marker-end="url(#tp)" stroke-dasharray="4 4"/>
<text x="520" y="300" font-size="11" font-weight="400" class="quiet" text-anchor="middle">the walk itself reads page-table entries through the cache</text>
<text x="24" y="336" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Valid bit 0 in the page table: a page fault, handled by the operating system, which may have to read the page from disk (milliseconds).</text>
</svg>
