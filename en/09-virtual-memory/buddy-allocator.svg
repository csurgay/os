<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 524" width="920" height="524" role="img" aria-label="The buddy allocator: splitting a block for a request, merging buddies when it is freed" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>The buddy allocator: splitting a block for a request, merging buddies when it is freed</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .c2{fill:#d9822b}.c2s{stroke:#d9822b}.c2f{fill:#d9822b;fill-opacity:.14}.tint{fill:#f4f3ee}
  .bad{fill:#c8372d}.bads{stroke:#c8372d}.badf{fill:#c8372d;fill-opacity:.14}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}.acct{fill:#7aa9f5}
    .c2{fill:#eb9a4b}.c2s{stroke:#eb9a4b}.c2f{fill:#eb9a4b;fill-opacity:.2}.tint{fill:#22221f}
    .bad{fill:#ff7b70}.bads{stroke:#ff7b70}.badf{fill:#ff7b70;fill-opacity:.2}
  }
</style>
<defs><marker id="bd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="edgef"/></marker></defs>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">The buddy allocator: splitting a block for a request, merging buddies when it is freed</text>
<text x="55.0" y="70" font-size="10" font-weight="400" class="quiet" text-anchor="middle">0</text>
<text x="85.0" y="70" font-size="10" font-weight="400" class="quiet" text-anchor="middle">1</text>
<text x="115.0" y="70" font-size="10" font-weight="400" class="quiet" text-anchor="middle">2</text>
<text x="145.0" y="70" font-size="10" font-weight="400" class="quiet" text-anchor="middle">3</text>
<text x="175.0" y="70" font-size="10" font-weight="400" class="quiet" text-anchor="middle">4</text>
<text x="205.0" y="70" font-size="10" font-weight="400" class="quiet" text-anchor="middle">5</text>
<text x="235.0" y="70" font-size="10" font-weight="400" class="quiet" text-anchor="middle">6</text>
<text x="265.0" y="70" font-size="10" font-weight="400" class="quiet" text-anchor="middle">7</text>
<text x="295.0" y="70" font-size="10" font-weight="400" class="quiet" text-anchor="middle">8</text>
<text x="325.0" y="70" font-size="10" font-weight="400" class="quiet" text-anchor="middle">9</text>
<text x="355.0" y="70" font-size="10" font-weight="400" class="quiet" text-anchor="middle">10</text>
<text x="385.0" y="70" font-size="10" font-weight="400" class="quiet" text-anchor="middle">11</text>
<text x="415.0" y="70" font-size="10" font-weight="400" class="quiet" text-anchor="middle">12</text>
<text x="445.0" y="70" font-size="10" font-weight="400" class="quiet" text-anchor="middle">13</text>
<text x="475.0" y="70" font-size="10" font-weight="400" class="quiet" text-anchor="middle">14</text>
<text x="505.0" y="70" font-size="10" font-weight="400" class="quiet" text-anchor="middle">15</text>
<text x="40" y="54" font-size="10.5" font-weight="400" class="quiet" text-anchor="start">frame number</text>
<rect x="40" y="78" width="480" height="34" rx="0" class="accf"/><rect x="40" y="78" width="480" height="34" rx="0" fill="none" class="acc" stroke-width="2"/>
<text x="280.0" y="100" font-size="11.5" font-weight="400" class="ink" text-anchor="middle">free block of order 4: 16 frames (64 KiB)</text>
<text x="544" y="93" font-size="12" font-weight="600" class="ink" text-anchor="start">1. one free block of order 4</text>
<text x="544" y="109" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">a request for 2 frames (order 1) arrives</text>
<rect x="40" y="130" width="240" height="34" rx="0" class="accf"/><rect x="40" y="130" width="240" height="34" rx="0" fill="none" class="acc" stroke-width="2"/>
<text x="160.0" y="152" font-size="11.5" font-weight="400" class="ink" text-anchor="middle">order 3</text>
<rect x="280" y="130" width="240" height="34" rx="0" class="accf"/><rect x="280" y="130" width="240" height="34" rx="0" fill="none" class="acc" stroke-width="2"/>
<text x="400.0" y="152" font-size="11.5" font-weight="400" class="ink" text-anchor="middle">order 3</text>
<text x="544" y="145" font-size="12" font-weight="600" class="ink" text-anchor="start">2. split 16 into two buddies of 8</text>
<text x="544" y="161" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">the right half goes to the order-3 free list</text>
<rect x="40" y="182" width="120" height="34" rx="0" class="accf"/><rect x="40" y="182" width="120" height="34" rx="0" fill="none" class="acc" stroke-width="2"/>
<text x="100.0" y="204" font-size="11.5" font-weight="400" class="ink" text-anchor="middle">order 2</text>
<rect x="160" y="182" width="120" height="34" rx="0" class="accf"/><rect x="160" y="182" width="120" height="34" rx="0" fill="none" class="acc" stroke-width="2"/>
<text x="220.0" y="204" font-size="11.5" font-weight="400" class="ink" text-anchor="middle">order 2</text>
<rect x="280" y="182" width="240" height="34" rx="0" class="tint"/><rect x="280" y="182" width="240" height="34" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<text x="400.0" y="204" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">on free list 3</text>
<text x="544" y="197" font-size="12" font-weight="600" class="ink" text-anchor="start">3. split 8 into two buddies of 4</text>
<text x="544" y="213" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">the right half goes to the order-2 free list</text>
<rect x="40" y="234" width="60" height="34" rx="0" class="c2f"/><rect x="40" y="234" width="60" height="34" rx="0" fill="none" class="c2s" stroke-width="1.5"/>
<text x="70.0" y="256" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">used</text>
<rect x="100" y="234" width="60" height="34" rx="0" class="accf"/><rect x="100" y="234" width="60" height="34" rx="0" fill="none" class="acc" stroke-width="2"/>
<text x="130.0" y="256" font-size="11.5" font-weight="400" class="ink" text-anchor="middle">o. 1</text>
<rect x="160" y="234" width="120" height="34" rx="0" class="tint"/><rect x="160" y="234" width="120" height="34" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<text x="220.0" y="256" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">on list 2</text>
<rect x="280" y="234" width="240" height="34" rx="0" class="tint"/><rect x="280" y="234" width="240" height="34" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<text x="400.0" y="256" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">on free list 3</text>
<text x="544" y="249" font-size="12" font-weight="600" class="ink" text-anchor="start">4. split 4 into 2 + 2, hand out frames 0-1</text>
<text x="544" y="265" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">free lists: order 1 {2}, order 2 {4}, order 3 {8}</text>
<text x="24" y="306" font-size="12.5" font-weight="600" class="ink" text-anchor="start">Freeing frames 0-1 reverses the steps: each free buddy is merged, up to the largest free block.</text>
<rect x="40" y="320" width="60" height="34" rx="0" class="accf"/><rect x="40" y="320" width="60" height="34" rx="0" fill="none" class="acc" stroke-width="2"/>
<text x="70.0" y="342" font-size="11.5" font-weight="400" class="ink" text-anchor="middle">0-1</text>
<rect x="100" y="320" width="60" height="34" rx="0" class="accf"/><rect x="100" y="320" width="60" height="34" rx="0" fill="none" class="acc" stroke-width="2"/>
<text x="130.0" y="342" font-size="11.5" font-weight="400" class="ink" text-anchor="middle">2-3</text>
<rect x="160" y="320" width="120" height="34" rx="0" class="tint"/><rect x="160" y="320" width="120" height="34" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<rect x="280" y="320" width="240" height="34" rx="0" class="tint"/><rect x="280" y="320" width="240" height="34" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<text x="544" y="335" font-size="12" font-weight="600" class="ink" text-anchor="start">5. frames 0-1 freed; buddy 2-3 is free</text>
<text x="544" y="351" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">merge: one block of order 2 at frame 0</text>
<rect x="40" y="372" width="120" height="34" rx="0" class="accf"/><rect x="40" y="372" width="120" height="34" rx="0" fill="none" class="acc" stroke-width="2"/>
<text x="100.0" y="394" font-size="11.5" font-weight="400" class="ink" text-anchor="middle">0-3</text>
<rect x="160" y="372" width="120" height="34" rx="0" class="accf"/><rect x="160" y="372" width="120" height="34" rx="0" fill="none" class="acc" stroke-width="2"/>
<text x="220.0" y="394" font-size="11.5" font-weight="400" class="ink" text-anchor="middle">4-7</text>
<rect x="280" y="372" width="240" height="34" rx="0" class="tint"/><rect x="280" y="372" width="240" height="34" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<text x="544" y="387" font-size="12" font-weight="600" class="ink" text-anchor="start">6. buddy 4-7 is free too</text>
<text x="544" y="403" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">merge: one block of order 3 at frame 0</text>
<rect x="40" y="424" width="240" height="34" rx="0" class="accf"/><rect x="40" y="424" width="240" height="34" rx="0" fill="none" class="acc" stroke-width="2"/>
<text x="160.0" y="446" font-size="11.5" font-weight="400" class="ink" text-anchor="middle">0-7</text>
<rect x="280" y="424" width="240" height="34" rx="0" class="accf"/><rect x="280" y="424" width="240" height="34" rx="0" fill="none" class="acc" stroke-width="2"/>
<text x="400.0" y="446" font-size="11.5" font-weight="400" class="ink" text-anchor="middle">8-15</text>
<text x="544" y="439" font-size="12" font-weight="600" class="ink" text-anchor="start">7. buddy 8-15 is free too</text>
<text x="544" y="455" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">merge: back to one block of order 4</text>
<text x="24" y="490" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">The buddy of a block of 2^k frames that starts at frame p starts at p XOR 2^k: frames 0-1 and 2-3 are buddies, 2-3 and 4-5 are not.</text>
<text x="24" y="508" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Linux keeps one free list per order, from order 0 (4 KiB) to order 10 (4 MiB); /proc/buddyinfo counts the blocks on each list.</text>
</svg>
