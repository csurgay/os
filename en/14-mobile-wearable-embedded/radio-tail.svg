<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 342" width="750" height="342" role="img" aria-label="A cellular radio stays in a high-power state for seconds after each transfer: batch the transfers" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>A cellular radio stays in a high-power state for seconds after each transfer: batch the transfers</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .c2{fill:#d9822b}.c2s{stroke:#d9822b}.c2f{fill:#d9822b;fill-opacity:.14}.tint{fill:#f4f3ee}
  .bad{fill:#c8372d}.bads{stroke:#c8372d}.badf{fill:#c8372d;fill-opacity:.14}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}.acct{fill:#7aa9f5}
    .c2{fill:#eb9a4b}.c2s{stroke:#eb9a4b}.c2f{fill:#eb9a4b;fill-opacity:.2}.tint{fill:#22221f}
    .bad{fill:#ff7b70}.bads{stroke:#ff7b70}.badf{fill:#ff7b70;fill-opacity:.2}
  }
</style>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">A cellular radio stays in a high-power state for seconds after each transfer: batch the transfers</text>
<text x="24" y="75.0" font-size="12.5" font-weight="600" class="ink" text-anchor="start">Unbatched</text>
<text x="24" y="91.0" font-size="11" font-weight="400" class="quiet" text-anchor="start">3 transfers, 3 tails</text>
<line x1="120.0" y1="110.0" x2="720.0" y2="110.0" class="edge" stroke-width="1.25"/>
<rect x="140.0" y="72.8" width="5.0" height="37.2" class="c2" fill-opacity="0.75"/>
<rect x="145.0" y="48.0" width="10.0" height="62.0" class="acct" fill-opacity="0.75"/>
<rect x="155.0" y="75.9" width="100.0" height="34.1" class="bad" fill-opacity="0.45"/>
<rect x="340.0" y="72.8" width="5.0" height="37.2" class="c2" fill-opacity="0.75"/>
<rect x="345.0" y="48.0" width="10.0" height="62.0" class="acct" fill-opacity="0.75"/>
<rect x="355.0" y="75.9" width="100.0" height="34.1" class="bad" fill-opacity="0.45"/>
<rect x="540.0" y="72.8" width="5.0" height="37.2" class="c2" fill-opacity="0.75"/>
<rect x="545.0" y="48.0" width="10.0" height="62.0" class="acct" fill-opacity="0.75"/>
<rect x="555.0" y="75.9" width="100.0" height="34.1" class="bad" fill-opacity="0.45"/>
<rect x="120.0" y="108.0" width="600.0" height="2.0" class="quiet" fill-opacity="0.6"/>
<text x="24" y="185.0" font-size="12.5" font-weight="600" class="ink" text-anchor="start">Batched</text>
<text x="24" y="201.0" font-size="11" font-weight="400" class="quiet" text-anchor="start">1 transfer, 1 tail</text>
<line x1="120.0" y1="220.0" x2="720.0" y2="220.0" class="edge" stroke-width="1.25"/>
<rect x="540.0" y="182.8" width="5.0" height="37.2" class="c2" fill-opacity="0.75"/>
<rect x="545.0" y="158.0" width="10.0" height="62.0" class="acct" fill-opacity="0.75"/>
<rect x="555.0" y="185.9" width="100.0" height="34.1" class="bad" fill-opacity="0.45"/>
<rect x="120.0" y="218.0" width="600.0" height="2.0" class="quiet" fill-opacity="0.6"/>
<text x="140.0" y="124" font-size="10.5" font-weight="400" class="quiet" text-anchor="start">send</text>
<text x="340.0" y="124" font-size="10.5" font-weight="400" class="quiet" text-anchor="start">send</text>
<text x="540.0" y="124" font-size="10.5" font-weight="400" class="quiet" text-anchor="start">send</text>
<text x="540.0" y="234" font-size="10.5" font-weight="400" class="quiet" text-anchor="start">send all three</text>
<text x="120.0" y="252" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">0 s</text>
<text x="320.0" y="252" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">20 s</text>
<text x="520.0" y="252" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">40 s</text>
<text x="720.0" y="252" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">60 s</text>
<rect x="24.0" y="271.0" width="12.0" height="10.0" class="c2" fill-opacity="0.75"/>
<text x="42" y="280" font-size="11" font-weight="400" class="ink" text-anchor="start">promotion: connecting to the network</text>
<rect x="274.0" y="271.0" width="12.0" height="10.0" class="acct" fill-opacity="0.75"/>
<text x="292" y="280" font-size="11" font-weight="400" class="ink" text-anchor="start">transfer</text>
<rect x="364.0" y="271.0" width="12.0" height="10.0" class="bad" fill-opacity="0.45"/>
<text x="382" y="280" font-size="11" font-weight="400" class="ink" text-anchor="start">tail: waiting in a high-power state for more data</text>
<rect x="684.0" y="271.0" width="12.0" height="10.0" class="quiet" fill-opacity="0.6"/>
<text x="702" y="280" font-size="11" font-weight="400" class="ink" text-anchor="start">idle</text>
<text x="24" y="306" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Sketch of the shape only (heights not to scale). The data sent is the same; the energy is the shaded area, and most of it is in the tails.</text>
<text x="24" y="324" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">The OS can batch: defer background syncs to a common moment (Doze maintenance windows, JobScheduler, push messages).</text>
</svg>
