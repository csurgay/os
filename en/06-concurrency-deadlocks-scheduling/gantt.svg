<text x="24" y="298" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">SJF and SRTF minimise the average waiting time but need to know the lengths in advance and can starve long jobs;</text>
<text x="24" y="316" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Round Robin waits longer on average, but every job gets the CPU soon (response time), which is what interactive users feel.</text>
