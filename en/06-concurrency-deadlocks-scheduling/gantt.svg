<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 332" width="820" height="332" role="img" aria-label="Five jobs, four schedulers" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Five jobs, four schedulers</title>
