<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 324" width="860" height="324" role="img" aria-label="Mutual exclusion in three layers" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Mutual exclusion in three layers</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .c2{fill:#d9822b}.c2s{stroke:#d9822b}.c2f{fill:#d9822b;fill-opacity:.14}.tint{fill:#f4f3ee}
  .bad{fill:#c8372d}.bads{stroke:#c8372d}.badf{fill:#c8372d;fill-opacity:.14}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}.acct{fill:#7aa9f5}
    .c2{fill:#eb9a4b}.c2s{stroke:#eb9a4b}.c2f{fill:#eb9a4b;fill-opacity:.2}.tint{fill:#22221f}
    .bad{fill:#ff7b70}.bads{stroke:#ff7b70}.badf{fill:#ff7b70;fill-opacity:.2}
  }
</style>
<defs><marker id="ly" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="edgef"/></marker></defs>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">Mutual exclusion in three layers</text>
<rect x="24" y="52" width="700" height="58" rx="8" class="tint"/><rect x="24" y="52" width="700" height="58" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="40" y="77" font-size="13.5" font-weight="600" class="ink" text-anchor="start">Application</text>
<text x="40" y="97" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Java: synchronized (monitorenter)   C++: std::mutex, std::lock_guard</text>
<rect x="24" y="126" width="700" height="58" rx="8" class="accf"/><rect x="24" y="126" width="700" height="58" rx="8" fill="none" class="acc" stroke-width="2"/>
<text x="40" y="151" font-size="13.5" font-weight="600" class="ink" text-anchor="start">Operating system</text>
<text x="40" y="171" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">mutex, semaphore, condition variable; futex: sleep and wake up only when contended</text>
<rect x="24" y="200" width="700" height="58" rx="8" class="c2f"/><rect x="24" y="200" width="700" height="58" rx="8" fill="none" class="c2s" stroke-width="1.5"/>
<text x="40" y="225" font-size="13.5" font-weight="600" class="ink" text-anchor="start">Hardware</text>
<text x="40" y="245" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">atomic instructions: xchg (test-and-set), lock cmpxchg (compare-and-swap); memory fences</text>
<path d="M742 82C770 100 770 116 742 134" fill="none" class="edge" stroke-width="1.4" marker-end="url(#ly)"/>
<path d="M742 156C770 174 770 190 742 208" fill="none" class="edge" stroke-width="1.4" marker-end="url(#ly)"/>
<text x="782" y="112" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">built on</text>
<text x="782" y="186" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">built on</text>
<text x="24" y="290" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">The fast path never leaves user space: an uncontended pthread_mutex_lock() is one lock cmpxchg. Only a thread that must</text>
<text x="24" y="308" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">wait makes a futex() system call, so that the kernel can put it to sleep and wake it later.</text>
</svg>
