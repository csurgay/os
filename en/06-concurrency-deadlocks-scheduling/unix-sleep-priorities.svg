<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 490" width="840" height="490" role="img" aria-label="Classic Unix process priorities (System V, after Bach, 1986)">
<title>Classic Unix process priorities (System V, after Bach, 1986)</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .c2{fill:#d9822b}.c2s{stroke:#d9822b}.c2f{fill:#d9822b;fill-opacity:.14}.tint{fill:#f4f3ee}
  .bad{fill:#c8372d}.bads{stroke:#c8372d}.badf{fill:#c8372d;fill-opacity:.14}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}.acct{fill:#7aa9f5}
    .c2{fill:#eb9a4b}.c2s{stroke:#eb9a4b}.c2f{fill:#eb9a4b;fill-opacity:.2}.tint{fill:#22221f}
    .bad{fill:#ff7b70}.bads{stroke:#ff7b70}.badf{fill:#ff7b70;fill-opacity:.2}
  }
</style>
<defs><marker id="up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="edgef"/></marker></defs>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">Classic Unix process priorities (System V, after Bach, 1986)</text>
<rect x="250" y="56" width="300" height="26" rx="4" class="c2f"/><rect x="250" y="56" width="300" height="26" rx="4" fill="none" class="c2s" stroke-width="1.5"/>
<text x="262" y="74" font-size="12" font-weight="600" class="ink" text-anchor="start">swapper</text>
<circle cx="572" cy="69" r="7" class="tint"/><circle cx="572" cy="69" r="7" fill="none" class="edge" stroke-width="1.5"/>
<rect x="250" y="86" width="300" height="26" rx="4" class="c2f"/><rect x="250" y="86" width="300" height="26" rx="4" fill="none" class="c2s" stroke-width="1.5"/>
<text x="262" y="104" font-size="12" font-weight="600" class="ink" text-anchor="start">waiting for disk I/O</text>
<circle cx="572" cy="99" r="7" class="tint"/><circle cx="572" cy="99" r="7" fill="none" class="edge" stroke-width="1.5"/>
<path d="M579 99H587" class="edge" stroke-width="1.5" fill="none"/>
<circle cx="594" cy="99" r="7" class="tint"/><circle cx="594" cy="99" r="7" fill="none" class="edge" stroke-width="1.5"/>
<path d="M601 99H609" class="edge" stroke-width="1.5" fill="none"/>
<circle cx="616" cy="99" r="7" class="tint"/><circle cx="616" cy="99" r="7" fill="none" class="edge" stroke-width="1.5"/>
<rect x="250" y="116" width="300" height="26" rx="4" class="c2f"/><rect x="250" y="116" width="300" height="26" rx="4" fill="none" class="c2s" stroke-width="1.5"/>
<text x="262" y="134" font-size="12" font-weight="600" class="ink" text-anchor="start">waiting for a buffer</text>
<circle cx="572" cy="129" r="7" class="tint"/><circle cx="572" cy="129" r="7" fill="none" class="edge" stroke-width="1.5"/>
<rect x="250" y="146" width="300" height="26" rx="4" class="c2f"/><rect x="250" y="146" width="300" height="26" rx="4" fill="none" class="c2s" stroke-width="1.5"/>
<text x="262" y="164" font-size="12" font-weight="600" class="ink" text-anchor="start">waiting for an inode</text>
<circle cx="572" cy="159" r="7" class="tint"/><circle cx="572" cy="159" r="7" fill="none" class="edge" stroke-width="1.5"/>
<path d="M579 159H587" class="edge" stroke-width="1.5" fill="none"/>
<circle cx="594" cy="159" r="7" class="tint"/><circle cx="594" cy="159" r="7" fill="none" class="edge" stroke-width="1.5"/>
<path d="M130 183H630" class="bads" stroke-width="2.5" fill="none"/>
<text x="636" y="187" font-size="11" font-weight="600" class="bad" text-anchor="start">PZERO: signal threshold</text>
<rect x="250" y="190" width="300" height="26" rx="4" class="accf"/><rect x="250" y="190" width="300" height="26" rx="4" fill="none" class="acc" stroke-width="2"/>
<text x="262" y="208" font-size="12" font-weight="600" class="ink" text-anchor="start">waiting for tty input</text>
<circle cx="572" cy="203" r="7" class="tint"/><circle cx="572" cy="203" r="7" fill="none" class="edge" stroke-width="1.5"/>
<path d="M579 203H587" class="edge" stroke-width="1.5" fill="none"/>
<circle cx="594" cy="203" r="7" class="tint"/><circle cx="594" cy="203" r="7" fill="none" class="edge" stroke-width="1.5"/>
<rect x="250" y="220" width="300" height="26" rx="4" class="accf"/><rect x="250" y="220" width="300" height="26" rx="4" fill="none" class="acc" stroke-width="2"/>
<text x="262" y="238" font-size="12" font-weight="600" class="ink" text-anchor="start">waiting for tty output</text>
<rect x="250" y="250" width="300" height="26" rx="4" class="accf"/><rect x="250" y="250" width="300" height="26" rx="4" fill="none" class="acc" stroke-width="2"/>
<text x="262" y="268" font-size="12" font-weight="600" class="ink" text-anchor="start">waiting for child exit</text>
<circle cx="572" cy="263" r="7" class="tint"/><circle cx="572" cy="263" r="7" fill="none" class="edge" stroke-width="1.5"/>
<path d="M130 287H630" class="edge" stroke-width="2.5" fill="none"/>
<text x="636" y="291" font-size="11" font-weight="600" class="quiet" text-anchor="start">PUSER: user base</text>
<rect x="250" y="294" width="300" height="26" rx="4" class="tint"/><rect x="250" y="294" width="300" height="26" rx="4" fill="none" class="edge" stroke-width="1.25"/>
<text x="262" y="312" font-size="12" font-weight="400" class="ink" text-anchor="start">user level 0</text>
<circle cx="572" cy="307" r="7" class="tint"/><circle cx="572" cy="307" r="7" fill="none" class="edge" stroke-width="1.5"/>
<path d="M579 307H587" class="edge" stroke-width="1.5" fill="none"/>
<circle cx="594" cy="307" r="7" class="tint"/><circle cx="594" cy="307" r="7" fill="none" class="edge" stroke-width="1.5"/>
<rect x="250" y="324" width="300" height="26" rx="4" class="tint"/><rect x="250" y="324" width="300" height="26" rx="4" fill="none" class="edge" stroke-width="1.25"/>
<text x="262" y="342" font-size="12" font-weight="400" class="ink" text-anchor="start">user level 1</text>
<circle cx="572" cy="337" r="7" class="tint"/><circle cx="572" cy="337" r="7" fill="none" class="edge" stroke-width="1.5"/>
<path d="M579 337H587" class="edge" stroke-width="1.5" fill="none"/>
<circle cx="594" cy="337" r="7" class="tint"/><circle cx="594" cy="337" r="7" fill="none" class="edge" stroke-width="1.5"/>
<path d="M601 337H609" class="edge" stroke-width="1.5" fill="none"/>
<circle cx="616" cy="337" r="7" class="tint"/><circle cx="616" cy="337" r="7" fill="none" class="edge" stroke-width="1.5"/>
<rect x="250" y="354" width="300" height="26" rx="4" class="tint"/><rect x="250" y="354" width="300" height="26" rx="4" fill="none" class="edge" stroke-width="1.25"/>
<text x="262" y="372" font-size="12" font-weight="400" class="ink" text-anchor="start">⋮</text>
<rect x="250" y="384" width="300" height="26" rx="4" class="tint"/><rect x="250" y="384" width="300" height="26" rx="4" fill="none" class="edge" stroke-width="1.25"/>
<text x="262" y="402" font-size="12" font-weight="400" class="ink" text-anchor="start">user level n</text>
<circle cx="572" cy="397" r="7" class="tint"/><circle cx="572" cy="397" r="7" fill="none" class="edge" stroke-width="1.5"/>
<path d="M244 56H236V172H244" fill="none" class="c2s" stroke-width="1.5"/>
<text x="228" y="112.0" font-size="11.5" font-weight="600" class="ink" text-anchor="end">not interruptible</text>
<text x="228" y="128.0" font-size="11" font-weight="400" class="quiet" text-anchor="end">by signals</text>
<path d="M244 190H236V276H244" fill="none" class="acc" stroke-width="1.5"/>
<text x="228" y="231.0" font-size="11.5" font-weight="600" class="ink" text-anchor="end">interruptible</text>
<text x="228" y="247.0" font-size="11" font-weight="400" class="quiet" text-anchor="end">by signals</text>
<path d="M244 294H236V410H244" fill="none" class="edge" stroke-width="1.5"/>
<text x="228" y="350.0" font-size="11.5" font-weight="600" class="ink" text-anchor="end">user mode</text>
<text x="228" y="366.0" font-size="11" font-weight="400" class="quiet" text-anchor="end">priorities</text>
<path d="M100 56V276" fill="none" class="edge" stroke-width="1.25"/>
<text x="92" y="163.0" font-size="11.5" font-weight="600" class="ink" text-anchor="end">kernel-mode</text>
<text x="92" y="179.0" font-size="11.5" font-weight="600" class="ink" text-anchor="end">sleep priorities</text>
<path d="M810 404V60" fill="none" class="edge" stroke-width="1.4" marker-end="url(#up)"/>
<text x="802" y="116" font-size="11" font-weight="400" class="quiet" text-anchor="end">higher</text>
<text x="802" y="130" font-size="11" font-weight="400" class="quiet" text-anchor="end">priority</text>
<text x="572" y="50" font-size="10.5" font-weight="400" class="quiet" text-anchor="start">queue of sleeping processes</text>
<text x="24" y="438" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">A process that goes to sleep inside the kernel gets its priority from the event it waits for, so on wake-up it runs before every</text>
<text x="24" y="456" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">user-mode process and soon releases the buffers and inodes it holds. Above PZERO a signal cannot wake it (Linux: D state);</text>
<text x="24" y="474" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">between PZERO and PUSER a signal can (Linux: S state). Lower on the ladder means a numerically larger priority value.</text>
</svg>
