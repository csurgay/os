<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-label="Two ways to move data between processes">
<title>Two ways to move data between processes</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .c2{fill:#d9822b}.c2s{stroke:#d9822b}.c2f{fill:#d9822b;fill-opacity:.14}.tint{fill:#f4f3ee}
  .bad{fill:#c8372d}.bads{stroke:#c8372d}.badf{fill:#c8372d;fill-opacity:.14}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}.acct{fill:#7aa9f5}
    .c2{fill:#eb9a4b}.c2s{stroke:#eb9a4b}.c2f{fill:#eb9a4b;fill-opacity:.2}.tint{fill:#22221f}
    .bad{fill:#ff7b70}.bads{stroke:#ff7b70}.badf{fill:#ff7b70;fill-opacity:.2}
  }
</style>
<defs><marker id="ic" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="edgef"/></marker><marker id="ica" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="acct"/></marker></defs>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">Two ways to move data between processes</text>
<text x="24" y="62" font-size="13" font-weight="600" class="ink" text-anchor="start">Pipe, socket, message queue: through the kernel</text>
<rect x="24" y="80" width="150" height="48" rx="6" class="c2f"/><rect x="24" y="80" width="150" height="48" rx="6" fill="none" class="c2s" stroke-width="1.5"/>
<text x="99.0" y="100.89" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">process A</text>
<text x="99.0" y="115.39" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">buffer in user memory</text>
<rect x="214" y="80" width="150" height="48" rx="6" class="c2f"/><rect x="214" y="80" width="150" height="48" rx="6" fill="none" class="c2s" stroke-width="1.5"/>
<text x="289.0" y="100.89" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">process B</text>
<text x="289.0" y="115.39" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">buffer in user memory</text>
<line x1="24" y1="150" x2="364" y2="150" class="grid" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="28" y="166" font-size="10.5" font-weight="400" class="quiet" text-anchor="start">kernel</text>
<rect x="104" y="196" width="180" height="48" rx="6" class="accf"/><rect x="104" y="196" width="180" height="48" rx="6" fill="none" class="acc" stroke-width="2"/>
<text x="194.0" y="216.89" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">kernel buffer</text>
<text x="194.0" y="231.39" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">pipe or socket buffer, queue</text>
<path d="M80 130C80 180 90 220 100 220" fill="none" class="edge" stroke-width="1.6" marker-end="url(#ic)"/>
<text x="36" y="196" font-size="11" font-weight="600" class="ink" text-anchor="start">write():</text>
<text x="36" y="211" font-size="11" font-weight="400" class="quiet" text-anchor="start">copy 1</text>
<path d="M288 220C300 220 310 180 300 132" fill="none" class="edge" stroke-width="1.6" marker-end="url(#ic)"/>
<text x="316" y="196" font-size="11" font-weight="600" class="ink" text-anchor="start">read():</text>
<text x="316" y="211" font-size="11" font-weight="400" class="quiet" text-anchor="start">copy 2</text>
<text x="24" y="278" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">two system calls and two copies per message;</text>
<text x="24" y="295" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">the kernel synchronises: read() sleeps until</text>
<text x="24" y="312" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">data arrive, write() sleeps while the buffer</text>
<text x="24" y="329" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">is full; works across machines (sockets)</text>
<text x="404" y="62" font-size="13" font-weight="600" class="ink" text-anchor="start">Shared memory: the same frames in both</text>
<rect x="404" y="80" width="150" height="92" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="479" y="98" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">process A</text>
<text x="479" y="114" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">virtual address space</text>
<rect x="424" y="126" width="110" height="32" rx="4" class="c2f"/><rect x="424" y="126" width="110" height="32" rx="4" fill="none" class="c2s" stroke-width="1.5"/>
<text x="479.0" y="145.96" font-size="11" font-weight="600" class="ink" text-anchor="middle">shared region</text>
<rect x="586" y="80" width="150" height="92" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="661" y="98" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">process B</text>
<text x="661" y="114" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">virtual address space</text>
<rect x="606" y="126" width="110" height="32" rx="4" class="c2f"/><rect x="606" y="126" width="110" height="32" rx="4" fill="none" class="c2s" stroke-width="1.5"/>
<text x="661.0" y="145.96" font-size="11" font-weight="600" class="ink" text-anchor="middle">shared region</text>
<line x1="404" y1="190" x2="736" y2="190" class="grid" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="408" y="206" font-size="10.5" font-weight="400" class="quiet" text-anchor="start">physical memory</text>
<rect x="500" y="218" width="140" height="36" rx="4" class="accf"/><rect x="500" y="218" width="140" height="36" rx="4" fill="none" class="acc" stroke-width="2"/>
<text x="570.0" y="239.96" font-size="11" font-weight="600" class="ink" text-anchor="middle">the same page frames</text>
<path d="M479 160C479 200 504 214 524 216" fill="none" class="edge" stroke-width="1.6" marker-end="url(#ic)"/>
<path d="M661 160C661 200 636 214 616 216" fill="none" class="edge" stroke-width="1.6" marker-end="url(#ic)"/>
<text x="404" y="278" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">after shm_open() + mmap(), stores of A are seen</text>
<text x="404" y="295" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">by B with no system call and no copy; but the</text>
<text x="404" y="312" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">processes must synchronise themselves: a</text>
<text x="404" y="329" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">semaphore, futex or atomic flag in the region</text>
</svg>
