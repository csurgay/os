<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" role="img" aria-label="Capacity, speed, cheapness: pick two — or combine two memories" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Capacity, speed, cheapness: pick two — or combine two memories</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .c2{fill:#d9822b}.c2s{stroke:#d9822b}.c2f{fill:#d9822b;fill-opacity:.14}.tint{fill:#f4f3ee}
  .bad{fill:#c8372d}.bads{stroke:#c8372d}.badf{fill:#c8372d;fill-opacity:.14}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}.acct{fill:#7aa9f5}
    .c2{fill:#eb9a4b}.c2s{stroke:#eb9a4b}.c2f{fill:#eb9a4b;fill-opacity:.2}.tint{fill:#22221f}
    .bad{fill:#ff7b70}.bads{stroke:#ff7b70}.badf{fill:#ff7b70;fill-opacity:.2}
  }
</style>
<defs><marker id="tr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="edgef"/></marker></defs>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">Capacity, speed, cheapness: pick two — or combine two memories</text>
<path d="M190 60L60 290L320 290Z" class="accf"/>
<path d="M190 60L60 290L320 290Z" fill="none" class="acc" stroke-width="2"/>
<text x="190" y="52" font-size="13" font-weight="600" class="ink" text-anchor="middle">capacity</text>
<text x="60" y="312" font-size="13" font-weight="600" class="ink" text-anchor="middle">speed</text>
<text x="320" y="312" font-size="13" font-weight="600" class="ink" text-anchor="middle">cheapness</text>
<circle cx="190" cy="215" r="6" class="c2"/>
<text x="190" y="240" font-size="11" font-weight="400" class="quiet" text-anchor="middle">any one memory:</text>
<text x="190" y="254" font-size="11" font-weight="400" class="quiet" text-anchor="middle">a compromise</text>
<text x="400" y="84" font-size="13.5" font-weight="600" class="ink" text-anchor="start">The “magic” of a two-level memory</text>
<text x="450" y="128" font-size="14" font-weight="600" class="ink" text-anchor="middle">big</text>
<text x="580" y="128" font-size="14" font-weight="600" class="ink" text-anchor="middle">small</text>
<text x="730" y="128" font-size="14" font-weight="600" class="ink" text-anchor="middle">big</text>
<text x="450" y="164" font-size="14" font-weight="600" class="ink" text-anchor="middle">slow</text>
<text x="580" y="164" font-size="14" font-weight="600" class="ink" text-anchor="middle">fast</text>
<text x="730" y="164" font-size="14" font-weight="600" class="acct" text-anchor="middle">fast</text>
<text x="450" y="200" font-size="14" font-weight="600" class="ink" text-anchor="middle">cheap</text>
<text x="580" y="200" font-size="14" font-weight="600" class="ink" text-anchor="middle">expensive</text>
<text x="730" y="200" font-size="14" font-weight="600" class="ink" text-anchor="middle">cheap</text>
<text x="510" y="164" font-size="22" font-weight="600" class="ink" text-anchor="middle">+</text>
<text x="655" y="164" font-size="22" font-weight="600" class="ink" text-anchor="middle">=</text>
<text x="450" y="228" font-size="12" font-weight="600" class="quiet" text-anchor="middle">RAM</text>
<text x="580" y="228" font-size="12" font-weight="600" class="quiet" text-anchor="middle">cache</text>
<text x="730" y="228" font-size="12" font-weight="600" class="quiet" text-anchor="middle">what the program sees</text>
<text x="400" y="270" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">… as long as most accesses hit the small, fast memory:</text>
<text x="400" y="290" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">T = H · T(cache) + (1 − H) · T(RAM), with hit rate H close to 1.</text>
</svg>
