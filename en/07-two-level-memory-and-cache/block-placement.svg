<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 240" width="860" height="240" role="img" aria-label="Where can memory block 12 go in an 8-line cache?" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Where can memory block 12 go in an 8-line cache?</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .c2{fill:#d9822b}.c2s{stroke:#d9822b}.c2f{fill:#d9822b;fill-opacity:.14}.tint{fill:#f4f3ee}
  .bad{fill:#c8372d}.bads{stroke:#c8372d}.badf{fill:#c8372d;fill-opacity:.14}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}.acct{fill:#7aa9f5}
    .c2{fill:#eb9a4b}.c2s{stroke:#eb9a4b}.c2f{fill:#eb9a4b;fill-opacity:.2}.tint{fill:#22221f}
    .bad{fill:#ff7b70}.bads{stroke:#ff7b70}.badf{fill:#ff7b70;fill-opacity:.2}
  }
</style>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">Where can memory block 12 go in an 8-line cache?</text>
<text x="24" y="66" font-size="13" font-weight="600" class="ink" text-anchor="start">direct-mapped</text>
<text x="24" y="84" font-size="11" font-weight="400" class="quiet" text-anchor="start">line 12 mod 8 = 4 only</text>
<rect x="24" y="98" width="26" height="40" rx="3" class="tint"/><rect x="24" y="98" width="26" height="40" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="37" y="154" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">0</text>
<rect x="54" y="98" width="26" height="40" rx="3" class="tint"/><rect x="54" y="98" width="26" height="40" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="67" y="154" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">1</text>
<rect x="84" y="98" width="26" height="40" rx="3" class="tint"/><rect x="84" y="98" width="26" height="40" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="97" y="154" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">2</text>
<rect x="114" y="98" width="26" height="40" rx="3" class="tint"/><rect x="114" y="98" width="26" height="40" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="127" y="154" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">3</text>
<rect x="144" y="98" width="26" height="40" rx="3" class="c2f"/><rect x="144" y="98" width="26" height="40" rx="3" fill="none" class="c2s" stroke-width="1.5"/>
<text x="157" y="154" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">4</text>
<rect x="174" y="98" width="26" height="40" rx="3" class="tint"/><rect x="174" y="98" width="26" height="40" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="187" y="154" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">5</text>
<rect x="204" y="98" width="26" height="40" rx="3" class="tint"/><rect x="204" y="98" width="26" height="40" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="217" y="154" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">6</text>
<rect x="234" y="98" width="26" height="40" rx="3" class="tint"/><rect x="234" y="98" width="26" height="40" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="247" y="154" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">7</text>
<text x="304" y="66" font-size="13" font-weight="600" class="ink" text-anchor="start">2-way set-associative</text>
<text x="304" y="84" font-size="11" font-weight="400" class="quiet" text-anchor="start">set 12 mod 4 = 0: either line of it</text>
<rect x="304" y="98" width="26" height="40" rx="3" class="c2f"/><rect x="304" y="98" width="26" height="40" rx="3" fill="none" class="c2s" stroke-width="1.5"/>
<text x="317" y="154" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">0</text>
<rect x="334" y="98" width="26" height="40" rx="3" class="c2f"/><rect x="334" y="98" width="26" height="40" rx="3" fill="none" class="c2s" stroke-width="1.5"/>
<text x="347" y="154" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">1</text>
<rect x="364" y="98" width="26" height="40" rx="3" class="tint"/><rect x="364" y="98" width="26" height="40" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="377" y="154" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">2</text>
<rect x="394" y="98" width="26" height="40" rx="3" class="tint"/><rect x="394" y="98" width="26" height="40" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="407" y="154" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">3</text>
<rect x="424" y="98" width="26" height="40" rx="3" class="tint"/><rect x="424" y="98" width="26" height="40" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="437" y="154" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">4</text>
<rect x="454" y="98" width="26" height="40" rx="3" class="tint"/><rect x="454" y="98" width="26" height="40" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="467" y="154" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">5</text>
<rect x="484" y="98" width="26" height="40" rx="3" class="tint"/><rect x="484" y="98" width="26" height="40" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="497" y="154" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">6</text>
<rect x="514" y="98" width="26" height="40" rx="3" class="tint"/><rect x="514" y="98" width="26" height="40" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="527" y="154" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">7</text>
<rect x="302" y="94" width="58" height="48" rx="5" fill="none" class="acc" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="331" y="172" font-size="10.5" font-weight="400" class="acct" text-anchor="middle">set 0</text>
<rect x="362" y="94" width="58" height="48" rx="5" fill="none" class="acc" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="391" y="172" font-size="10.5" font-weight="400" class="acct" text-anchor="middle">set 1</text>
<rect x="422" y="94" width="58" height="48" rx="5" fill="none" class="acc" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="451" y="172" font-size="10.5" font-weight="400" class="acct" text-anchor="middle">set 2</text>
<rect x="482" y="94" width="58" height="48" rx="5" fill="none" class="acc" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="511" y="172" font-size="10.5" font-weight="400" class="acct" text-anchor="middle">set 3</text>
<text x="584" y="66" font-size="13" font-weight="600" class="ink" text-anchor="start">fully associative</text>
<text x="584" y="84" font-size="11" font-weight="400" class="quiet" text-anchor="start">any line</text>
<rect x="584" y="98" width="26" height="40" rx="3" class="c2f"/><rect x="584" y="98" width="26" height="40" rx="3" fill="none" class="c2s" stroke-width="1.5"/>
<text x="597" y="154" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">0</text>
<rect x="614" y="98" width="26" height="40" rx="3" class="c2f"/><rect x="614" y="98" width="26" height="40" rx="3" fill="none" class="c2s" stroke-width="1.5"/>
<text x="627" y="154" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">1</text>
<rect x="644" y="98" width="26" height="40" rx="3" class="c2f"/><rect x="644" y="98" width="26" height="40" rx="3" fill="none" class="c2s" stroke-width="1.5"/>
<text x="657" y="154" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">2</text>
<rect x="674" y="98" width="26" height="40" rx="3" class="c2f"/><rect x="674" y="98" width="26" height="40" rx="3" fill="none" class="c2s" stroke-width="1.5"/>
<text x="687" y="154" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">3</text>
<rect x="704" y="98" width="26" height="40" rx="3" class="c2f"/><rect x="704" y="98" width="26" height="40" rx="3" fill="none" class="c2s" stroke-width="1.5"/>
<text x="717" y="154" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">4</text>
<rect x="734" y="98" width="26" height="40" rx="3" class="c2f"/><rect x="734" y="98" width="26" height="40" rx="3" fill="none" class="c2s" stroke-width="1.5"/>
<text x="747" y="154" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">5</text>
<rect x="764" y="98" width="26" height="40" rx="3" class="c2f"/><rect x="764" y="98" width="26" height="40" rx="3" fill="none" class="c2s" stroke-width="1.5"/>
<text x="777" y="154" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">6</text>
<rect x="794" y="98" width="26" height="40" rx="3" class="c2f"/><rect x="794" y="98" width="26" height="40" rx="3" fill="none" class="c2s" stroke-width="1.5"/>
<text x="807" y="154" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">7</text>
<text x="24" y="206" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">More freedom (associativity) means fewer conflict misses but more tags to compare per access. Real L1 caches are typically 4- to 12-way,</text>
<text x="24" y="224" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">L2 and L3 caches 8- to 16-way: on this machine L1 is 8-way, L2 16-way and L3 11-way, all with 64-byte lines.</text>
</svg>
