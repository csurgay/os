<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 552" width="880" height="552" role="img" aria-label="How Linux decides on a read, write or execute request: the first matching class decides">
<title>How Linux decides on a read, write or execute request: the first matching class decides</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .c2{fill:#d9822b}.c2s{stroke:#d9822b}.c2f{fill:#d9822b;fill-opacity:.14}.tint{fill:#f4f3ee}
  .bad{fill:#c8372d}.bads{stroke:#c8372d}.badf{fill:#c8372d;fill-opacity:.14}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}.acct{fill:#7aa9f5}
    .c2{fill:#eb9a4b}.c2s{stroke:#eb9a4b}.c2f{fill:#eb9a4b;fill-opacity:.2}.tint{fill:#22221f}
    .bad{fill:#ff7b70}.bads{stroke:#ff7b70}.badf{fill:#ff7b70;fill-opacity:.2}
  }
</style>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">How Linux decides on a read, write or execute request: the first matching class decides</text>
<marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="edgef"/></marker>
<rect x="40" y="56" width="340" height="56" rx="8" class="tint"/><rect x="40" y="56" width="340" height="56" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="56" y="79" font-size="12.5" font-weight="600" class="ink" text-anchor="start">1.  Does the process have CAP_DAC_OVERRIDE?</text>
<text x="76" y="98" font-size="11" font-weight="400" class="quiet" text-anchor="start">(root has it)</text>
<rect x="456" y="56" width="384" height="56" rx="8" class="accf"/><rect x="456" y="56" width="384" height="56" rx="8" fill="none" class="acc" stroke-width="2"/>
<text x="470" y="79" font-size="12.5" font-weight="600" class="ink" text-anchor="start">allowed, without looking at the bits</text>
<text x="470" y="98" font-size="11" font-weight="400" class="ink" text-anchor="start">(execute: only if some x bit is set)</text>
<path d="M380 84H454" fill="none" class="edge" stroke-width="1.5" marker-end="url(#a2)"/>
<text x="417" y="78" font-size="11" font-weight="600" class="acct" text-anchor="middle">yes</text>
<path d="M210 112V130" fill="none" class="edge" stroke-width="1.25" marker-end="url(#a2)"/>
<text x="220" y="125" font-size="11" font-weight="600" class="quiet" text-anchor="start">no</text>
<rect x="40" y="132" width="340" height="56" rx="8" class="tint"/><rect x="40" y="132" width="340" height="56" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="56" y="155" font-size="12.5" font-weight="600" class="ink" text-anchor="start">2.  Effective UID = the file's owner?</text>
<rect x="456" y="132" width="384" height="56" rx="8" class="c2f"/><rect x="456" y="132" width="384" height="56" rx="8" fill="none" class="c2s" stroke-width="1.5"/>
<text x="470" y="155" font-size="12.5" font-weight="600" class="ink" text-anchor="start">use the owner bits (user::) and stop</text>
<text x="470" y="174" font-size="11" font-weight="400" class="ink" text-anchor="start">even if group or others would allow more</text>
<path d="M380 160H454" fill="none" class="edge" stroke-width="1.5" marker-end="url(#a2)"/>
<text x="417" y="154" font-size="11" font-weight="600" class="acct" text-anchor="middle">yes</text>
<path d="M210 188V206" fill="none" class="edge" stroke-width="1.25" marker-end="url(#a2)"/>
<text x="220" y="201" font-size="11" font-weight="600" class="quiet" text-anchor="start">no</text>
<rect x="40" y="208" width="340" height="56" rx="8" class="tint"/><rect x="40" y="208" width="340" height="56" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="56" y="231" font-size="12.5" font-weight="600" class="ink" text-anchor="start">3.  A named user entry for this UID?</text>
<text x="76" y="250" font-size="11" font-weight="400" class="quiet" text-anchor="start">(only with an ACL: user:cons3:…)</text>
<rect x="456" y="208" width="384" height="56" rx="8" class="c2f"/><rect x="456" y="208" width="384" height="56" rx="8" fill="none" class="c2s" stroke-width="1.5"/>
<text x="470" y="231" font-size="12.5" font-weight="600" class="ink" text-anchor="start">use that entry AND the mask, and stop</text>
<path d="M380 236H454" fill="none" class="edge" stroke-width="1.5" marker-end="url(#a2)"/>
<text x="417" y="230" font-size="11" font-weight="600" class="acct" text-anchor="middle">yes</text>
<path d="M210 264V282" fill="none" class="edge" stroke-width="1.25" marker-end="url(#a2)"/>
<text x="220" y="277" font-size="11" font-weight="600" class="quiet" text-anchor="start">no</text>
<rect x="40" y="284" width="340" height="56" rx="8" class="tint"/><rect x="40" y="284" width="340" height="56" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="56" y="307" font-size="12.5" font-weight="600" class="ink" text-anchor="start">4.  Is the process in the owning group</text>
<text x="76" y="326" font-size="11" font-weight="400" class="quiet" text-anchor="start">or in a named group of the ACL?</text>
<rect x="456" y="284" width="384" height="56" rx="8" class="c2f"/><rect x="456" y="284" width="384" height="56" rx="8" fill="none" class="c2s" stroke-width="1.5"/>
<text x="470" y="307" font-size="12.5" font-weight="600" class="ink" text-anchor="start">allowed if a matching group entry grants it</text>
<text x="470" y="326" font-size="11" font-weight="400" class="ink" text-anchor="start">(AND the mask), otherwise denied</text>
<path d="M380 312H454" fill="none" class="edge" stroke-width="1.5" marker-end="url(#a2)"/>
<text x="417" y="306" font-size="11" font-weight="600" class="acct" text-anchor="middle">yes</text>
<path d="M210 340V358" fill="none" class="edge" stroke-width="1.25" marker-end="url(#a2)"/>
<text x="220" y="353" font-size="11" font-weight="600" class="quiet" text-anchor="start">no</text>
<rect x="40" y="360" width="340" height="56" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="56" y="383" font-size="12.5" font-weight="600" class="ink" text-anchor="start">5.  Otherwise: others</text>
<rect x="456" y="360" width="384" height="56" rx="8" class="c2f"/><rect x="456" y="360" width="384" height="56" rx="8" fill="none" class="c2s" stroke-width="1.5"/>
<text x="470" y="383" font-size="12.5" font-weight="600" class="ink" text-anchor="start">use the other bits (other::)</text>
<path d="M380 388H454" fill="none" class="edge" stroke-width="1.5" marker-end="url(#a2)"/>
<rect x="40" y="442" width="800" height="74" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="56" y="464" font-size="12.5" font-weight="600" class="ink" text-anchor="start">Example: -------rwx  john  john  note.txt</text>
<text x="56" y="484" font-size="11.5" font-weight="400" class="ink" text-anchor="start">john is the owner: step 2 matches, the owner bits are ---, so john is denied.</text>
<text x="56" y="502" font-size="11.5" font-weight="400" class="ink" text-anchor="start">user1 matches nothing until step 5: the other bits are rwx, so user1 may read. Rights do not add up.</text>
<text x="40" y="538" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Without an ACL, step 3 and the named groups do not exist and there is no mask; the bits are used as they are.</text>
</svg>
