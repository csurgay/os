<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 436" width="760" height="436" role="img" aria-label="Threat model: attackers, boundaries and the trusted computing base" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Threat model: attackers, boundaries and the trusted computing base</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .c2{fill:#d9822b}.c2s{stroke:#d9822b}.c2f{fill:#d9822b;fill-opacity:.14}.tint{fill:#f4f3ee}
  .bad{fill:#c8372d}.bads{stroke:#c8372d}.badf{fill:#c8372d;fill-opacity:.14}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}.acct{fill:#7aa9f5}
    .c2{fill:#eb9a4b}.c2s{stroke:#eb9a4b}.c2f{fill:#eb9a4b;fill-opacity:.2}.tint{fill:#22221f}
    .bad{fill:#ff7b70}.bads{stroke:#ff7b70}.badf{fill:#ff7b70;fill-opacity:.2}
  }
</style>
<defs><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="edgef"/></marker><marker id="asb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="bad"/></marker></defs>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">Threat model: attackers, boundaries and the trusted computing base</text>
<rect x="24" y="50" width="172" height="42" rx="6" class="badf"/><rect x="24" y="50" width="172" height="42" rx="6" fill="none" class="bads" stroke-width="1.5"/>
<text x="110.0" y="67.82" font-size="12" font-weight="600" class="ink" text-anchor="middle">remote attacker</text>
<text x="110.0" y="82.82" font-size="12" font-weight="400" class="quiet" text-anchor="middle">network requests</text>
<rect x="204" y="50" width="172" height="42" rx="6" class="badf"/><rect x="204" y="50" width="172" height="42" rx="6" fill="none" class="bads" stroke-width="1.5"/>
<text x="290.0" y="67.82" font-size="12" font-weight="600" class="ink" text-anchor="middle">local user or app</text>
<text x="290.0" y="82.82" font-size="12" font-weight="400" class="quiet" text-anchor="middle">runs its own code</text>
<rect x="384" y="50" width="172" height="42" rx="6" class="badf"/><rect x="384" y="50" width="172" height="42" rx="6" fill="none" class="bads" stroke-width="1.5"/>
<text x="470.0" y="67.82" font-size="12" font-weight="600" class="ink" text-anchor="middle">malicious device</text>
<text x="470.0" y="82.82" font-size="12" font-weight="400" class="quiet" text-anchor="middle">DMA, firmware</text>
<rect x="564" y="50" width="172" height="42" rx="6" class="badf"/><rect x="564" y="50" width="172" height="42" rx="6" fill="none" class="bads" stroke-width="1.5"/>
<text x="650.0" y="67.82" font-size="12" font-weight="600" class="ink" text-anchor="middle">physical access</text>
<text x="650.0" y="82.82" font-size="12" font-weight="400" class="quiet" text-anchor="middle">stolen laptop, evil maid</text>
<text x="24" y="124" font-size="12" font-weight="600" class="quiet" text-anchor="start">user space (user mode)</text>
<rect x="24" y="132" width="480" height="62" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<rect x="36" y="142" width="148" height="42" rx="6" class="c2f"/><rect x="36" y="142" width="148" height="42" rx="6" fill="none" class="c2s" stroke-width="1.5"/>
<text x="110.0" y="159.82" font-size="12" font-weight="600" class="ink" text-anchor="middle">web server</text>
<text x="110.0" y="174.82" font-size="12" font-weight="400" class="quiet" text-anchor="middle">UID www-data</text>
<rect x="190" y="142" width="148" height="42" rx="6" class="c2f"/><rect x="190" y="142" width="148" height="42" rx="6" fill="none" class="c2s" stroke-width="1.5"/>
<text x="264.0" y="159.82" font-size="12" font-weight="600" class="ink" text-anchor="middle">sandboxed app</text>
<text x="264.0" y="174.82" font-size="12" font-weight="400" class="quiet" text-anchor="middle">seccomp, MAC</text>
<rect x="344" y="142" width="148" height="42" rx="6" class="c2f"/><rect x="344" y="142" width="148" height="42" rx="6" fill="none" class="c2s" stroke-width="1.5"/>
<text x="418.0" y="159.82" font-size="12" font-weight="600" class="ink" text-anchor="middle">your shell</text>
<text x="418.0" y="174.82" font-size="12" font-weight="400" class="quiet" text-anchor="middle">UID 1000</text>
<line x1="24" y1="212" x2="504" y2="212" class="bads" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="24" y="206" font-size="11" font-weight="600" class="bad" text-anchor="start">system-call boundary: the only door into the kernel (lecture 5)</text>
<rect x="24" y="222" width="480" height="52" rx="8" class="accf"/><rect x="24" y="222" width="480" height="52" rx="8" fill="none" class="acc" stroke-width="2"/>
<text x="264.0" y="244" font-size="12.5" font-weight="600" class="ink" text-anchor="middle">kernel: reference monitor, drivers, file systems</text>
<text x="264.0" y="262" font-size="11" font-weight="400" class="quiet" text-anchor="middle">kernel mode; one bug here can defeat every check above</text>
<rect x="24" y="282" width="480" height="46" rx="8" class="accf"/><rect x="24" y="282" width="480" height="46" rx="8" fill="none" class="acc" stroke-width="2"/>
<text x="264.0" y="302" font-size="12.5" font-weight="600" class="ink" text-anchor="middle">firmware, boot loader, CPU and its microcode, TPM</text>
<text x="264.0" y="318" font-size="11" font-weight="400" class="quiet" text-anchor="middle">trusted before the kernel even starts</text>
<path d="M516 222L526 222L526 328L516 328" fill="none" class="acc" stroke-width="1.5"/>
<text x="536" y="262" font-size="12" font-weight="600" class="acct" text-anchor="start">trusted computing base</text>
<text x="536" y="280" font-size="11" font-weight="400" class="quiet" text-anchor="start">everything that must work</text>
<text x="536" y="296" font-size="11" font-weight="400" class="quiet" text-anchor="start">for the policy to hold</text>
<path d="M110 92L110 140" fill="none" class="bads" stroke-width="1.4" marker-end="url(#asb)"/>
<path d="M280 92L270 140" fill="none" class="bads" stroke-width="1.4" marker-end="url(#asb)"/>
<path d="M154 184C170 200 180 210 190 224" fill="none" class="bads" stroke-width="1.4" marker-end="url(#asb)"/>
<path d="M480 92C480 160 560 200 508 238" fill="none" class="bads" stroke-width="1.4" marker-end="url(#asb)" stroke-dasharray="4 3"/>
<path d="M720 92L720 314L508 314" fill="none" class="bads" stroke-width="1.4" marker-end="url(#asb)" stroke-dasharray="4 3"/>
<text x="24" y="356" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Typical attack: (1) exploit a bug in a network service and run code as its user; (2) exploit a kernel or setuid bug</text>
<text x="24" y="374" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">to become root (privilege escalation); (3) persist, e.g. in the boot chain. Devices attack memory directly (IOMMU),</text>
<text x="24" y="392" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">physical attackers the disk (encryption) and the boot process (Secure Boot, measured boot).</text>
<text x="24" y="418" font-size="11.5" font-weight="600" class="ink" text-anchor="start">Goals: confidentiality (read secrets), integrity (change code or data), availability (crash or exhaust the system).</text>
</svg>
