<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 404" width="760" height="404" role="img" aria-label="Trusted execution environments: who still has to be trusted?" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Trusted execution environments: who still has to be trusted?</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .c2{fill:#d9822b}.c2s{stroke:#d9822b}.c2f{fill:#d9822b;fill-opacity:.14}.tint{fill:#f4f3ee}
  .bad{fill:#c8372d}.bads{stroke:#c8372d}.badf{fill:#c8372d;fill-opacity:.14}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}.acct{fill:#7aa9f5}
    .c2{fill:#eb9a4b}.c2s{stroke:#eb9a4b}.c2f{fill:#eb9a4b;fill-opacity:.2}.tint{fill:#22221f}
    .bad{fill:#ff7b70}.bads{stroke:#ff7b70}.badf{fill:#ff7b70;fill-opacity:.2}
  }
</style>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">Trusted execution environments: who still has to be trusted?</text>
<text x="24" y="62" font-size="12.5" font-weight="600" class="ink" text-anchor="start">Arm TrustZone</text>
<rect x="24" y="74" width="226" height="32" rx="6" class="c2f"/><rect x="24" y="74" width="226" height="32" rx="6" fill="none" class="c2s" stroke-width="1.5"/>
<text x="137.0" y="94.14" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">normal world: apps</text>
<rect x="24" y="112" width="226" height="32" rx="6" class="c2f"/><rect x="24" y="112" width="226" height="32" rx="6" fill="none" class="c2s" stroke-width="1.5"/>
<text x="137.0" y="132.14" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">rich OS (Android, Linux)</text>
<rect x="24" y="150" width="226" height="32" rx="6" class="accf"/><rect x="24" y="150" width="226" height="32" rx="6" fill="none" class="acc" stroke-width="2"/>
<text x="137.0" y="170.14" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">secure world: trusted apps</text>
<rect x="24" y="188" width="226" height="32" rx="6" class="accf"/><rect x="24" y="188" width="226" height="32" rx="6" fill="none" class="acc" stroke-width="2"/>
<text x="137.0" y="208.14" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">trusted OS (e.g. OP-TEE)</text>
<rect x="24" y="226" width="226" height="32" rx="6" class="accf"/><rect x="24" y="226" width="226" height="32" rx="6" fill="none" class="acc" stroke-width="2"/>
<text x="137.0" y="246.14" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">secure monitor (EL3)</text>
<text x="24" y="280" font-size="11" font-weight="400" class="quiet" text-anchor="start">the CPU switches worlds; secure</text>
<text x="24" y="297" font-size="11" font-weight="400" class="quiet" text-anchor="start">memory and devices are invisible</text>
<text x="24" y="314" font-size="11" font-weight="400" class="quiet" text-anchor="start">to the normal world, even its kernel</text>
<text x="270" y="62" font-size="12.5" font-weight="600" class="ink" text-anchor="start">Intel SGX enclave</text>
<rect x="270" y="74" width="226" height="32" rx="6" class="c2f"/><rect x="270" y="74" width="226" height="32" rx="6" fill="none" class="c2s" stroke-width="1.5"/>
<text x="383.0" y="94.14" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">application</text>
<rect x="270" y="112" width="226" height="32" rx="6" class="accf"/><rect x="270" y="112" width="226" height="32" rx="6" fill="none" class="acc" stroke-width="2"/>
<text x="383.0" y="132.14" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">enclave (encrypted pages)</text>
<rect x="270" y="150" width="226" height="32" rx="6" class="badf"/><rect x="270" y="150" width="226" height="32" rx="6" fill="none" class="bads" stroke-width="1.5"/>
<text x="383.0" y="170.14" font-size="11.5" font-weight="400" class="ink" text-anchor="middle">operating system</text>
<rect x="270" y="188" width="226" height="32" rx="6" class="badf"/><rect x="270" y="188" width="226" height="32" rx="6" fill="none" class="bads" stroke-width="1.5"/>
<text x="383.0" y="208.14" font-size="11.5" font-weight="400" class="ink" text-anchor="middle">hypervisor</text>
<rect x="270" y="226" width="226" height="32" rx="6" class="accf"/><rect x="270" y="226" width="226" height="32" rx="6" fill="none" class="acc" stroke-width="2"/>
<text x="383.0" y="246.14" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">CPU package</text>
<text x="270" y="280" font-size="11" font-weight="400" class="quiet" text-anchor="start">only the CPU and the enclave's</text>
<text x="270" y="297" font-size="11" font-weight="400" class="quiet" text-anchor="start">code are trusted; deprecated</text>
<text x="270" y="314" font-size="11" font-weight="400" class="quiet" text-anchor="start">on client CPUs since 2021</text>
<text x="516" y="62" font-size="12.5" font-weight="600" class="ink" text-anchor="start">Confidential VM (SEV-SNP, TDX)</text>
<rect x="516" y="74" width="226" height="32" rx="6" class="accf"/><rect x="516" y="74" width="226" height="32" rx="6" fill="none" class="acc" stroke-width="2"/>
<text x="629.0" y="94.14" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">guest apps</text>
<rect x="516" y="112" width="226" height="32" rx="6" class="accf"/><rect x="516" y="112" width="226" height="32" rx="6" fill="none" class="acc" stroke-width="2"/>
<text x="629.0" y="132.14" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">guest kernel</text>
<rect x="516" y="150" width="226" height="32" rx="6" class="badf"/><rect x="516" y="150" width="226" height="32" rx="6" fill="none" class="bads" stroke-width="1.5"/>
<text x="629.0" y="170.14" font-size="11.5" font-weight="400" class="ink" text-anchor="middle">hypervisor, host OS</text>
<rect x="516" y="188" width="226" height="32" rx="6" class="badf"/><rect x="516" y="188" width="226" height="32" rx="6" fill="none" class="bads" stroke-width="1.5"/>
<text x="629.0" y="208.14" font-size="11.5" font-weight="400" class="ink" text-anchor="middle">cloud operator</text>
<rect x="516" y="226" width="226" height="32" rx="6" class="accf"/><rect x="516" y="226" width="226" height="32" rx="6" fill="none" class="acc" stroke-width="2"/>
<text x="629.0" y="246.14" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">CPU + its secure processor</text>
<text x="516" y="280" font-size="11" font-weight="400" class="quiet" text-anchor="start">the whole VM is encrypted and</text>
<text x="516" y="297" font-size="11" font-weight="400" class="quiet" text-anchor="start">integrity-protected against the</text>
<text x="516" y="314" font-size="11" font-weight="400" class="quiet" text-anchor="start">host; attested at start</text>
<rect x="24" y="344" width="18" height="14" rx="3" class="accf"/><rect x="24" y="344" width="18" height="14" rx="3" fill="none" class="acc" stroke-width="2"/>
<text x="48" y="356" font-size="11.5" font-weight="400" class="ink" text-anchor="start">trusted (part of the TCB)</text>
<rect x="234" y="344" width="18" height="14" rx="3" class="badf"/><rect x="234" y="344" width="18" height="14" rx="3" fill="none" class="bads" stroke-width="1.5"/>
<text x="258" y="356" font-size="11.5" font-weight="400" class="ink" text-anchor="start">not trusted: may be malicious</text>
<rect x="474" y="344" width="18" height="14" rx="3" class="c2f"/><rect x="474" y="344" width="18" height="14" rx="3" fill="none" class="c2s" stroke-width="1.5"/>
<text x="498" y="356" font-size="11.5" font-weight="400" class="ink" text-anchor="start">ordinary, isolated as usual</text>
<text x="24" y="386" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Apple's Secure Enclave goes one step further: a separate processor core with its own boot ROM and OS on the same chip.</text>
</svg>
