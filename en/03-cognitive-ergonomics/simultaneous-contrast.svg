<defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#111"/><stop offset="1" stop-color="#f2f2f2"/></linearGradient></defs>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">Squares A and B have exactly the same grey (#808080)</text>
<rect x="24" y="50" width="560" height="150" rx="6" fill="url(#g)"/>
<rect x="104" y="95" width="60" height="60" rx="2" fill="#808080"/>
<rect x="444" y="95" width="60" height="60" rx="2" fill="#808080"/>
<text x="134" y="132" font-size="16" font-weight="700" fill="#000" text-anchor="middle">A</text>
<text x="474" y="132" font-size="16" font-weight="700" fill="#111" text-anchor="middle">B</text>
<rect x="24" y="214" width="560" height="22" rx="2" fill="#808080"/>
<text x="304" y="229" font-size="11.5" font-weight="400" fill="#000" text-anchor="middle">the same grey on a uniform strip</text>
<text x="24" y="260" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Perceived lightness is judged relative to the surroundings, so A looks lighter than B.</text>
<text x="24" y="278" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Method: never trust the eye to compare colours; measure them (contrast.py), and test on real users.</text>
