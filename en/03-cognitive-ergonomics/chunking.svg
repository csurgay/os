</style>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">Chunking: the same information in fewer units</text>
<text x="24" y="64" font-size="13" font-weight="600" class="ink" text-anchor="start">A phone number</text>
<rect x="24" y="76" width="300" height="40" rx="6" class="tint"/><rect x="24" y="76" width="300" height="40" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="174" y="102" font-size="16" font-weight="600" class="ink" text-anchor="middle">441632960018</text>
<text x="24" y="134" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">12 digits = 12 units to hold</text>
<rect x="24" y="148" width="300" height="40" rx="6" class="accf"/><rect x="24" y="148" width="300" height="40" rx="6" fill="none" class="acc" stroke-width="2"/>
<text x="174" y="174" font-size="16" font-weight="600" class="ink" text-anchor="middle">+44  1632  960018</text>
<text x="24" y="206" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">3 familiar chunks: country, area, subscriber</text>
