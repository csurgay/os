<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 214" width="870" height="214" role="img" aria-label="Lightness shows order, hue shows groups" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Lightness shows order, hue shows groups</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .c2{fill:#d9822b}.c2s{stroke:#d9822b}.c2f{fill:#d9822b;fill-opacity:.14}.tint{fill:#f4f3ee}
  .bad{fill:#c8372d}.bads{stroke:#c8372d}.badf{fill:#c8372d;fill-opacity:.14}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}.acct{fill:#7aa9f5}
    .c2{fill:#eb9a4b}.c2s{stroke:#eb9a4b}.c2f{fill:#eb9a4b;fill-opacity:.2}.tint{fill:#22221f}
    .bad{fill:#ff7b70}.bads{stroke:#ff7b70}.badf{fill:#ff7b70;fill-opacity:.2}
  }
</style>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">Lightness shows order, hue shows groups</text>
<text x="24" y="64" font-size="13" font-weight="600" class="ink" text-anchor="start">A. Ordered data, shades of one hue</text>
<text x="24" y="82" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">CPU load of five processes: darker = more</text>
<rect x="24" y="96" width="44" height="44" rx="4" fill="#dbe7fb"/>
<text x="46" y="158" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">5%</text>
<rect x="74" y="96" width="44" height="44" rx="4" fill="#a9c6f3"/>
<text x="96" y="158" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">18%</text>
<rect x="124" y="96" width="44" height="44" rx="4" fill="#6f9fe8"/>
<text x="146" y="158" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">41%</text>
<rect x="174" y="96" width="44" height="44" rx="4" fill="#3a74d6"/>
<text x="196" y="158" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">67%</text>
<rect x="224" y="96" width="44" height="44" rx="4" fill="#1d4c9c"/>
<text x="246" y="158" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">93%</text>
<text x="24" y="186" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Anyone can sort these without a legend.</text>
<text x="300" y="64" font-size="13" font-weight="600" class="ink" text-anchor="start">B. Categories, different hues</text>
<text x="300" y="82" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">File types, as ls colours them</text>
<rect x="300" y="96" width="44" height="44" rx="4" fill="#3a74d6"/>
<text x="322" y="158" font-size="11" font-weight="400" class="quiet" text-anchor="middle">directory</text>
<rect x="350" y="96" width="44" height="44" rx="4" fill="#2e9e5b"/>
<text x="372" y="158" font-size="11" font-weight="400" class="quiet" text-anchor="middle">program</text>
<rect x="400" y="96" width="44" height="44" rx="4" fill="#d23c3c"/>
<text x="422" y="158" font-size="11" font-weight="400" class="quiet" text-anchor="middle">archive</text>
<rect x="450" y="96" width="44" height="44" rx="4" fill="#b04ad0"/>
<text x="472" y="158" font-size="11" font-weight="400" class="quiet" text-anchor="middle">image</text>
<rect x="500" y="96" width="44" height="44" rx="4" fill="#1aa6b7"/>
<text x="522" y="158" font-size="11" font-weight="400" class="quiet" text-anchor="middle">link</text>
<text x="300" y="186" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">No order is implied, only “same or different”.</text>
<text x="576" y="64" font-size="13" font-weight="600" class="ink" text-anchor="start">C. Ordered data, rainbow scale</text>
<text x="576" y="82" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Same five loads, blue (low) to red (high)</text>
<rect x="576" y="96" width="30" height="44" rx="4" fill="#2b4bd6"/>
<rect x="612" y="96" width="30" height="44" rx="4" fill="#19b5d1"/>
<rect x="648" y="96" width="30" height="44" rx="4" fill="#2fb34a"/>
<rect x="684" y="96" width="30" height="44" rx="4" fill="#f2e21b"/>
<rect x="720" y="96" width="30" height="44" rx="4" fill="#d8322b"/>
<text x="576" y="158" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Order must be learned from a legend;</text>
<text x="576" y="176" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">yellow looks lightest, steps look uneven,</text>
<text x="576" y="194" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">and colour-blind readers lose it.</text>
</svg>
