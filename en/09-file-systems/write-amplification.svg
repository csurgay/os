<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 402" width="800" height="402" role="img" aria-label="Write amplification against spare flash (simulated, ftlsim.py, random 4 KiB writes)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Write amplification against spare flash (simulated, ftlsim.py, random 4 KiB writes)</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .c2{fill:#d9822b}.c2s{stroke:#d9822b}.c2f{fill:#d9822b;fill-opacity:.14}.tint{fill:#f4f3ee}
  .bad{fill:#c8372d}.bads{stroke:#c8372d}.badf{fill:#c8372d;fill-opacity:.14}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}.acct{fill:#7aa9f5}
    .c2{fill:#eb9a4b}.c2s{stroke:#eb9a4b}.c2f{fill:#eb9a4b;fill-opacity:.2}.tint{fill:#22221f}
    .bad{fill:#ff7b70}.bads{stroke:#ff7b70}.badf{fill:#ff7b70;fill-opacity:.2}
  }
</style>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">Write amplification against spare flash (simulated, ftlsim.py, random 4 KiB writes)</text>
<line x1="80" y1="300.0" x2="760" y2="300.0" class="grid"/>
<text x="72" y="304.0" font-size="10.5" font-weight="400" class="quiet" text-anchor="end">1×</text>
<line x1="80" y1="263.1" x2="760" y2="263.1" class="grid"/>
<text x="72" y="267.0769230769231" font-size="10.5" font-weight="400" class="quiet" text-anchor="end">2×</text>
<line x1="80" y1="226.2" x2="760" y2="226.2" class="grid"/>
<text x="72" y="230.15384615384616" font-size="10.5" font-weight="400" class="quiet" text-anchor="end">3×</text>
<line x1="80" y1="189.2" x2="760" y2="189.2" class="grid"/>
<text x="72" y="193.23076923076923" font-size="10.5" font-weight="400" class="quiet" text-anchor="end">4×</text>
<line x1="80" y1="152.3" x2="760" y2="152.3" class="grid"/>
<text x="72" y="156.30769230769232" font-size="10.5" font-weight="400" class="quiet" text-anchor="end">5×</text>
<line x1="80" y1="115.4" x2="760" y2="115.4" class="grid"/>
<text x="72" y="119.38461538461539" font-size="10.5" font-weight="400" class="quiet" text-anchor="end">6×</text>
<line x1="80" y1="78.5" x2="760" y2="78.5" class="grid"/>
<text x="72" y="82.46153846153845" font-size="10.5" font-weight="400" class="quiet" text-anchor="end">7×</text>
<text x="108.93617021276596" y="318" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">7%</text>
<text x="181.27659574468083" y="318" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">12%</text>
<text x="297.02127659574467" y="318" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">20%</text>
<text x="412.7659574468085" y="318" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">28%</text>
<text x="586.3829787234042" y="318" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">40%</text>
<text x="731.063829787234" y="318" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">50%</text>
<text x="420.0" y="338" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">share of the raw flash hidden from the host (over-provisioning)</text>
<polyline points="108.9,89.2 181.3,185.9 297.0,242.4 412.8,266.8 586.4,284.5 731.1,292.2" fill="none" class="acc" stroke-width="2.5"/>
<circle cx="108.9" cy="89.2" r="4" class="acct"/>
<text x="116.93617021276596" y="81.16923076923075" font-size="11" font-weight="600" class="ink" text-anchor="start">6.71</text>
<circle cx="181.3" cy="185.9" r="4" class="acct"/>
<text x="189.27659574468083" y="177.90769230769232" font-size="11" font-weight="600" class="ink" text-anchor="start">4.09</text>
<circle cx="297.0" cy="242.4" r="4" class="acct"/>
<text x="305.02127659574467" y="234.39999999999998" font-size="11" font-weight="600" class="ink" text-anchor="start">2.56</text>
<circle cx="412.8" cy="266.8" r="4" class="acct"/>
<text x="420.7659574468085" y="258.7692307692308" font-size="11" font-weight="600" class="ink" text-anchor="start">1.90</text>
<circle cx="586.4" cy="284.5" r="4" class="acct"/>
<text x="594.3829787234042" y="276.4923076923077" font-size="11" font-weight="600" class="ink" text-anchor="start">1.42</text>
<circle cx="731.1" cy="292.2" r="4" class="acct"/>
<text x="739.063829787234" y="284.24615384615385" font-size="11" font-weight="600" class="ink" text-anchor="start">1.21</text>
<text x="24" y="370" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">For every 4 KiB the host writes, a nearly full SSD may write 6–7 times as much flash, because garbage collection copies valid pages.</text>
<text x="24" y="388" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">More spare flash (or TRIM, which tells the SSD which pages are free) lowers it; sequential writes keep it near 1.</text>
</svg>
