<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 402" width="760" height="402" role="img" aria-label="The operating system sits between the hardware and the programs" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>The operating system sits between the hardware and the programs</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .c2{fill:#d9822b}.c2s{stroke:#d9822b}.c2f{fill:#d9822b;fill-opacity:.14}.tint{fill:#f4f3ee}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}.acct{fill:#7aa9f5}
    .c2{fill:#eb9a4b}.c2s{stroke:#eb9a4b}.c2f{fill:#eb9a4b;fill-opacity:.2}.tint{fill:#22221f}
  }
</style>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">The operating system sits between the hardware and the programs</text>
<rect x="150" y="72" width="340" height="42" rx="6" class="tint"/><rect x="150" y="72" width="340" height="42" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="166" y="91" font-size="13" font-weight="600" class="ink" text-anchor="start">Application programs</text>
<text x="166" y="107" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">web browser, game, banking system</text>
<rect x="150" y="120" width="340" height="42" rx="6" class="c2f"/><rect x="150" y="120" width="340" height="42" rx="6" fill="none" class="c2s" stroke-width="1.5"/>
<text x="166" y="139" font-size="13" font-weight="600" class="ink" text-anchor="start">System programs</text>
<text x="166" y="155" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">shell, compilers, editors, utilities</text>
<rect x="150" y="168" width="340" height="42" rx="6" class="accf"/><rect x="150" y="168" width="340" height="42" rx="6" fill="none" class="acc" stroke-width="2"/>
<text x="166" y="187" font-size="13" font-weight="600" class="ink" text-anchor="start">Kernel</text>
<text x="166" y="203" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">process, memory, device and file management</text>
<rect x="150" y="216" width="340" height="42" rx="6" class="tint"/><rect x="150" y="216" width="340" height="42" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="166" y="235" font-size="13" font-weight="600" class="ink" text-anchor="start">Machine language</text>
<text x="166" y="251" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">the CPU's instruction set (ISA)</text>
<rect x="150" y="264" width="340" height="42" rx="6" class="tint"/><rect x="150" y="264" width="340" height="42" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="166" y="283" font-size="13" font-weight="600" class="ink" text-anchor="start">Microarchitecture</text>
<text x="166" y="299" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">how the CPU carries out instructions</text>
<rect x="150" y="312" width="340" height="42" rx="6" class="tint"/><rect x="150" y="312" width="340" height="42" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="166" y="331" font-size="13" font-weight="600" class="ink" text-anchor="start">Physical devices</text>
<text x="166" y="347" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">chips, wires, disks</text>
<path d="M506 168h10V210h-10" fill="none" class="acc" stroke-width="2"/>
<text x="524" y="186" font-size="11.5" font-weight="600" class="acct" text-anchor="start">the OS in the</text>
<text x="524" y="202" font-size="11.5" font-weight="600" class="acct" text-anchor="start">narrow sense</text>
<path d="M626 120h10V210h-10" fill="none" class="c2s" stroke-width="2"/>
<text x="644" y="162" font-size="11.5" font-weight="600" class="ink" text-anchor="start">the OS in the</text>
<text x="644" y="178" font-size="11.5" font-weight="600" class="ink" text-anchor="start">broad sense</text>
<line x1="142" y1="165" x2="498" y2="165" class="acc" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="138" y="148" font-size="11.5" font-weight="400" class="quiet" text-anchor="end">user mode</text>
<text x="138" y="169" font-size="11.5" font-weight="600" class="acct" text-anchor="end">system calls</text>
<text x="138" y="190" font-size="11.5" font-weight="400" class="quiet" text-anchor="end">kernel mode</text>
<text x="138" y="238" font-size="11.5" font-weight="400" class="quiet" text-anchor="end">hardware</text>
<text x="24" y="382" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Adapted from Tanenbaum (2001). Where the OS ends is a matter of definition: firmware and microcode are borderline.</text>
</svg>
