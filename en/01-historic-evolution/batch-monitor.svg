<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 404" width="760" height="404" role="img" aria-label="A batch job is a deck of cards; the monitor stays resident in memory" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>A batch job is a deck of cards; the monitor stays resident in memory</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .c2{fill:#d9822b}.c2s{stroke:#d9822b}.c2f{fill:#d9822b;fill-opacity:.14}.tint{fill:#f4f3ee}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}.acct{fill:#7aa9f5}
    .c2{fill:#eb9a4b}.c2s{stroke:#eb9a4b}.c2f{fill:#eb9a4b;fill-opacity:.2}.tint{fill:#22221f}
  }
</style>
<defs><marker id="bt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="edgef"/></marker></defs>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">A batch job is a deck of cards; the monitor stays resident in memory</text>
<text x="40" y="70" font-size="13" font-weight="600" class="ink" text-anchor="start">The job deck (read from the bottom up)</text>
<path d="M40 84H322L340 96V114H40Z" class="tint"/>
<path d="M40 84H322L340 96V114H40Z" fill="none" class="edge" stroke-width="1.25"/>
<text x="54" y="104" font-size="12.5" font-weight="400" class="ink" text-anchor="start">DAT2  data for program 2</text>
<path d="M40 118H322L340 130V148H40Z" class="tint"/>
<path d="M40 118H322L340 130V148H40Z" fill="none" class="edge" stroke-width="1.25"/>
<text x="54" y="138" font-size="12.5" font-weight="400" class="ink" text-anchor="start">PR2   program 2</text>
<path d="M40 152H322L340 164V182H40Z" class="tint"/>
<path d="M40 152H322L340 164V182H40Z" fill="none" class="edge" stroke-width="1.25"/>
<text x="54" y="172" font-size="12.5" font-weight="400" class="ink" text-anchor="start">DAT1  data for program 1</text>
<path d="M40 186H322L340 198V216H40Z" class="tint"/>
<path d="M40 186H322L340 198V216H40Z" fill="none" class="edge" stroke-width="1.25"/>
<text x="54" y="206" font-size="12.5" font-weight="400" class="ink" text-anchor="start">PR1   program 1 (source code)</text>
<path d="M40 220H322L340 232V250H40Z" class="tint"/>
<path d="M40 220H322L340 232V250H40Z" fill="none" class="edge" stroke-width="1.25"/>
<text x="54" y="240" font-size="12.5" font-weight="400" class="ink" text-anchor="start">compiler</text>
<path d="M40 254H322L340 266V284H40Z" class="tint"/>
<path d="M40 254H322L340 266V284H40Z" fill="none" class="edge" stroke-width="1.25"/>
<text x="54" y="274" font-size="12.5" font-weight="400" class="ink" text-anchor="start">loader (loads the compiler)</text>
<path d="M190.0 292V324" fill="none" class="edge" stroke-width="1.25" marker-end="url(#bt)"/>
<text x="200.0" y="314" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">card reader</text>
<text x="470" y="70" font-size="13" font-weight="600" class="ink" text-anchor="start">Main memory</text>
<rect x="470" y="84" width="220" height="92" rx="6" class="accf"/><rect x="470" y="84" width="220" height="92" rx="6" fill="none" class="acc" stroke-width="2"/>
<text x="484" y="108" font-size="13" font-weight="600" class="ink" text-anchor="start">Resident monitor</text>
<text x="484" y="130" font-size="11.5" font-weight="400" class="ink" text-anchor="start">• device routines: card reader,</text>
<text x="484" y="146" font-size="11.5" font-weight="400" class="ink" text-anchor="start">   printer, tape</text>
<text x="484" y="162" font-size="11.5" font-weight="400" class="ink" text-anchor="start">• job sequencing</text>
<rect x="470" y="176" width="220" height="172" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<text x="484" y="204" font-size="13" font-weight="600" class="ink" text-anchor="start">User program area</text>
<text x="484" y="224" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">one job at a time:</text>
<text x="484" y="240" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">compiler, then PR1, then PR2</text>
<text x="698" y="94" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">MAX</text>
<text x="698" y="348" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">0</text>
<path d="M354 186C410 186 420 264 470 264" fill="none" class="edge" stroke-width="1.25" marker-end="url(#bt)"/>
<text x="372" y="176" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">loaded</text>
<text x="24" y="384" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">The programs call the monitor's device routines instead of containing their own: the first step towards an OS.</text>
</svg>
