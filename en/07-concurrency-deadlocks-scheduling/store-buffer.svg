<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 352" width="850" height="352" role="img" aria-label="Why Peterson's algorithm fails on a modern CPU" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Why Peterson's algorithm fails on a modern CPU</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .c2{fill:#d9822b}.c2s{stroke:#d9822b}.c2f{fill:#d9822b;fill-opacity:.14}.tint{fill:#f4f3ee}
  .bad{fill:#c8372d}.bads{stroke:#c8372d}.badf{fill:#c8372d;fill-opacity:.14}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}.acct{fill:#7aa9f5}
    .c2{fill:#eb9a4b}.c2s{stroke:#eb9a4b}.c2f{fill:#eb9a4b;fill-opacity:.2}.tint{fill:#22221f}
    .bad{fill:#ff7b70}.bads{stroke:#ff7b70}.badf{fill:#ff7b70;fill-opacity:.2}
  }
</style>
<defs><marker id="ro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="edgef"/></marker></defs>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">Why Peterson's algorithm fails on a modern CPU</text>
<rect x="40" y="52" width="340" height="150" rx="8" class="tint"/><rect x="40" y="52" width="340" height="150" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="54" y="74" font-size="13" font-weight="600" class="ink" text-anchor="start">core 0  (thread 0)</text>
<text x="54" y="98" font-size="12" font-weight="400" class="ink" text-anchor="start">1. flag[0] = 1</text>
<text x="54" y="118" font-size="12" font-weight="400" class="ink" text-anchor="start">2. turn = 1</text>
<text x="54" y="138" font-size="12" font-weight="600" class="ink" text-anchor="start">3. read flag[1] → 0 (old value!)</text>
<text x="54" y="158" font-size="12" font-weight="400" class="bad" text-anchor="start">4. enter the critical section</text>
<rect x="236" y="82" width="130" height="64" rx="6" class="c2f"/><rect x="236" y="82" width="130" height="64" rx="6" fill="none" class="c2s" stroke-width="1.5"/>
<text x="301" y="102" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">store buffer</text>
<text x="301" y="120" font-size="11" font-weight="400" class="ink" text-anchor="middle">flag[0] = 1</text>
<text x="301" y="136" font-size="11" font-weight="400" class="ink" text-anchor="middle">turn = 1</text>
<path d="M301 146V246" fill="none" class="edge" stroke-width="1.4" marker-end="url(#ro)" stroke-dasharray="5 4"/>
<text x="308" y="226" font-size="11" font-weight="400" class="quiet" text-anchor="start">written later</text>
<rect x="470" y="52" width="340" height="150" rx="8" class="tint"/><rect x="470" y="52" width="340" height="150" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="484" y="74" font-size="13" font-weight="600" class="ink" text-anchor="start">core 1  (thread 1)</text>
<text x="484" y="98" font-size="12" font-weight="400" class="ink" text-anchor="start">1. flag[1] = 1</text>
<text x="484" y="118" font-size="12" font-weight="400" class="ink" text-anchor="start">2. turn = 0</text>
<text x="484" y="138" font-size="12" font-weight="600" class="ink" text-anchor="start">3. read flag[0] → 0 (old value!)</text>
<text x="484" y="158" font-size="12" font-weight="400" class="bad" text-anchor="start">4. enter the critical section</text>
<rect x="666" y="82" width="130" height="64" rx="6" class="c2f"/><rect x="666" y="82" width="130" height="64" rx="6" fill="none" class="c2s" stroke-width="1.5"/>
<text x="731" y="102" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">store buffer</text>
<text x="731" y="120" font-size="11" font-weight="400" class="ink" text-anchor="middle">flag[1] = 1</text>
<text x="731" y="136" font-size="11" font-weight="400" class="ink" text-anchor="middle">turn = 0</text>
<path d="M731 146V246" fill="none" class="edge" stroke-width="1.4" marker-end="url(#ro)" stroke-dasharray="5 4"/>
<text x="738" y="226" font-size="11" font-weight="400" class="quiet" text-anchor="start">written later</text>
<rect x="40" y="250" width="770" height="40" rx="8" class="accf"/><rect x="40" y="250" width="770" height="40" rx="8" fill="none" class="acc" stroke-width="2"/>
<text x="425" y="275" font-size="12.5" font-weight="600" class="ink" text-anchor="middle">shared memory:  flag[0] = 0,  flag[1] = 0  (still)</text>
<text x="24" y="318" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Each core's writes wait in its store buffer, while its reads go straight to memory, so each sees the other's flag still 0.</text>
<text x="24" y="336" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">A full memory fence (mfence, or lock-prefixed instruction) between steps 2 and 3 drains the buffer first and restores mutual exclusion.</text>
</svg>
