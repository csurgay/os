<text x="564.0" y="262" font-size="12" font-weight="600" class="acct" text-anchor="middle">one shared host kernel</text>
<text x="564.0" y="282" font-size="11" font-weight="400" class="quiet" text-anchor="middle">namespaces · cgroups · capabilities · seccomp</text>
<text x="564.0" y="300" font-size="11" font-weight="400" class="quiet" text-anchor="middle">OverlayFS for image layers</text>
<rect x="392.0" y="128" width="108.0" height="106" rx="6" fill="none" class="edge" stroke-width="1.25" stroke-dasharray="5 3"/>
