<text x="682.0" y="159.14" font-size="11.5" font-weight="400" class="ink" text-anchor="middle">app</text>
<rect x="634.0" y="180" width="96.0" height="48" rx="6" class="tint"/><rect x="634.0" y="180" width="96.0" height="48" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="682.0" y="200.89" font-size="11.5" font-weight="400" class="ink" text-anchor="middle">libraries,</text>
<text x="682.0" y="215.39" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">user space</text>
<text x="564.0" y="110" font-size="11" font-weight="400" class="quiet" text-anchor="middle">(processes of the host, isolated)</text>
<text x="24" y="414" font-size="11.5" font-weight="600" class="ink" text-anchor="start">isolation boundary</text>
<text x="170" y="414" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">hardware interface (VT-x, EPT)</text>
<text x="470" y="414" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">system-call interface of one kernel</text>
<text x="24" y="434" font-size="11.5" font-weight="600" class="ink" text-anchor="start">start-up, overhead</text>
<text x="170" y="434" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">seconds; a whole OS per VM</text>
<text x="470" y="434" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">milliseconds; a process per service</text>
<text x="24" y="454" font-size="11.5" font-weight="600" class="ink" text-anchor="start">may differ from host</text>
<text x="170" y="454" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">any OS, any kernel version</text>
<text x="470" y="454" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">only the user space (same kernel)</text>
<line x1="24" y1="398" x2="736" y2="398" class="grid"/>
<text x="170" y="392" font-size="11.5" font-weight="600" class="ink" text-anchor="start">virtual machine</text>
<text x="470" y="392" font-size="11.5" font-weight="600" class="ink" text-anchor="start">container</text>
