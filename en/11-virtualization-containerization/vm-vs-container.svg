<text x="392" y="64" font-size="13" font-weight="600" class="ink" text-anchor="start">Three containers</text>
<rect x="392" y="330" width="344" height="30" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="564.0" y="349.32" font-size="12" font-weight="400" class="ink" text-anchor="middle">hardware</text>
