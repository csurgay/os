<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Several programs in one RAM: who protects whom, and what if one more arrives?" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Several programs in one RAM: who protects whom, and what if one more arrives?</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .c2{fill:#d9822b}.c2s{stroke:#d9822b}.c2f{fill:#d9822b;fill-opacity:.14}.tint{fill:#f4f3ee}
  .bad{fill:#c8372d}.bads{stroke:#c8372d}.badf{fill:#c8372d;fill-opacity:.14}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}.acct{fill:#7aa9f5}
    .c2{fill:#eb9a4b}.c2s{stroke:#eb9a4b}.c2f{fill:#eb9a4b;fill-opacity:.2}.tint{fill:#22221f}
    .bad{fill:#ff7b70}.bads{stroke:#ff7b70}.badf{fill:#ff7b70;fill-opacity:.2}
  }
</style>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">Several programs in one RAM: who protects whom, and what if one more arrives?</text>
<rect x="60" y="52" width="160" height="40" rx="0" class="tint"/><rect x="60" y="52" width="160" height="40" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<text x="140" y="76.0" font-size="12" font-weight="600" class="ink" text-anchor="middle">OS</text>
<rect x="60" y="92" width="160" height="56" rx="0" class="accf"/><rect x="60" y="92" width="160" height="56" rx="0" fill="none" class="acc" stroke-width="2"/>
<text x="140" y="124.0" font-size="12" font-weight="600" class="ink" text-anchor="middle">process 1</text>
<rect x="60" y="148" width="160" height="50" rx="0" class="c2f"/><rect x="60" y="148" width="160" height="50" rx="0" fill="none" class="c2s" stroke-width="1.5"/>
<text x="140" y="177.0" font-size="12" font-weight="600" class="ink" text-anchor="middle">process 2</text>
<rect x="60" y="198" width="160" height="40" rx="0" class="accf"/><rect x="60" y="198" width="160" height="40" rx="0" fill="none" class="acc" stroke-width="2"/>
<text x="140" y="222.0" font-size="12" font-weight="600" class="ink" text-anchor="middle">process 3</text>
<rect x="60" y="238" width="160" height="24" rx="0" class="tint"/><rect x="60" y="238" width="160" height="24" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<text x="140" y="254.0" font-size="12" font-weight="400" class="quiet" text-anchor="middle">free</text>
<rect x="60" y="262" width="160" height="60" rx="0" class="c2f"/><rect x="60" y="262" width="160" height="60" rx="0" fill="none" class="c2s" stroke-width="1.5"/>
<text x="140" y="296.0" font-size="12" font-weight="600" class="ink" text-anchor="middle">process 4</text>
<rect x="60" y="322" width="160" height="30" rx="0" class="tint"/><rect x="60" y="322" width="160" height="30" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<text x="140" y="341.0" font-size="12" font-weight="400" class="quiet" text-anchor="middle">free</text>
<text x="140" y="372" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">physical RAM</text>
<rect x="260" y="120" width="120" height="70" rx="6" class="badf"/><rect x="260" y="120" width="120" height="70" rx="6" fill="none" class="bads" stroke-width="1.5"/>
<text x="320" y="150" font-size="12" font-weight="600" class="ink" text-anchor="middle">process 5</text>
<text x="320" y="168" font-size="11" font-weight="400" class="quiet" text-anchor="middle">needs 70</text>
<text x="420" y="72" font-size="13" font-weight="600" class="ink" text-anchor="start">Protection</text>
<text x="420" y="90" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">process 1 must not read or overwrite process 2 or the OS</text>
<text x="420" y="128" font-size="13" font-weight="600" class="ink" text-anchor="start">Relocation</text>
<text x="420" y="146" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">a program cannot know in advance at which address it will be loaded</text>
<text x="420" y="184" font-size="13" font-weight="600" class="ink" text-anchor="start">Fragmentation</text>
<text x="420" y="202" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">54 units are free, but in two holes: process 5 does not fit</text>
<text x="420" y="240" font-size="13" font-weight="600" class="ink" text-anchor="start">Size</text>
<text x="420" y="258" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">all processes together may need more memory than there is RAM</text>
<text x="420" y="310" font-size="11.5" font-weight="400" class="acct" text-anchor="start">Virtual memory answers all four: every process gets its own private, contiguous</text>
<text x="420" y="328" font-size="11.5" font-weight="400" class="acct" text-anchor="start">address space from 0 to max, mapped piece by piece onto RAM and the disk.</text>
</svg>
