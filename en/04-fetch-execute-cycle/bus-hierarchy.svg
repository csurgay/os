<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 776" width="760" height="776" role="img" aria-label="From one shared bus to a hierarchy of buses and links">
<title>From one shared bus to a hierarchy of buses and links</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}
  }
</style>
<defs><marker id="bh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="edgef"/></marker></defs>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">From one shared bus to a hierarchy of buses and links</text>
<text x="24" y="64" font-size="13" font-weight="600" class="quiet" text-anchor="start">A   Late 1990s: buses joined by bridges</text>
<rect x="40" y="84" width="110" height="44" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="95.0" y="111.0" font-size="13" font-weight="600" class="ink" text-anchor="middle">L2 cache</text>
