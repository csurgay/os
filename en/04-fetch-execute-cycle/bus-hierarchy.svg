<text x="282.0" y="496.0" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">with caches</text>
<rect x="368" y="456" width="140" height="52" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="438.0" y="479.0" font-size="13" font-weight="600" class="ink" text-anchor="middle">Memory</text>
<text x="438.0" y="496.0" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">controller</text>
<rect x="600" y="456" width="130" height="52" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="665.0" y="479.0" font-size="13" font-weight="600" class="ink" text-anchor="middle">DRAM</text>
<text x="665.0" y="496.0" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">DDR channels</text>
<path d="M508 482H600" fill="none" class="edge" stroke-width="2.5"/>
<path d="M196 482H212" fill="none" class="edge" stroke-width="1.25"/>
<path d="M352 482H368" fill="none" class="edge" stroke-width="1.25"/>
