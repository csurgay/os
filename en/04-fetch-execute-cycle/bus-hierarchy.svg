<rect x="30" y="572" width="140" height="44" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="100.0" y="599.0" font-size="13" font-weight="600" class="ink" text-anchor="middle">Graphics card</text>
<path d="M160 508V548H260V572" fill="none" class="edge" stroke-width="2.5"/>
<rect x="190" y="572" width="140" height="44" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="260.0" y="599.0" font-size="13" font-weight="600" class="ink" text-anchor="middle">NVMe SSD</text>
<text x="208" y="544" font-size="11" font-weight="400" class="quiet" text-anchor="start">PCIe lanes</text>
<path d="M470 524V572" fill="none" class="edge" stroke-width="2.5"/>
