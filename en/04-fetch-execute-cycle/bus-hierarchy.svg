<path d="M390 640V660" fill="none" class="edge" stroke-width="1.25"/>
<rect x="350" y="660" width="80" height="40" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="390.0" y="685.0" font-size="13" font-weight="600" class="ink" text-anchor="middle">SATA</text>
<path d="M490 640V660" fill="none" class="edge" stroke-width="1.25"/>
<rect x="450" y="660" width="80" height="40" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="490.0" y="685.0" font-size="13" font-weight="600" class="ink" text-anchor="middle">Network</text>
<path d="M590 640V660" fill="none" class="edge" stroke-width="1.25"/>
<rect x="550" y="660" width="80" height="40" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="590.0" y="685.0" font-size="13" font-weight="600" class="ink" text-anchor="middle">Audio</text>
<path d="M690 640V660" fill="none" class="edge" stroke-width="1.25"/>
<rect x="650" y="660" width="90" height="40" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="695.0" y="685.0" font-size="13" font-weight="600" class="ink" text-anchor="middle">PCIe slots</text>
<text x="24" y="742" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Every PCIe link is point-to-point: devices no longer share one bus and wait for each other.</text>
<text x="24" y="760" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Slow devices share the chipset's single link to the CPU; fast ones get their own lanes.</text>
