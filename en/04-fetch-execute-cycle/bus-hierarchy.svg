<rect x="280" y="310" width="100" height="40" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="330.0" y="335.0" font-size="13" font-weight="600" class="ink" text-anchor="middle">Printer</text>
<text x="730" y="328" font-size="11.5" font-weight="400" class="quiet" text-anchor="end">fast near the CPU, slow far away</text>
