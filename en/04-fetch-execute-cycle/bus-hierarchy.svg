<text x="52" y="444" font-size="11.5" font-weight="600" class="quiet" text-anchor="start">CPU package</text>
<rect x="56" y="456" width="140" height="52" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="126.0" y="479.0" font-size="13" font-weight="600" class="ink" text-anchor="middle">PCIe root</text>
<text x="126.0" y="496.0" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">complex</text>
<rect x="212" y="456" width="140" height="52" rx="8" class="accf"/><rect x="212" y="456" width="140" height="52" rx="8" fill="none" class="acc" stroke-width="2"/>
