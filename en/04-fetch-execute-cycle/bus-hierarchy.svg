<text x="470.0" y="599.0" font-size="13" font-weight="600" class="ink" text-anchor="middle">Chipset (PCH)</text>
<path d="M470 616V640" fill="none" class="edge" stroke-width="1.25"/>
<path d="M290 640H690" fill="none" class="edge" stroke-width="1.25"/>
<path d="M290 640V660" fill="none" class="edge" stroke-width="1.25"/>
