<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 296" width="780" height="296" role="img" aria-label="One operation, several paths: from novice to expert" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>One operation, several paths: from novice to expert</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .c2{fill:#d9822b}.c2s{stroke:#d9822b}.c2f{fill:#d9822b;fill-opacity:.14}.tint{fill:#f4f3ee}
  .bad{fill:#c8372d}.bads{stroke:#c8372d}.badf{fill:#c8372d;fill-opacity:.14}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}.acct{fill:#7aa9f5}
    .c2{fill:#eb9a4b}.c2s{stroke:#eb9a4b}.c2f{fill:#eb9a4b;fill-opacity:.2}.tint{fill:#22221f}
    .bad{fill:#ff7b70}.bads{stroke:#ff7b70}.badf{fill:#ff7b70;fill-opacity:.2}
  }
</style>
<defs><marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="edgef"/></marker></defs>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">One operation, several paths: from novice to expert</text>
<rect x="24" y="52" width="250" height="40" rx="6" class="tint"/><rect x="24" y="52" width="250" height="40" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="36" y="77" font-size="12.5" font-weight="600" class="ink" text-anchor="start">Menu: Edit → Copy</text>
<text x="292" y="70" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">visible, nothing to remember</text>
<text x="292" y="86" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">slowest: 2 targets to point at</text>
<rect x="24" y="104" width="250" height="40" rx="6" class="tint"/><rect x="24" y="104" width="250" height="40" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="36" y="129" font-size="12.5" font-weight="600" class="ink" text-anchor="start">Right-click menu</text>
<text x="292" y="122" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">visible near the object</text>
<text x="292" y="138" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">medium</text>
<rect x="24" y="156" width="250" height="40" rx="6" class="tint"/><rect x="24" y="156" width="250" height="40" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="36" y="181" font-size="12.5" font-weight="600" class="ink" text-anchor="start">Drag with the mouse (Ctrl+drag)</text>
<text x="292" y="174" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">direct manipulation</text>
<text x="292" y="190" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">fast for nearby targets</text>
<rect x="24" y="208" width="250" height="40" rx="6" class="accf"/><rect x="24" y="208" width="250" height="40" rx="6" fill="none" class="acc" stroke-width="2"/>
<text x="36" y="233" font-size="12.5" font-weight="600" class="ink" text-anchor="start">Keyboard shortcut: Ctrl+C</text>
<text x="292" y="226" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">must be recalled</text>
<text x="292" y="242" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">fastest, hands stay on keys</text>
<path d="M560 60V250" fill="none" class="edge" stroke-width="1.5" marker-end="url(#pa)"/>
<text x="574" y="70" font-size="12" font-weight="600" class="ink" text-anchor="start">novice</text>
<text x="574" y="88" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">recognition,</text>
<text x="574" y="104" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">menus show the shortcut</text>
<text x="574" y="232" font-size="12" font-weight="600" class="ink" text-anchor="start">expert</text>
<text x="574" y="250" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">recall, speed</text>
<text x="24" y="278" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">The menu teaches the shortcut by printing it next to the command: the path from novice to expert is built in.</text>
</svg>
