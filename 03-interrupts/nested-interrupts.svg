<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 530" width="760" height="530" role="img" aria-label="Nested interrupts return in reverse order, like a stack" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Nested interrupts return in reverse order, like a stack</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .bad{fill:#c8372d}.bads{stroke:#c8372d}.tint{fill:#f4f3ee}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}.acct{fill:#7aa9f5}
    .bad{fill:#ff7b70}.bads{stroke:#ff7b70}.tint{fill:#22221f}
  }
</style>
<defs><marker id="ni" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="edgef"/></marker><marker id="nia" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="acct"/></marker></defs>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">Nested interrupts return in reverse order, like a stack</text>
<text x="100.0" y="84" font-size="13" font-weight="600" class="ink" text-anchor="middle">User program</text>
<rect x="24" y="104" width="152" height="232" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<line x1="44" y1="120" x2="156" y2="120" class="grid" stroke-width="2"/>
<line x1="44" y1="140" x2="156" y2="140" class="grid" stroke-width="2"/>
<line x1="44" y1="160" x2="156" y2="160" class="grid" stroke-width="2"/>
<line x1="44" y1="180" x2="156" y2="180" class="grid" stroke-width="2"/>
<line x1="44" y1="200" x2="156" y2="200" class="grid" stroke-width="2"/>
<line x1="44" y1="220" x2="156" y2="220" class="grid" stroke-width="2"/>
<line x1="44" y1="240" x2="156" y2="240" class="grid" stroke-width="2"/>
<line x1="44" y1="260" x2="156" y2="260" class="grid" stroke-width="2"/>
<line x1="44" y1="280" x2="156" y2="280" class="grid" stroke-width="2"/>
<line x1="44" y1="300" x2="156" y2="300" class="grid" stroke-width="2"/>
<line x1="44" y1="320" x2="156" y2="320" class="grid" stroke-width="2"/>
<text x="380.0" y="84" font-size="13" font-weight="600" class="ink" text-anchor="middle">Interrupt handler</text>
<rect x="304" y="104" width="152" height="232" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<line x1="324" y1="120" x2="436" y2="120" class="grid" stroke-width="2"/>
<line x1="324" y1="140" x2="436" y2="140" class="grid" stroke-width="2"/>
<line x1="324" y1="160" x2="436" y2="160" class="grid" stroke-width="2"/>
<line x1="324" y1="180" x2="436" y2="180" class="grid" stroke-width="2"/>
<line x1="324" y1="200" x2="436" y2="200" class="grid" stroke-width="2"/>
<line x1="324" y1="220" x2="436" y2="220" class="grid" stroke-width="2"/>
<line x1="324" y1="240" x2="436" y2="240" class="grid" stroke-width="2"/>
<line x1="324" y1="260" x2="436" y2="260" class="grid" stroke-width="2"/>
<line x1="324" y1="280" x2="436" y2="280" class="grid" stroke-width="2"/>
<line x1="324" y1="300" x2="436" y2="300" class="grid" stroke-width="2"/>
<line x1="324" y1="320" x2="436" y2="320" class="grid" stroke-width="2"/>
<text x="660.0" y="84" font-size="13" font-weight="600" class="ink" text-anchor="middle">High-priority handler</text>
<rect x="584" y="104" width="152" height="232" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<line x1="604" y1="120" x2="716" y2="120" class="grid" stroke-width="2"/>
<line x1="604" y1="140" x2="716" y2="140" class="grid" stroke-width="2"/>
<line x1="604" y1="160" x2="716" y2="160" class="grid" stroke-width="2"/>
<line x1="604" y1="180" x2="716" y2="180" class="grid" stroke-width="2"/>
<line x1="604" y1="200" x2="716" y2="200" class="grid" stroke-width="2"/>
<line x1="604" y1="220" x2="716" y2="220" class="grid" stroke-width="2"/>
<line x1="604" y1="240" x2="716" y2="240" class="grid" stroke-width="2"/>
<line x1="604" y1="260" x2="716" y2="260" class="grid" stroke-width="2"/>
<line x1="604" y1="280" x2="716" y2="280" class="grid" stroke-width="2"/>
<line x1="604" y1="300" x2="716" y2="300" class="grid" stroke-width="2"/>
<line x1="604" y1="320" x2="716" y2="320" class="grid" stroke-width="2"/>
<text x="36" y="124" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">0</text>
<text x="36" y="144" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">1</text>
<text x="36" y="164" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">2</text>
<text x="36" y="184" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">3</text>
<circle cx="156" cy="160" r="4" class="acct"/>
<circle cx="436" cy="220" r="4" class="acct"/>
<text x="330" y="116" font-size="11.5" font-weight="400" class="acct" text-anchor="start">save registers</text>
<text x="330" y="336" font-size="11.5" font-weight="400" class="acct" text-anchor="start">restore, return</text>
<path d="M176 160C230 160 250 120 304 120" fill="none" class="acc" stroke-width="1.5" marker-end="url(#nia)"/>
<path d="M304 320C240 320 230 180 176 180" fill="none" class="edge" stroke-width="1.25" marker-end="url(#ni)"/>
<path d="M456 220C510 220 530 120 584 120" fill="none" class="acc" stroke-width="1.5" marker-end="url(#nia)"/>
<path d="M584 300C520 300 510 240 456 240" fill="none" class="edge" stroke-width="1.25" marker-end="url(#ni)"/>
<text x="240" y="106" font-size="11.5" font-weight="600" class="acct" text-anchor="middle">interrupt</text>
<text x="240" y="354" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">return to address 3</text>
<text x="520" y="106" font-size="11.5" font-weight="600" class="acct" text-anchor="middle">higher-priority interrupt</text>
<text x="520" y="354" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">back to handler</text>
<text x="24" y="396" font-size="13" font-weight="600" class="ink" text-anchor="start">The stack while the high-priority handler runs</text>
<rect x="24" y="410" width="260" height="30" rx="8" class="accf"/><rect x="24" y="410" width="260" height="30" rx="8" fill="none" class="acc" stroke-width="2"/>
<text x="36" y="430" font-size="12.5" font-weight="400" class="ink" text-anchor="start">PC + PSW of the first handler</text>
<rect x="24" y="446" width="260" height="30" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="36" y="466" font-size="12.5" font-weight="400" class="ink" text-anchor="start">PC = 3 + PSW of the user program</text>
<text x="300" y="430" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">← top: popped first</text>
<text x="300" y="466" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">← popped last</text>
<text x="330" y="508" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">A lower-priority request that arrives meanwhile waits until the higher one is done.</text>
</svg>
