<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-label="An interrupt is only taken between two instructions" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>An interrupt is only taken between two instructions</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .bad{fill:#c8372d}.bads{stroke:#c8372d}.tint{fill:#f4f3ee}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}.acct{fill:#7aa9f5}
    .bad{fill:#ff7b70}.bads{stroke:#ff7b70}.tint{fill:#22221f}
  }
</style>
<defs><marker id="ic" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="edgef"/></marker></defs>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">An interrupt is only taken between two instructions</text>
<path d="M28.0 108V98H484.0V108" fill="none" class="acc" stroke-width="2"/>
<text x="256.0" y="88" font-size="11.5" font-weight="600" class="acct" text-anchor="middle">atomic: one instruction, never interrupted halfway</text>
<path d="M164.0 150H188.0" fill="none" class="edge" stroke-width="1.25" marker-end="url(#ic)"/>
<path d="M324.0 150H348.0" fill="none" class="edge" stroke-width="1.25" marker-end="url(#ic)"/>
<path d="M484.0 150H536" fill="none" class="edge" stroke-width="1.25" marker-end="url(#ic)"/>
<path d="M480.0 268H96V178.0" fill="none" class="edge" stroke-width="1.25" marker-end="url(#ic)"/>
<path d="M600 190V240" fill="none" class="edge" stroke-width="1.25" marker-end="url(#ic)"/>
<path d="M664 150H736V320H14V150H28.0" fill="none" class="edge" stroke-width="1.25" marker-end="url(#ic)"/>
<rect x="28.0" y="122.0" width="136" height="56" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="96" y="146" font-size="13" font-weight="600" class="ink" text-anchor="middle">Fetch</text>
<text x="96" y="164" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">fetch instruction</text>
<rect x="188.0" y="122.0" width="136" height="56" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="256" y="146" font-size="13" font-weight="600" class="ink" text-anchor="middle">Decode</text>
<text x="256" y="164" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">decode CIR</text>
<rect x="348.0" y="122.0" width="136" height="56" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="416" y="146" font-size="13" font-weight="600" class="ink" text-anchor="middle">Execute</text>
<text x="416" y="164" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">operate or jump</text>
<polygon points="536,150 600,110 664,150 600,190" class="accf"/><polygon points="536,150 600,110 664,150 600,190" fill="none" class="acc" stroke-width="2"/>
<text x="600" y="148" font-size="13" font-weight="600" class="ink" text-anchor="middle">Interrupt</text>
<text x="600" y="164" font-size="13" font-weight="600" class="ink" text-anchor="middle">pending?</text>
<rect x="480.0" y="240" width="240" height="56" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="600" y="264" font-size="13" font-weight="600" class="ink" text-anchor="middle">Interrupt handler</text>
<text x="600" y="282" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">PC already points to the next instruction</text>
<text x="610" y="214" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">yes</text>
<text x="728" y="142" font-size="11.5" font-weight="400" class="quiet" text-anchor="end">no</text>
<text x="288.0" y="260" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">the handler is fetched like any other code</text>
<text x="400" y="338" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">no interrupt: straight on to the next instruction</text>
</svg>
