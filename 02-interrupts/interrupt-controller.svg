<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 384" width="760" height="384" role="img" aria-label="Devices signal the interrupt controller, the controller interrupts a CPU core" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Devices signal the interrupt controller, the controller interrupts a CPU core</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .bad{fill:#c8372d}.bads{stroke:#c8372d}.tint{fill:#f4f3ee}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}.acct{fill:#7aa9f5}
    .bad{fill:#ff7b70}.bads{stroke:#ff7b70}.tint{fill:#22221f}
  }
</style>
<defs><marker id="ctl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="edgef"/></marker></defs>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">Devices signal the interrupt controller, the controller interrupts a CPU core</text>
<rect x="24" y="58" width="150" height="44" rx="8" class="tint"/><rect x="24" y="58" width="150" height="44" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="40" y="85" font-size="13" font-weight="600" class="ink" text-anchor="start">Disk</text>
<path d="M174 80H300" fill="none" class="edge" stroke-width="1.25" marker-end="url(#ctl)"/>
<rect x="24" y="128" width="150" height="44" rx="8" class="tint"/><rect x="24" y="128" width="150" height="44" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="40" y="155" font-size="13" font-weight="600" class="ink" text-anchor="start">Network card</text>
<path d="M174 150H300" fill="none" class="edge" stroke-width="1.25" marker-end="url(#ctl)"/>
<rect x="24" y="198" width="150" height="44" rx="8" class="tint"/><rect x="24" y="198" width="150" height="44" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="40" y="225" font-size="13" font-weight="600" class="ink" text-anchor="start">Keyboard</text>
<path d="M174 220H300" fill="none" class="edge" stroke-width="1.25" marker-end="url(#ctl)"/>
<rect x="24" y="268" width="150" height="44" rx="8" class="tint"/><rect x="24" y="268" width="150" height="44" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="40" y="295" font-size="13" font-weight="600" class="ink" text-anchor="start">Timer chip</text>
<path d="M174 290H300" fill="none" class="edge" stroke-width="1.25" marker-end="url(#ctl)"/>
<text x="237" y="66" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">IRQ lines</text>
<rect x="300" y="56" width="190" height="256" rx="8" class="accf"/><rect x="300" y="56" width="190" height="256" rx="8" fill="none" class="acc" stroke-width="2"/>
<text x="316" y="84" font-size="13" font-weight="600" class="ink" text-anchor="start">Interrupt controller</text>
<text x="316" y="104" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">(PIC, or I/O APIC on PCs)</text>
<text x="316" y="136" font-size="12.5" font-weight="400" class="ink" text-anchor="start">• one input per device</text>
<text x="316" y="158" font-size="12.5" font-weight="400" class="ink" text-anchor="start">• priorities, masking</text>
<text x="316" y="180" font-size="12.5" font-weight="400" class="ink" text-anchor="start">• picks the vector number</text>
<text x="316" y="202" font-size="12.5" font-weight="400" class="ink" text-anchor="start">• picks which core</text>
<text x="316" y="224" font-size="12.5" font-weight="400" class="ink" text-anchor="start">• waits for the handler's</text>
<text x="316" y="246" font-size="12.5" font-weight="400" class="ink" text-anchor="start">   end-of-interrupt (EOI)</text>
<rect x="600" y="70" width="136" height="80" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="616" y="98" font-size="13" font-weight="600" class="ink" text-anchor="start">CPU core 0</text>
<text x="616" y="118" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">local APIC,</text>
<text x="616" y="134" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">own timer</text>
<path d="M490 110H600" fill="none" class="edge" stroke-width="1.25" marker-end="url(#ctl)"/>
<rect x="600" y="210" width="136" height="80" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="616" y="238" font-size="13" font-weight="600" class="ink" text-anchor="start">CPU core 1</text>
<text x="616" y="258" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">local APIC,</text>
<text x="616" y="274" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">own timer</text>
<path d="M490 250H600" fill="none" class="edge" stroke-width="1.25" marker-end="url(#ctl)"/>
<text x="545" y="86" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">interrupt +</text>
<text x="545" y="102" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">vector number</text>
<path d="M668 150V210" fill="none" class="edge" stroke-width="1.25" marker-end="url(#ctl)" marker-start="url(#ctl)"/>
<text x="676" y="184" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">IPI</text>
<text x="24" y="346" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Modern PCI Express devices can skip the wires: with MSI they write a short message to a special memory</text>
<text x="24" y="362" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">address instead. These are the PCI-MSIX rows in /proc/interrupts.</text>
</svg>
