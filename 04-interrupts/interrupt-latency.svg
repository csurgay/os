<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 236" width="760" height="236" role="img" aria-label="Interrupt latency adds up from several waits" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Interrupt latency adds up from several waits</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .bad{fill:#c8372d}.bads{stroke:#c8372d}.tint{fill:#f4f3ee}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}.acct{fill:#7aa9f5}
    .bad{fill:#ff7b70}.bads{stroke:#ff7b70}.tint{fill:#22221f}
  }
</style>
<defs><marker id="lat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="edgef"/></marker></defs>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">Interrupt latency adds up from several waits</text>
<rect x="40" y="96" width="120" height="52" rx="8" class="tint"/><rect x="40" y="96" width="120" height="52" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="50" y="118" font-size="11.5" font-weight="600" class="ink" text-anchor="start">finish current</text>
<text x="50" y="134" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">instruction</text>
<rect x="172" y="96" width="172" height="52" rx="8" class="accf"/><rect x="172" y="96" width="172" height="52" rx="8" fill="none" class="acc" stroke-width="2"/>
<text x="182" y="118" font-size="11.5" font-weight="600" class="ink" text-anchor="start">interrupts are</text>
<text x="182" y="134" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">switched off (masked)</text>
<rect x="356" y="96" width="128" height="52" rx="8" class="tint"/><rect x="356" y="96" width="128" height="52" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="366" y="118" font-size="11.5" font-weight="600" class="ink" text-anchor="start">hardware entry:</text>
<text x="366" y="134" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">save PC and PSW</text>
<rect x="496" y="96" width="112" height="52" rx="8" class="tint"/><rect x="496" y="96" width="112" height="52" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="506" y="118" font-size="11.5" font-weight="600" class="ink" text-anchor="start">handler saves</text>
<text x="506" y="134" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">registers</text>
<rect x="620" y="96" width="112" height="52" rx="8" class="tint"/><rect x="620" y="96" width="112" height="52" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="630" y="118" font-size="11.5" font-weight="600" class="ink" text-anchor="start">urgent work</text>
<text x="630" y="134" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">(top half)</text>
<path d="M40 72V92" fill="none" class="edge" stroke-width="1.25" marker-end="url(#lat)"/>
<text x="48" y="72" font-size="11.5" font-weight="600" class="ink" text-anchor="start">device raises IR</text>
<path d="M40 158V166H608V158" fill="none" class="acc" stroke-width="2"/>
<text x="324.0" y="186" font-size="11.5" font-weight="600" class="acct" text-anchor="middle">interrupt latency: from the request to the first useful instruction of the handler</text>
<text x="24" y="216" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Highlighted: usually the longest and least predictable part. Keeping interrupts switched off only briefly is what keeps latency low.</text>
</svg>
