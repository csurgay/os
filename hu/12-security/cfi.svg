<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 408" width="760" height="408" role="img" aria-label="Hardveres control-flow integrity: shadow stack és landing padek">
<title>Hardveres control-flow integrity: shadow stack és landing padek</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .c2{fill:#d9822b}.c2s{stroke:#d9822b}.c2f{fill:#d9822b;fill-opacity:.14}.tint{fill:#f4f3ee}
  .bad{fill:#c8372d}.bads{stroke:#c8372d}.badf{fill:#c8372d;fill-opacity:.14}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}.acct{fill:#7aa9f5}
    .c2{fill:#eb9a4b}.c2s{stroke:#eb9a4b}.c2f{fill:#eb9a4b;fill-opacity:.2}.tint{fill:#22221f}
    .bad{fill:#ff7b70}.bads{stroke:#ff7b70}.badf{fill:#ff7b70;fill-opacity:.2}
  }
</style>
<defs><marker id="cf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="edgef"/></marker><marker id="cfb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="bad"/></marker><marker id="cfa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="acct"/></marker></defs>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">Hardveres control-flow integrity: shadow stack és landing padek</text>
<text x="24" y="62" font-size="12.5" font-weight="600" class="ink" text-anchor="start">Visszafelé mutató élek: a shadow stack (Intel CET SS)</text>
<text x="24" y="98" font-size="11" font-weight="600" class="quiet" text-anchor="start">adatverem (írható)</text>
<text x="214" y="98" font-size="11" font-weight="600" class="quiet" text-anchor="start">shadow stack (védett lapokon)</text>
<rect x="24" y="106" width="150" height="28" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="99.0" y="124.14" font-size="11.5" font-weight="400" class="ink" text-anchor="middle">lokális változók</text>
<rect x="24" y="140" width="150" height="28" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="99.0" y="158.14" font-size="11.5" font-weight="400" class="ink" text-anchor="middle">elmentett rbp</text>
<rect x="24" y="174" width="150" height="28" rx="6" class="badf"/><rect x="24" y="174" width="150" height="28" rx="6" fill="none" class="bads" stroke-width="1.5"/>
<text x="99.0" y="192.14" font-size="11.5" font-weight="400" class="ink" text-anchor="middle">visszatérési cím</text>
<rect x="214" y="174" width="150" height="28" rx="6" class="accf"/><rect x="214" y="174" width="150" height="28" rx="6" fill="none" class="acc" stroke-width="2"/>
<text x="289.0" y="192.14" font-size="11.5" font-weight="400" class="ink" text-anchor="middle">visszatérési cím (másolat)</text>
<text x="24" y="224" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">A CALL mindkét verembe beírja a visszatérési címet.</text>
<text x="24" y="242" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">A RET mindkettőt kiveszi és összeveti:</text>
<rect x="24" y="254" width="340" height="40" rx="6" class="badf"/><rect x="24" y="254" width="340" height="40" rx="6" fill="none" class="bads" stroke-width="1.5"/>
<text x="194.0" y="270.89" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">eltérnek → control-protection kivétel (#CP)</text>
<text x="194.0" y="285.39" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">a folyamat leáll, mielőtt ugrana</text>
<path d="M176 189L210 189" fill="none" class="acc" stroke-width="1.4" marker-end="url(#cfa)"/>
<text x="193" y="182" font-size="11" font-weight="600" class="acct" text-anchor="middle">=?</text>
<text x="24" y="318" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Arm: a PAC titkos kulccsal aláírja a visszatérési</text>
<text x="24" y="336" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">címet a fel nem használt felső bitjeibe; az AUT a RET előtt ellenőrzi.</text>
<text x="400" y="62" font-size="12.5" font-weight="600" class="ink" text-anchor="start">Előre mutató élek: landing padek (Intel IBT, Arm BTI)</text>
<rect x="400" y="82" width="130" height="36" rx="6" class="c2f"/><rect x="400" y="82" width="130" height="36" rx="6" fill="none" class="c2s" stroke-width="1.5"/>
<text x="465.0" y="96.89" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">call *%rax</text>
<text x="465.0" y="111.39" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">függvénymutató</text>
<text x="586" y="98" font-size="11" font-weight="600" class="ink" text-anchor="start">érvényes cél, f():</text>
<rect x="586" y="104" width="150" height="60" rx="4" fill="none" class="edge" stroke-width="1.25"/>
<text x="596" y="122" font-size="11.5" class="acct" text-anchor="start" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">endbr64</text>
<text x="596" y="140" font-size="11.5" class="ink" text-anchor="start" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">push %rbp</text>
<text x="596" y="158" font-size="11.5" class="ink" text-anchor="start" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">...</text>
<path d="M530 100C560 104 568 116 592 118" fill="none" class="acc" stroke-width="1.5" marker-end="url(#cfa)"/>
<text x="586" y="196" font-size="11" font-weight="600" class="ink" text-anchor="start">sérült mutató: a g() közepe:</text>
<rect x="586" y="202" width="150" height="44" rx="4" fill="none" class="edge" stroke-width="1.25"/>
<text x="596" y="220" font-size="11.5" class="ink" text-anchor="start" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">mov %rdi,%rax</text>
<text x="596" y="238" font-size="11.5" class="ink" text-anchor="start" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">...</text>
<path d="M464 118C470 180 540 218 592 220" fill="none" class="bads" stroke-width="1.5" marker-end="url(#cfb)"/>
<rect x="400" y="262" width="336" height="40" rx="6" class="badf"/><rect x="400" y="262" width="336" height="40" rx="6" fill="none" class="bads" stroke-width="1.5"/>
<text x="568.0" y="278.89" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">a célon nincs endbr64 → #CP</text>
<text x="568.0" y="293.39" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">az ugrást a CPU megtagadja</text>
<text x="400" y="318" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">A fordító minden olyan helyre endbr64-et (Arm: BTI) tesz,</text>
<text x="400" y="336" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">ahová egy indirekt hívás vagy ugrás jogosan érkezhet.</text>
<text x="24" y="372" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Mindkettő megállítja a kód-újrafelhasználást (ROP, JOP), amely visszatérési címek vagy mutatók elrontásával fűz össze</text>
<text x="24" y="390" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">meglévő utasításokat. Kell hozzá CPU, fordító (-fcf-protection, -mbranch-protection), kernel és minden könyvtár támogatása.</text>
</svg>
