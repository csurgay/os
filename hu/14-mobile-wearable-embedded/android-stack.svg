<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 824 460" width="824" height="460" role="img" aria-label="Az Android rétegei: sandboxolt alkalmazások egy Linux-kernel fölött, köztük a Binder">
<title>Az Android rétegei: sandboxolt alkalmazások egy Linux-kernel fölött, köztük a Binder</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .c2{fill:#d9822b}.c2s{stroke:#d9822b}.c2f{fill:#d9822b;fill-opacity:.14}.tint{fill:#f4f3ee}
  .bad{fill:#c8372d}.bads{stroke:#c8372d}.badf{fill:#c8372d;fill-opacity:.14}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}.acct{fill:#7aa9f5}
    .c2{fill:#eb9a4b}.c2s{stroke:#eb9a4b}.c2f{fill:#eb9a4b;fill-opacity:.2}.tint{fill:#22221f}
    .bad{fill:#ff7b70}.bads{stroke:#ff7b70}.badf{fill:#ff7b70;fill-opacity:.2}
  }
</style>
<defs><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="edgef"/></marker><marker id="asa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="acct"/></marker></defs>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">Az Android rétegei: sandboxolt alkalmazások egy Linux-kernel fölött, köztük a Binder</text>
<text x="24" y="60" font-size="12" font-weight="600" class="ink" text-anchor="start">Alkalmazások: mindegyiknek egy folyamat és egy Linux-UID, SELinux-domain: untrusted_app</text>
<rect x="24" y="70" width="132" height="46" rx="6" class="c2f"/><rect x="24" y="70" width="132" height="46" rx="6" fill="none" class="c2s" stroke-width="1.5"/>
<text x="90.0" y="89.82" font-size="12" font-weight="600" class="ink" text-anchor="middle">Maps</text>
<text x="90.0" y="104.82" font-size="12" font-weight="400" class="quiet" text-anchor="middle">u0_a123</text>
<rect x="166" y="70" width="132" height="46" rx="6" class="c2f"/><rect x="166" y="70" width="132" height="46" rx="6" fill="none" class="c2s" stroke-width="1.5"/>
<text x="232.0" y="89.82" font-size="12" font-weight="600" class="ink" text-anchor="middle">Kamera</text>
<text x="232.0" y="104.82" font-size="12" font-weight="400" class="quiet" text-anchor="middle">u0_a87</text>
<rect x="308" y="70" width="132" height="46" rx="6" class="c2f"/><rect x="308" y="70" width="132" height="46" rx="6" fill="none" class="c2s" stroke-width="1.5"/>
<text x="374.0" y="89.82" font-size="12" font-weight="600" class="ink" text-anchor="middle">Launcher</text>
<text x="374.0" y="104.82" font-size="12" font-weight="400" class="quiet" text-anchor="middle">u0_a64</text>
<rect x="450" y="70" width="132" height="46" rx="6" class="c2f"/><rect x="450" y="70" width="132" height="46" rx="6" fill="none" class="c2s" stroke-width="1.5"/>
<text x="516.0" y="89.82" font-size="12" font-weight="600" class="ink" text-anchor="middle">A te appod</text>
<text x="516.0" y="104.82" font-size="12" font-weight="400" class="quiet" text-anchor="middle">u0_a250</text>
<rect x="24" y="130" width="560" height="46" rx="6" class="accf"/><rect x="24" y="130" width="560" height="46" rx="6" fill="none" class="acc" stroke-width="2"/>
<text x="304.0" y="149.75" font-size="12.5" font-weight="600" class="ink" text-anchor="middle">Java/Kotlin API-keretrendszer</text>
<text x="304.0" y="165.25" font-size="12.5" font-weight="400" class="quiet" text-anchor="middle">ActivityManager, PackageManager, WindowManager … a system_server folyamatban</text>
<rect x="24" y="190" width="272" height="52" rx="6" class="tint"/><rect x="24" y="190" width="272" height="52" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="160.0" y="212.75" font-size="12.5" font-weight="600" class="ink" text-anchor="middle">Android Runtime (ART)</text>
<text x="160.0" y="228.25" font-size="12.5" font-weight="400" class="quiet" text-anchor="middle">DEX-bájtkód, AOT/JIT, szemétgyűjtő</text>
<rect x="312" y="190" width="272" height="52" rx="6" class="tint"/><rect x="312" y="190" width="272" height="52" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="448.0" y="212.75" font-size="12.5" font-weight="600" class="ink" text-anchor="middle">Natív könyvtárak és daemonok</text>
<text x="448.0" y="228.25" font-size="12.5" font-weight="400" class="quiet" text-anchor="middle">Bionic libc, média, SQLite; lmkd, surfaceflinger</text>
<line x1="18.0" y1="258.0" x2="590.0" y2="258.0" class="acc" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="634" y="254" font-size="11" font-weight="600" class="acct" text-anchor="start">fölötte: system partíció</text>
<text x="634" y="270" font-size="11" font-weight="600" class="acct" text-anchor="start">HAL-ok: vendor partíció</text>
<text x="634" y="286" font-size="11" font-weight="600" class="acct" text-anchor="start">kernel: boot partíció</text>
<text x="634" y="302" font-size="11" font-weight="400" class="quiet" text-anchor="start">(a szaggatott vonal: Treble)</text>
<rect x="24" y="268" width="560" height="46" rx="6" class="tint"/><rect x="24" y="268" width="560" height="46" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="304.0" y="287.75" font-size="12.5" font-weight="600" class="ink" text-anchor="middle">Hardverabsztrakciós réteg (HAL)</text>
<text x="304.0" y="303.25" font-size="12.5" font-weight="400" class="quiet" text-anchor="middle">kamera, hang, szenzorok, rádió … külön folyamatokként, stabil AIDL-interfészekkel</text>
<rect x="24" y="328" width="560" height="76" rx="8" class="accf"/><rect x="24" y="328" width="560" height="76" rx="8" fill="none" class="acc" stroke-width="2"/>
<text x="36" y="348" font-size="12.5" font-weight="600" class="ink" text-anchor="start">Linux-kernel: Generic Kernel Image (GKI) + vendor modulok</text>
<rect x="34" y="358" width="101" height="36" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="84.5" y="379.78" font-size="10.5" font-weight="400" class="ink" text-anchor="middle">vendor driverek</text>
<rect x="143" y="358" width="101" height="36" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="193.5" y="379.78" font-size="10.5" font-weight="400" class="ink" text-anchor="middle">f2fs, dm-verity</text>
<rect x="252" y="358" width="101" height="36" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="302.5" y="379.78" font-size="10.5" font-weight="400" class="ink" text-anchor="middle">PSI, cgroupok</text>
<rect x="361" y="358" width="101" height="36" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="411.5" y="379.78" font-size="10.5" font-weight="400" class="ink" text-anchor="middle">SELinux, seccomp</text>
<rect x="470" y="358" width="101" height="36" rx="6" class="accf"/><rect x="470" y="358" width="101" height="36" rx="6" fill="none" class="acc" stroke-width="2"/>
<text x="520.5" y="379.78" font-size="10.5" font-weight="600" class="ink" text-anchor="middle">Binder-driver</text>
<rect x="24" y="414" width="560" height="30" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="304.0" y="433.32" font-size="12" font-weight="400" class="ink" text-anchor="middle">hardver: SoC big és little magokkal, GPU, NPU, modem, szenzorok</text>
<path d="M582 100H598V368H575" fill="none" class="acc" stroke-width="1.75" marker-end="url(#asa)"/>
<path d="M571 384H610V153H588" fill="none" class="acc" stroke-width="1.75" marker-end="url(#asa)"/>
<rect x="634" y="130" width="170" height="52" rx="6" class="c2f"/><rect x="634" y="130" width="170" height="52" rx="6" fill="none" class="c2s" stroke-width="1.5"/>
<text x="719.0" y="152.75" font-size="12.5" font-weight="600" class="ink" text-anchor="middle">Zygote</text>
<text x="719.0" y="168.25" font-size="12.5" font-weight="400" class="quiet" text-anchor="middle">ART és osztályok előtöltve</text>
<path d="M719 130V86H586" fill="none" class="edge" stroke-width="1.25" marker-end="url(#as)"/>
<text x="719" y="76" font-size="11" font-weight="400" class="quiet" text-anchor="middle">fork() minden új alkalmazáshoz</text>
<text x="634" y="330" font-size="11" font-weight="400" class="acct" text-anchor="start">Binder-hívás: az alkalmazás</text>
<text x="634" y="346" font-size="11" font-weight="400" class="acct" text-anchor="start">kérése a kernel driverén</text>
<text x="634" y="362" font-size="11" font-weight="400" class="acct" text-anchor="start">keresztül jut el a</text>
<text x="634" y="378" font-size="11" font-weight="400" class="acct" text-anchor="start">system_server folyamathoz,</text>
<text x="634" y="394" font-size="11" font-weight="400" class="acct" text-anchor="start">és a válasz ugyanezen</text>
<text x="634" y="410" font-size="11" font-weight="400" class="acct" text-anchor="start">az úton tér vissza</text>
</svg>
