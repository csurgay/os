<text x="140.0" y="124" font-size="10.5" font-weight="400" class="quiet" text-anchor="start">küldés</text>
<text x="340.0" y="124" font-size="10.5" font-weight="400" class="quiet" text-anchor="start">küldés</text>
<text x="540.0" y="124" font-size="10.5" font-weight="400" class="quiet" text-anchor="start">küldés</text>
<text x="540.0" y="234" font-size="10.5" font-weight="400" class="quiet" text-anchor="start">mindhárom elküldése</text>
<text x="120.0" y="252" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">0 s</text>
<text x="320.0" y="252" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">20 s</text>
<text x="520.0" y="252" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">40 s</text>
<text x="720.0" y="252" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">60 s</text>
<rect x="24.0" y="271.0" width="12.0" height="10.0" class="c2" fill-opacity="0.75"/>
<text x="42" y="280" font-size="11" font-weight="400" class="ink" text-anchor="start">promotion: kapcsolódás a hálózathoz</text>
<rect x="274.0" y="271.0" width="12.0" height="10.0" class="acct" fill-opacity="0.75"/>
<text x="292" y="280" font-size="11" font-weight="400" class="ink" text-anchor="start">átvitel</text>
<rect x="364.0" y="271.0" width="12.0" height="10.0" class="bad" fill-opacity="0.45"/>
<text x="382" y="280" font-size="11" font-weight="400" class="ink" text-anchor="start">tail: várakozás nagy fogyasztással további adatra</text>
<rect x="684.0" y="271.0" width="12.0" height="10.0" class="quiet" fill-opacity="0.6"/>
<text x="702" y="280" font-size="11" font-weight="400" class="ink" text-anchor="start">tétlen</text>
<text x="24" y="306" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Csak az alak vázlata (a magasságok nem arányosak). Az adat ugyanaz; az energia a színezett terület, nagyobb része a tailekben.</text>
<text x="24" y="324" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Az OS kötegelhet: a háttér-szinkronizálásokat közös pillanatra halasztja (Doze karbantartási ablakai, JobScheduler, push üzenetek).</text>
