<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 342" width="750" height="342" role="img" aria-label="A mobilrádió minden átvitel után másodpercekig nagy fogyasztással ébren marad: kötegelj!">
<title>A mobilrádió minden átvitel után másodpercekig nagy fogyasztással ébren marad: kötegelj!</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .c2{fill:#d9822b}.c2s{stroke:#d9822b}.c2f{fill:#d9822b;fill-opacity:.14}.tint{fill:#f4f3ee}
