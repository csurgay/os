<text x="24" y="201.0" font-size="11" font-weight="400" class="quiet" text-anchor="start">1 átvitel, 1 tail</text>
<line x1="120.0" y1="220.0" x2="720.0" y2="220.0" class="edge" stroke-width="1.25"/>
<rect x="540.0" y="182.8" width="5.0" height="37.2" class="c2" fill-opacity="0.75"/>
