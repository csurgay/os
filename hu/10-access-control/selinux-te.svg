<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" role="img" aria-label="SELinux type enforcement: mindennek címkéje van, és csak a megengedett párok érintkezhetnek" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>SELinux type enforcement: mindennek címkéje van, és csak a megengedett párok érintkezhetnek</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .c2{fill:#d9822b}.c2s{stroke:#d9822b}.c2f{fill:#d9822b;fill-opacity:.14}.tint{fill:#f4f3ee}
  .bad{fill:#c8372d}.bads{stroke:#c8372d}.badf{fill:#c8372d;fill-opacity:.14}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}.acct{fill:#7aa9f5}
    .c2{fill:#eb9a4b}.c2s{stroke:#eb9a4b}.c2f{fill:#eb9a4b;fill-opacity:.2}.tint{fill:#22221f}
    .bad{fill:#ff7b70}.bads{stroke:#ff7b70}.badf{fill:#ff7b70;fill-opacity:.2}
  }
</style>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">SELinux type enforcement: mindennek címkéje van, és csak a megengedett párok érintkezhetnek</text>
<marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="edgef"/></marker>
<marker id="a5b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="bad"/></marker>
<text x="24" y="52" font-size="12" font-weight="600" class="quiet" text-anchor="start">egy SELinux context, ahogy a ps -Z (folyamat) vagy az ls -Z (fájl) mutatja:</text>
<rect x="60" y="70" width="84" height="30" rx="3" class="tint"/><rect x="60" y="70" width="84" height="30" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="102.0" y="90" font-size="13.5" font-weight="600" class="ink" text-anchor="middle">system_u</text>
<text x="151" y="90" font-size="14" font-weight="600" class="ink" text-anchor="middle">:</text>
<rect x="158" y="70" width="84" height="30" rx="3" class="tint"/><rect x="158" y="70" width="84" height="30" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="200.0" y="90" font-size="13.5" font-weight="600" class="ink" text-anchor="middle">system_r</text>
<text x="249" y="90" font-size="14" font-weight="600" class="ink" text-anchor="middle">:</text>
<rect x="256" y="70" width="75" height="30" rx="3" class="accf"/><rect x="256" y="70" width="75" height="30" rx="3" fill="none" class="acc" stroke-width="2"/>
<text x="293.5" y="90" font-size="13.5" font-weight="600" class="ink" text-anchor="middle">httpd_t</text>
<text x="338" y="90" font-size="14" font-weight="600" class="ink" text-anchor="middle">:</text>
<rect x="345" y="70" width="30" height="30" rx="3" class="tint"/><rect x="345" y="70" width="30" height="30" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="360.0" y="90" font-size="13.5" font-weight="600" class="ink" text-anchor="middle">s0</text>
<path d="M102.0 102V116" fill="none" class="edge" stroke-width="1"/>
<text x="102.0" y="130" font-size="11" font-weight="400" class="quiet" text-anchor="middle">felhasználó</text>
<path d="M200.0 102V116" fill="none" class="edge" stroke-width="1"/>
<text x="200.0" y="130" font-size="11" font-weight="400" class="quiet" text-anchor="middle">szerep</text>
<path d="M293.5 102V116" fill="none" class="edge" stroke-width="1"/>
<text x="256" y="130" font-size="11" font-weight="600" class="acct" text-anchor="start">típus (folyamatnál: domain)</text>
<path d="M360.0 102V116" fill="none" class="edge" stroke-width="1"/>
<text x="345" y="146" font-size="11" font-weight="400" class="quiet" text-anchor="start">szint (MLS/MCS)</text>
<text x="520" y="82" font-size="11.5" font-weight="400" class="ink" text-anchor="start">fájl:  system_u:object_r:httpd_sys_content_t:s0</text>
<text x="520" y="100" font-size="11.5" font-weight="400" class="ink" text-anchor="start">port:  system_u:object_r:http_port_t:s0</text>
<text x="60" y="170" font-size="12" font-weight="600" class="quiet" text-anchor="start">domainek (folyamatok)</text>
<text x="560" y="170" font-size="12" font-weight="600" class="quiet" text-anchor="start">típusok (fájlok, portok)</text>
<rect x="60" y="212" width="170" height="60" rx="8" class="accf"/><rect x="60" y="212" width="170" height="60" rx="8" fill="none" class="acc" stroke-width="2"/>
<text x="145" y="237" font-size="13.5" font-weight="600" class="ink" text-anchor="middle">httpd_t</text>
<text x="145" y="257" font-size="11" font-weight="400" class="ink" text-anchor="middle">Apache httpd</text>
<rect x="60" y="372" width="170" height="60" rx="8" class="accf"/><rect x="60" y="372" width="170" height="60" rx="8" fill="none" class="acc" stroke-width="2"/>
<text x="145" y="397" font-size="13.5" font-weight="600" class="ink" text-anchor="middle">mysqld_t</text>
<text x="145" y="417" font-size="11" font-weight="400" class="ink" text-anchor="middle">MariaDB mysqld</text>
<rect x="560" y="182" width="250" height="46" rx="8" class="c2f"/><rect x="560" y="182" width="250" height="46" rx="8" fill="none" class="c2s" stroke-width="1.5"/>
<text x="574" y="202" font-size="12.5" font-weight="600" class="ink" text-anchor="start">http_port_t</text>
<text x="574" y="219" font-size="11" font-weight="400" class="quiet" text-anchor="start">TCP 80, 443, …</text>
<rect x="560" y="242" width="250" height="46" rx="8" class="tint"/><rect x="560" y="242" width="250" height="46" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="574" y="262" font-size="12.5" font-weight="600" class="ink" text-anchor="start">httpd_sys_content_t</text>
<text x="574" y="279" font-size="11" font-weight="400" class="quiet" text-anchor="start">/var/www/html</text>
<rect x="560" y="302" width="250" height="46" rx="8" class="tint"/><rect x="560" y="302" width="250" height="46" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="574" y="322" font-size="12.5" font-weight="600" class="ink" text-anchor="start">user_home_t</text>
<text x="574" y="339" font-size="11" font-weight="400" class="quiet" text-anchor="start">/home/*</text>
<rect x="560" y="362" width="250" height="46" rx="8" class="tint"/><rect x="560" y="362" width="250" height="46" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="574" y="382" font-size="12.5" font-weight="600" class="ink" text-anchor="start">mysqld_db_t</text>
<text x="574" y="399" font-size="11" font-weight="400" class="quiet" text-anchor="start">/var/lib/mysql</text>
<rect x="560" y="422" width="250" height="46" rx="8" class="c2f"/><rect x="560" y="422" width="250" height="46" rx="8" fill="none" class="c2s" stroke-width="1.5"/>
<text x="574" y="442" font-size="12.5" font-weight="600" class="ink" text-anchor="start">mysqld_port_t</text>
<text x="574" y="459" font-size="11" font-weight="400" class="quiet" text-anchor="start">TCP 3306</text>
<path d="M230 230C390 230 400 205 558 205" fill="none" class="acc" stroke-width="1.75" marker-end="url(#a5)"/>
<path d="M230 244C390 244 400 265 558 265" fill="none" class="acc" stroke-width="1.75" marker-end="url(#a5)"/>
<path d="M230 400C390 400 400 385 558 385" fill="none" class="acc" stroke-width="1.75" marker-end="url(#a5)"/>
<path d="M230 414C390 414 400 445 558 445" fill="none" class="acc" stroke-width="1.75" marker-end="url(#a5)"/>
<text x="548" y="198" font-size="10.5" font-weight="400" class="acct" text-anchor="end">name_bind</text>
<text x="548" y="258" font-size="10.5" font-weight="400" class="acct" text-anchor="end">read</text>
<text x="548" y="378" font-size="10.5" font-weight="400" class="acct" text-anchor="end">read, write</text>
<text x="548" y="438" font-size="10.5" font-weight="400" class="acct" text-anchor="end">name_bind</text>
<path d="M230 258C380 258 400 325 556 325" fill="none" class="bads" stroke-width="1.25" marker-end="url(#a5b)" stroke-dasharray="5 4"/>
<path d="M230 268C380 268 400 397 556 397" fill="none" class="bads" stroke-width="1.25" marker-end="url(#a5b)" stroke-dasharray="5 4"/>
<path d="M230 386C380 386 400 277 556 277" fill="none" class="bads" stroke-width="1.25" marker-end="url(#a5b)" stroke-dasharray="5 4"/>
<path d="M60 490H90" fill="none" class="acc" stroke-width="1.75" marker-end="url(#a5)"/>
<text x="98" y="494" font-size="11.5" font-weight="400" class="ink" text-anchor="start">egy allow szabály megengedi</text>
<path d="M300 490H330" fill="none" class="bads" stroke-width="1.25" marker-end="url(#a5b)" stroke-dasharray="5 4"/>
<text x="338" y="494" font-size="11.5" font-weight="400" class="ink" text-anchor="start">nincs szabály: tiltva, a root folyamatainak is, és AVC-elutasításként naplózva</text>
<text x="60" y="524" font-size="12.5" font-weight="600" class="ink" text-anchor="start">allow httpd_t httpd_sys_content_t:file { read open getattr };</text>
<text x="60" y="544" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Ami nincs megengedve, az tilos. Egy eltérített webszerver olvashatja a weboldalakat, de az adatbázisfájlokat nem.</text>
</svg>
