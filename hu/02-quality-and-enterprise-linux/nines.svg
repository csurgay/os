<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">Minden újabb kilences tizedére csökkenti a megengedett leállási időt</text>
<text x="24" y="50" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Megengedett éves leállási idő az egyes rendelkezésre állási szinteken (logaritmikus skála)</text>
