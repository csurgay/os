<text x="241.10718062870586" y="229" font-size="12.5" font-weight="600" class="ink" text-anchor="start">5,3 perc</text>
<text x="24" y="306" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Kiemelve: 99,99%, az üzletkritikus szolgáltatások gyakori célja: évente kevesebb mint egy óra leállás.</text>
