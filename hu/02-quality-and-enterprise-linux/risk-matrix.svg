<text x="140" y="106.0" font-size="12" font-weight="600" class="ink" text-anchor="end">gyakori</text>
<rect x="150" y="134" width="146" height="64" rx="0" class="tint"/><rect x="150" y="134" width="146" height="64" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<rect x="296" y="134" width="146" height="64" rx="0" class="c2f"/><rect x="296" y="134" width="146" height="64" rx="0" fill="none" class="c2s" stroke-width="1.5"/>
<rect x="442" y="134" width="146" height="64" rx="0" class="badf"/><rect x="442" y="134" width="146" height="64" rx="0" fill="none" class="bads" stroke-width="1.5"/>
<rect x="588" y="134" width="146" height="64" rx="0" class="badf"/><rect x="588" y="134" width="146" height="64" rx="0" fill="none" class="bads" stroke-width="1.5"/>
<text x="140" y="170.0" font-size="12" font-weight="600" class="ink" text-anchor="end">lehetséges</text>
<rect x="150" y="198" width="146" height="64" rx="0" class="tint"/><rect x="150" y="198" width="146" height="64" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<rect x="296" y="198" width="146" height="64" rx="0" class="c2f"/><rect x="296" y="198" width="146" height="64" rx="0" fill="none" class="c2s" stroke-width="1.5"/>
<rect x="442" y="198" width="146" height="64" rx="0" class="c2f"/><rect x="442" y="198" width="146" height="64" rx="0" fill="none" class="c2s" stroke-width="1.5"/>
<rect x="588" y="198" width="146" height="64" rx="0" class="badf"/><rect x="588" y="198" width="146" height="64" rx="0" fill="none" class="bads" stroke-width="1.5"/>
<text x="140" y="234.0" font-size="12" font-weight="600" class="ink" text-anchor="end">valószínűtlen</text>
<rect x="150" y="262" width="146" height="64" rx="0" class="tint"/><rect x="150" y="262" width="146" height="64" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<rect x="296" y="262" width="146" height="64" rx="0" class="tint"/><rect x="296" y="262" width="146" height="64" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<rect x="442" y="262" width="146" height="64" rx="0" class="tint"/><rect x="442" y="262" width="146" height="64" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<rect x="588" y="262" width="146" height="64" rx="0" class="c2f"/><rect x="588" y="262" width="146" height="64" rx="0" fill="none" class="c2s" stroke-width="1.5"/>
<text x="140" y="298.0" font-size="12" font-weight="600" class="ink" text-anchor="end">ritka</text>
<text x="223.0" y="344" font-size="12" font-weight="600" class="ink" text-anchor="middle">elhanyagolható</text>
<text x="369.0" y="344" font-size="12" font-weight="600" class="ink" text-anchor="middle">kisebb</text>
<text x="515.0" y="344" font-size="12" font-weight="600" class="ink" text-anchor="middle">súlyos</text>
<text x="661.0" y="344" font-size="12" font-weight="600" class="ink" text-anchor="middle">katasztrofális</text>
<text x="442" y="366" font-size="12" font-weight="400" class="quiet" text-anchor="middle">hatás (kár eseményenként) →</text>
<text x="34" y="198" font-size="12" class="quiet" text-anchor="middle" transform="rotate(-90 34 198)">valószínűség →</text>
<text x="223.0" y="96" font-size="11" font-weight="600" class="ink" text-anchor="middle">összeomló folyamat</text>
<text x="223.0" y="111" font-size="11" font-weight="400" class="quiet" text-anchor="middle">magától újraindul</text>
<text x="515.0" y="160" font-size="11" font-weight="600" class="ink" text-anchor="middle">lemezhiba</text>
<text x="515.0" y="175" font-size="11" font-weight="400" class="quiet" text-anchor="middle">(egyetlen lemez)</text>
<text x="369.0" y="160" font-size="11" font-weight="600" class="acct" text-anchor="middle">lemezhiba</text>
<text x="369.0" y="175" font-size="11" font-weight="400" class="quiet" text-anchor="middle">RAID 1-gyel</text>
<text x="661.0" y="160" font-size="11" font-weight="600" class="ink" text-anchor="middle">konfigurációs hiba</text>
<text x="661.0" y="175" font-size="11" font-weight="400" class="quiet" text-anchor="middle">minden szerveren</text>
<text x="515.0" y="224" font-size="11" font-weight="600" class="ink" text-anchor="middle">áramszünet</text>
<text x="515.0" y="239" font-size="11" font-weight="400" class="quiet" text-anchor="middle">a szerverteremben</text>
<text x="661.0" y="224" font-size="11" font-weight="600" class="ink" text-anchor="middle">zsarolóvírus</text>
<text x="661.0" y="239" font-size="11" font-weight="400" class="quiet" text-anchor="middle">mindent titkosít</text>
<text x="661.0" y="288" font-size="11" font-weight="600" class="ink" text-anchor="middle">tűz vagy árvíz</text>
<text x="661.0" y="303" font-size="11" font-weight="400" class="quiet" text-anchor="middle">az adatközpontban</text>
<text x="223.0" y="288" font-size="11" font-weight="600" class="ink" text-anchor="middle">kiesik egy ventilátor</text>
<text x="223.0" y="303" font-size="11" font-weight="400" class="quiet" text-anchor="middle">a másik tovább hűt</text>
<path d="M472 190H434" fill="none" class="acc" stroke-width="1.5" marker-end="url(#rm)"/>
<text x="476" y="194" font-size="10.5" font-weight="600" class="acct" text-anchor="start">csökkentés</text>
<rect x="24" y="383" width="14" height="14" rx="2" class="tint"/><rect x="24" y="383" width="14" height="14" rx="2" fill="none" class="edge" stroke-width="1.25"/>
<text x="44" y="395" font-size="11.5" font-weight="400" class="ink" text-anchor="start">alacsony: elfogadni, figyelni</text>
<rect x="230" y="383" width="14" height="14" rx="2" class="c2f"/><rect x="230" y="383" width="14" height="14" rx="2" fill="none" class="c2s" stroke-width="1.5"/>
<text x="250" y="395" font-size="11.5" font-weight="400" class="ink" text-anchor="start">közepes: csökkenteni, ahol olcsó</text>
<rect x="460" y="383" width="14" height="14" rx="2" class="badf"/><rect x="460" y="383" width="14" height="14" rx="2" fill="none" class="bads" stroke-width="1.5"/>
<text x="480" y="395" font-size="11.5" font-weight="400" class="ink" text-anchor="start">magas: csökkenteni, áthárítani, elkerülni</text>
<text x="24" y="424" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">A csökkentés elmozdítja a kockázatot: RAID 1 tükörrel a lemezhiba ugyanolyan valószínű, de kisebb a hatása.</text>
</svg>
