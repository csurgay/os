<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 424" width="760" height="424" role="img" aria-label="A kép a csak olvasható tervrajz; minden konténer egy vékony írható réteget ad hozzá">
<title>A kép a csak olvasható tervrajz; minden konténer egy vékony írható réteget ad hozzá</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .c2{fill:#d9822b}.c2s{stroke:#d9822b}.c2f{fill:#d9822b;fill-opacity:.14}.tint{fill:#f4f3ee}
  .bad{fill:#c8372d}.bads{stroke:#c8372d}.badf{fill:#c8372d;fill-opacity:.14}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}.acct{fill:#7aa9f5}
    .c2{fill:#eb9a4b}.c2s{stroke:#eb9a4b}.c2f{fill:#eb9a4b;fill-opacity:.2}.tint{fill:#22221f}
    .bad{fill:#ff7b70}.bads{stroke:#ff7b70}.badf{fill:#ff7b70;fill-opacity:.2}
  }
</style>
<defs><marker id="ic" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="edgef"/></marker><marker id="ica" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="acct"/></marker></defs>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">A kép a csak olvasható tervrajz; minden konténer egy vékony írható réteget ad hozzá</text>
<text x="24" y="66" font-size="13" font-weight="600" class="ink" text-anchor="start">Containerfile</text>
<rect x="18" y="76" width="190" height="218" rx="6" class="tint"/><rect x="18" y="76" width="190" height="218" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="28" y="96" font-size="12" class="ink" text-anchor="start" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">FROM scratch</text>
<text x="28" y="122" font-size="12" class="ink" text-anchor="start" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">COPY tool /bin/tool</text>
<text x="28" y="148" font-size="12" class="ink" text-anchor="start" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">RUN tool mkdir /data</text>
<text x="28" y="174" font-size="12" class="ink" text-anchor="start" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">COPY app.conf /etc/</text>
<text x="28" y="200" font-size="12" class="ink" text-anchor="start" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">EXPOSE 8080</text>
<text x="28" y="226" font-size="12" class="ink" text-anchor="start" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">USER 1000</text>
<text x="28" y="252" font-size="12" class="ink" text-anchor="start" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">WORKDIR /data</text>
<text x="28" y="278" font-size="12" class="ink" text-anchor="start" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">CMD tool serve</text>
<text x="270" y="66" font-size="13" font-weight="600" class="ink" text-anchor="start">Kép (csak olvasható, közös)</text>
<rect x="270" y="80" width="200" height="76" rx="4" fill="none" class="edge" stroke-width="1.25" stroke-dasharray="4 3"/>
<text x="370.0" y="100" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">konfiguráció (nincs fájl):</text>
<text x="370.0" y="118" font-size="11" font-weight="400" class="quiet" text-anchor="middle">port 8080, felhasználó 1000,</text>
<text x="370.0" y="134" font-size="11" font-weight="400" class="quiet" text-anchor="middle">munkakönyvtár /data,</text>
<text x="370.0" y="150" font-size="11" font-weight="400" class="quiet" text-anchor="middle">parancs: tool serve</text>
<rect x="270" y="166" width="200" height="36" rx="4" class="accf"/><rect x="270" y="166" width="200" height="36" rx="4" fill="none" class="acc" stroke-width="2"/>
<text x="282" y="189" font-size="12" font-weight="600" class="ink" text-anchor="start">/etc/app.conf</text>
<text x="460" y="189" font-size="11" font-weight="400" class="quiet" text-anchor="end">3. réteg</text>
<rect x="270" y="206" width="200" height="36" rx="4" class="accf"/><rect x="270" y="206" width="200" height="36" rx="4" fill="none" class="acc" stroke-width="2"/>
<text x="282" y="229" font-size="12" font-weight="600" class="ink" text-anchor="start">/data, UID 1000</text>
<text x="460" y="229" font-size="11" font-weight="400" class="quiet" text-anchor="end">2. réteg</text>
<rect x="270" y="246" width="200" height="36" rx="4" class="accf"/><rect x="270" y="246" width="200" height="36" rx="4" fill="none" class="acc" stroke-width="2"/>
<text x="282" y="269" font-size="12" font-weight="600" class="ink" text-anchor="start">/bin/tool</text>
<text x="460" y="269" font-size="11" font-weight="400" class="quiet" text-anchor="end">1. réteg</text>
<text x="370.0" y="302" font-size="11" font-weight="400" class="quiet" text-anchor="middle">üres alap (FROM scratch)</text>
<path d="M210 118C240 118 240 264.0 266 264.0" fill="none" class="edge" stroke-width="1.25" marker-end="url(#ic)"/>
<path d="M210 144C240 144 240 224.0 266 224.0" fill="none" class="edge" stroke-width="1.25" marker-end="url(#ic)"/>
<path d="M210 170C240 170 240 184.0 266 184.0" fill="none" class="edge" stroke-width="1.25" marker-end="url(#ic)"/>
<path d="M210 196C236 196 236 118.0 266 118.0" fill="none" class="edge" stroke-width="1.25" marker-end="url(#ic)" stroke-dasharray="3 3"/>
<path d="M210 222C236 222 236 118.0 266 118.0" fill="none" class="edge" stroke-width="1.25" marker-end="url(#ic)" stroke-dasharray="3 3"/>
<path d="M210 248C236 248 236 118.0 266 118.0" fill="none" class="edge" stroke-width="1.25" marker-end="url(#ic)" stroke-dasharray="3 3"/>
<path d="M210 274C236 274 236 118.0 266 118.0" fill="none" class="edge" stroke-width="1.25" marker-end="url(#ic)" stroke-dasharray="3 3"/>
<text x="540" y="66" font-size="13" font-weight="600" class="ink" text-anchor="start">Konténerek (példányok)</text>
<rect x="540" y="80" width="196" height="84" rx="6" fill="none" class="edge" stroke-width="1.25" stroke-dasharray="5 3"/>
<text x="550" y="100" font-size="12" font-weight="600" class="ink" text-anchor="start">c1 konténer</text>
<rect x="550" y="110" width="176" height="24" rx="3" class="c2f"/><rect x="550" y="110" width="176" height="24" rx="3" fill="none" class="c2s" stroke-width="1.5"/>
<text x="638.0" y="127" font-size="11" font-weight="400" class="ink" text-anchor="middle">írható réteg: notes.txt</text>
<text x="638.0" y="152" font-size="11" font-weight="400" class="quiet" text-anchor="middle">+ alatta a kép rétegei</text>
<path d="M474 206C505 206 505 144 536 144" fill="none" class="edge" stroke-width="1.25" marker-end="url(#ic)"/>
<rect x="540" y="186" width="196" height="84" rx="6" fill="none" class="edge" stroke-width="1.25" stroke-dasharray="5 3"/>
<text x="550" y="206" font-size="12" font-weight="600" class="ink" text-anchor="start">c2 konténer</text>
<rect x="550" y="216" width="176" height="24" rx="3" class="c2f"/><rect x="550" y="216" width="176" height="24" rx="3" fill="none" class="c2s" stroke-width="1.5"/>
<text x="638.0" y="233" font-size="11" font-weight="400" class="ink" text-anchor="middle">írható réteg: (üres)</text>
<text x="638.0" y="258" font-size="11" font-weight="400" class="quiet" text-anchor="middle">+ alatta a kép rétegei</text>
<path d="M474 236C505 236 505 250 536 250" fill="none" class="edge" stroke-width="1.25" marker-end="url(#ic)"/>
<text x="506" y="180" font-size="11" font-weight="600" class="quiet" text-anchor="middle">futtatás</text>
<rect x="540" y="300" width="196" height="46" rx="6" class="tint"/><rect x="540" y="300" width="196" height="46" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="638.0" y="319" font-size="12" font-weight="600" class="ink" text-anchor="middle">appdata kötet</text>
<text x="638.0" y="336" font-size="11" font-weight="400" class="quiet" text-anchor="middle">minden konténert túlél</text>
<path d="M638.0 298V272" fill="none" class="acc" stroke-width="1.5" marker-end="url(#ica)"/>
<text x="646.0" y="288" font-size="11" font-weight="600" class="acct" text-anchor="start">csatolva: /data</text>
<text x="24" y="386" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">A konténerben írt adat a saját írható rétegébe kerül, és elvész, amikor a konténert eltávolítják;</text>
<text x="24" y="404" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">a megmaradó adatok (adatbázis, feltöltések) kötetre valók. Folytonos nyilak: fájlokat hozzáadó építési lépések.</text>
</svg>
