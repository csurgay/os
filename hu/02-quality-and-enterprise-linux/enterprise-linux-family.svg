<text x="290" y="320" font-size="11.5" font-weight="600" class="acct" text-anchor="middle">a javítások először upstreambe mennek: Fedora, CentOS Stream, eredeti projektek</text>
<text x="24" y="372" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">2023 júniusa óta a RHEL-hez kapcsolódó kód egyetlen nyilvános forrása a CentOS Stream; a RHEL saját forráscsomagjait</text>
<text x="24" y="390" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">az ügyfelek és partnerek kapják. Szaggatott: az AlmaLinux főként CentOS Streamből épül (ABI-kompatibilitás).</text>
