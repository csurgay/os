<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-label="A megszakítást a processzor csak két utasítás között fogadja el" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>A megszakítást a processzor csak két utasítás között fogadja el</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .bad{fill:#c8372d}.bads{stroke:#c8372d}.tint{fill:#f4f3ee}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}.acct{fill:#7aa9f5}
    .bad{fill:#ff7b70}.bads{stroke:#ff7b70}.tint{fill:#22221f}
  }
</style>
<defs><marker id="ic" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="edgef"/></marker></defs>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">A megszakítást a processzor csak két utasítás között fogadja el</text>
<path d="M28.0 108V98H484.0V108" fill="none" class="acc" stroke-width="2"/>
<text x="256.0" y="88" font-size="11.5" font-weight="600" class="acct" text-anchor="middle">atomi: egy utasítás, sosem szakad meg félúton</text>
<path d="M164.0 150H188.0" fill="none" class="edge" stroke-width="1.25" marker-end="url(#ic)"/>
<path d="M324.0 150H348.0" fill="none" class="edge" stroke-width="1.25" marker-end="url(#ic)"/>
<path d="M484.0 150H536" fill="none" class="edge" stroke-width="1.25" marker-end="url(#ic)"/>
<path d="M475.0 268H96V178.0" fill="none" class="edge" stroke-width="1.25" marker-end="url(#ic)"/>
<path d="M600 190V240" fill="none" class="edge" stroke-width="1.25" marker-end="url(#ic)"/>
<path d="M664 150H736V320H14V150H28.0" fill="none" class="edge" stroke-width="1.25" marker-end="url(#ic)"/>
<rect x="28.0" y="122.0" width="136" height="56" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="96" y="146" font-size="13" font-weight="600" class="ink" text-anchor="middle">Lehívás</text>
<text x="96" y="164" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">utasítás lehívása</text>
<rect x="188.0" y="122.0" width="136" height="56" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="256" y="146" font-size="13" font-weight="600" class="ink" text-anchor="middle">Dekódolás</text>
<text x="256" y="164" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">a CIR dekódolása</text>
<rect x="348.0" y="122.0" width="136" height="56" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="416" y="146" font-size="13" font-weight="600" class="ink" text-anchor="middle">Végrehajtás</text>
<text x="416" y="164" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">művelet vagy ugrás</text>
<polygon points="536,150 600,110 664,150 600,190" class="accf"/><polygon points="536,150 600,110 664,150 600,190" fill="none" class="acc" stroke-width="2"/>
<text x="600" y="148" font-size="13" font-weight="600" class="ink" text-anchor="middle">Van függő</text>
<text x="600" y="164" font-size="13" font-weight="600" class="ink" text-anchor="middle">megszakítás?</text>
<rect x="475.0" y="240" width="250" height="56" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="600" y="264" font-size="13" font-weight="600" class="ink" text-anchor="middle">Megszakításkezelő</text>
<text x="600" y="282" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">a PC már a következő utasításra mutat</text>
<text x="610" y="214" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">igen</text>
<text x="728" y="142" font-size="11.5" font-weight="400" class="quiet" text-anchor="end">nem</text>
<text x="285.5" y="260" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">a kezelő ugyanúgy lehívódik, mint bármely más kód</text>
<text x="400" y="338" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">nincs megszakítás: azonnal jön a következő utasítás</text>
