<text x="24" y="282" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">A tábla egy közvetett szintet ad: az OS egyetlen bejegyzés átírásával áthelyezhet vagy lecserélhet egy kezelőt.</text>
<text x="24" y="300" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">x86-64-en minden bejegyzés (kapuleíró) 16 bájtos, és a kódszegmenst meg a jogosultsági beállításokat is tárolja.</text>
