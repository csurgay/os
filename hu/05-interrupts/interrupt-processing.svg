<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 524" width="760" height="524" role="img" aria-label="A hardver a minimumot menti, a többit a kezelő" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>A hardver a minimumot menti, a többit a kezelő</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .bad{fill:#c8372d}.bads{stroke:#c8372d}.tint{fill:#f4f3ee}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}.acct{fill:#7aa9f5}
    .bad{fill:#ff7b70}.bads{stroke:#ff7b70}.tint{fill:#22221f}
  }
</style>
<defs><marker id="ip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="edgef"/></marker></defs>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">A hardver a minimumot menti, a többit a kezelő</text>
<text x="40" y="76" font-size="13" font-weight="600" class="ink" text-anchor="start">Hardver (automatikus, minden megszakításnál)</text>
<text x="420" y="76" font-size="13" font-weight="600" class="ink" text-anchor="start">Szoftver (megszakításkezelő, az OS-ben)</text>
<rect x="40" y="104" width="300" height="56" rx="8" class="tint"/><rect x="40" y="104" width="300" height="56" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="52" y="128" font-size="13" font-weight="600" class="ink" text-anchor="start">1  Az eszköz megszakítást kér</text>
<text x="70" y="146" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">pl. kész az átvitel, lejárt az időzítő</text>
<path d="M190.0 160V180" fill="none" class="edge" stroke-width="1.25" marker-end="url(#ip)"/>
<rect x="40" y="180" width="300" height="56" rx="8" class="tint"/><rect x="40" y="180" width="300" height="56" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="52" y="204" font-size="13" font-weight="600" class="ink" text-anchor="start">2  A CPU befejezi az utasítást</text>
<text x="70" y="222" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">az utasításciklus atomi</text>
<path d="M190.0 236V256" fill="none" class="edge" stroke-width="1.25" marker-end="url(#ip)"/>
<rect x="40" y="256" width="300" height="56" rx="8" class="tint"/><rect x="40" y="256" width="300" height="56" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="52" y="280" font-size="13" font-weight="600" class="ink" text-anchor="start">3  A CPU nyugtázza a kérést</text>
<text x="70" y="298" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">később a kezelő törli (EOI)</text>
<path d="M190.0 312V332" fill="none" class="edge" stroke-width="1.25" marker-end="url(#ip)"/>
<rect x="40" y="332" width="300" height="56" rx="8" class="accf"/><rect x="40" y="332" width="300" height="56" rx="8" fill="none" class="acc" stroke-width="2"/>
<text x="52" y="356" font-size="13" font-weight="600" class="ink" text-anchor="start">4  A CPU menti a PC-t és a PSW-t</text>
<text x="70" y="374" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">a verembe kerülnek (LIFO)</text>
<path d="M190.0 388V408" fill="none" class="edge" stroke-width="1.25" marker-end="url(#ip)"/>
<rect x="40" y="408" width="300" height="56" rx="8" class="tint"/><rect x="40" y="408" width="300" height="56" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="52" y="432" font-size="13" font-weight="600" class="ink" text-anchor="start">5  A CPU betölti az új PC-t</text>
<text x="70" y="450" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">vektortábla → a kezelő címe</text>
<rect x="420" y="104" width="300" height="56" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="432" y="128" font-size="13" font-weight="600" class="ink" text-anchor="start">6  A többi regiszter mentése</text>
<text x="450" y="146" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">a folyamatállapot többi része</text>
<path d="M570.0 160V180" fill="none" class="edge" stroke-width="1.25" marker-end="url(#ip)"/>
<rect x="420" y="180" width="300" height="56" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="432" y="204" font-size="13" font-weight="600" class="ink" text-anchor="start">7  A kezelőrutin futtatása</text>
<text x="450" y="222" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">kiszolgálja az eszközt, röviden</text>
<path d="M570.0 236V256" fill="none" class="edge" stroke-width="1.25" marker-end="url(#ip)"/>
<rect x="420" y="256" width="300" height="56" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="432" y="280" font-size="13" font-weight="600" class="ink" text-anchor="start">8  A többi regiszter visszaállítása</text>
<text x="450" y="298" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">fordított sorrendben (LIFO)</text>
<path d="M570.0 312V332" fill="none" class="edge" stroke-width="1.25" marker-end="url(#ip)"/>
<rect x="420" y="332" width="300" height="56" rx="8" class="accf"/><rect x="420" y="332" width="300" height="56" rx="8" fill="none" class="acc" stroke-width="2"/>
<text x="432" y="356" font-size="13" font-weight="600" class="ink" text-anchor="start">9  A PC és a PSW visszaállítása</text>
<text x="450" y="374" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">visszatérés: a program folytatódik</text>
<path d="M340 436.0H380V132.0H420" fill="none" class="edge" stroke-width="1.25" marker-end="url(#ip)"/>
<path d="M570.0 388V428" fill="none" class="edge" stroke-width="1.25" marker-end="url(#ip)"/>
<text x="570.0" y="446" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">vissza a megszakított programba,</text>
<text x="570.0" y="462" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">a mentett PC-nél</text>
<text x="24" y="504" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Kiemelve: az az egy pár, amelyet maga a hardver ment, és a visszatérő utasítás visszaállít</text>
</svg>
