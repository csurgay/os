<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-label="A memóriahierarchia: minden szint nagyobb, lassabb és bájtonként olcsóbb" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>A memóriahierarchia: minden szint nagyobb, lassabb és bájtonként olcsóbb</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .c2{fill:#d9822b}.c2s{stroke:#d9822b}.c2f{fill:#d9822b;fill-opacity:.14}.tint{fill:#f4f3ee}
  .bad{fill:#c8372d}.bads{stroke:#c8372d}.badf{fill:#c8372d;fill-opacity:.14}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}.acct{fill:#7aa9f5}
    .c2{fill:#eb9a4b}.c2s{stroke:#eb9a4b}.c2f{fill:#eb9a4b;fill-opacity:.2}.tint{fill:#22221f}
    .bad{fill:#ff7b70}.bads{stroke:#ff7b70}.badf{fill:#ff7b70;fill-opacity:.2}
  }
</style>
<defs><marker id="hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="edgef"/></marker></defs>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">A memóriahierarchia: minden szint nagyobb, lassabb és bájtonként olcsóbb</text>
<text x="240" y="62" font-size="11.5" font-weight="600" class="quiet" text-anchor="start">elérési idő</text>
<text x="420" y="62" font-size="11.5" font-weight="600" class="quiet" text-anchor="start">kapacitás</text>
<text x="600" y="62" font-size="11.5" font-weight="600" class="quiet" text-anchor="start">hol</text>
<rect x="24" y="72" width="740" height="36" rx="6" class="accf"/><rect x="24" y="72" width="740" height="36" rx="6" fill="none" class="acc" stroke-width="2"/>
<text x="36" y="95" font-size="12.5" font-weight="600" class="ink" text-anchor="start">regiszterek</text>
<text x="240" y="95" font-size="12" font-weight="400" class="ink" text-anchor="start">&lt; 1 ns</text>
<text x="420" y="95" font-size="12" font-weight="400" class="ink" text-anchor="start">kb. 1 KiB</text>
<text x="600" y="95" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">a CPU-magban</text>
<rect x="24" y="118" width="740" height="36" rx="6" class="accf"/><rect x="24" y="118" width="740" height="36" rx="6" fill="none" class="acc" stroke-width="2"/>
<text x="36" y="141" font-size="12.5" font-weight="600" class="ink" text-anchor="start">gyorsítótár (L1, L2, L3)</text>
<text x="240" y="141" font-size="12" font-weight="400" class="ink" text-anchor="start">1,6 / 4,4 / ~25 ns</text>
<text x="420" y="141" font-size="12" font-weight="400" class="ink" text-anchor="start">32 KiB … több tíz MiB</text>
<text x="600" y="141" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">a CPU-lapkán (SRAM)</text>
<rect x="24" y="164" width="740" height="36" rx="6" class="accf"/><rect x="24" y="164" width="740" height="36" rx="6" fill="none" class="acc" stroke-width="2"/>
<text x="36" y="187" font-size="12.5" font-weight="600" class="ink" text-anchor="start">központi memória (RAM)</text>
<text x="240" y="187" font-size="12" font-weight="400" class="ink" text-anchor="start">~100–180 ns</text>
<text x="420" y="187" font-size="12" font-weight="400" class="ink" text-anchor="start">GiB</text>
<text x="600" y="187" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">DRAM-modulok</text>
<rect x="24" y="210" width="740" height="36" rx="6" class="c2f"/><rect x="24" y="210" width="740" height="36" rx="6" fill="none" class="c2s" stroke-width="1.5"/>
<text x="36" y="233" font-size="12.5" font-weight="600" class="ink" text-anchor="start">SSD / merevlemez</text>
<text x="240" y="233" font-size="12" font-weight="400" class="ink" text-anchor="start">~0,1 ms / ~5–10 ms</text>
<text x="420" y="233" font-size="12" font-weight="400" class="ink" text-anchor="start">TB</text>
<text x="600" y="233" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">tartós</text>
<rect x="24" y="256" width="740" height="36" rx="6" class="c2f"/><rect x="24" y="256" width="740" height="36" rx="6" fill="none" class="c2s" stroke-width="1.5"/>
<text x="36" y="279" font-size="12.5" font-weight="600" class="ink" text-anchor="start">optikai lemez (CD, Blu-ray)</text>
<text x="240" y="279" font-size="12" font-weight="400" class="ink" text-anchor="start">~100 ms</text>
<text x="420" y="279" font-size="12" font-weight="400" class="ink" text-anchor="start">0,7–100 GB lemezenként</text>
<text x="600" y="279" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">cserélhető</text>
<rect x="24" y="302" width="740" height="36" rx="6" class="c2f"/><rect x="24" y="302" width="740" height="36" rx="6" fill="none" class="c2s" stroke-width="1.5"/>
<text x="36" y="325" font-size="12.5" font-weight="600" class="ink" text-anchor="start">mágnesszalag</text>
<text x="240" y="325" font-size="12" font-weight="400" class="ink" text-anchor="start">másodpercek – percek</text>
<text x="420" y="325" font-size="12" font-weight="400" class="ink" text-anchor="start">korlátlan (több szalag)</text>
<text x="600" y="325" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">archívum</text>
<path d="M774 74H780V198H774" fill="none" class="edge" stroke-width="1.5"/>
<text x="788" y="140.0" font-size="12" font-weight="600" class="ink" text-anchor="start">belső</text>
<text x="788" y="155.0" font-size="11" font-weight="400" class="quiet" text-anchor="start">tár</text>
<path d="M774 212H780V290H774" fill="none" class="edge" stroke-width="1.5"/>
<text x="788" y="255.0" font-size="12" font-weight="600" class="ink" text-anchor="start">külső</text>
<text x="788" y="270.0" font-size="11" font-weight="400" class="quiet" text-anchor="start">tár</text>
<path d="M774 304H780V336H774" fill="none" class="edge" stroke-width="1.5"/>
<text x="788" y="324.0" font-size="12" font-weight="600" class="ink" text-anchor="start">offline</text>
<text x="788" y="339.0" font-size="11" font-weight="400" class="quiet" text-anchor="start">tár</text>
<path d="M890 340V84" fill="none" class="edge" stroke-width="2" marker-end="url(#hi)"/>
<text x="902" y="210" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">bájtonkénti ár</text>
<text x="902" y="226" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">és sebesség</text>
<text x="24" y="368" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Kék: az előadás gyorsítótár–RAM párosa (felejtő, a hardver kezeli). Narancs: az alatta lévő tárak, ahol a RAM a lemez</text>
<text x="24" y="386" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">gyorsítótáraként működik (page cache, virtuális memória). A gyorsítótár-idők az előadás gépén mérve (latency.c).</text>
<text x="24" y="404" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">A belső tárat a CPU utasításai érik el, a külső tárat I/O-n keresztül; az offline tárnál előbb be kell helyezni az adathordozót.</text>
</svg>
