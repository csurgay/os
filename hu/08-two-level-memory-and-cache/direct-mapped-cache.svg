<text x="312" y="124" font-size="11" font-weight="400" class="quiet" text-anchor="start">az index kiválasztja a sort</text>
<path d="M124 102C124 180 151 190 151 226" fill="none" class="edge" stroke-width="1.5" marker-end="url(#dm)"/>
<text x="118" y="128" font-size="11" font-weight="400" class="quiet" text-anchor="end">összehasonlítás</text>
<path d="M500 102C520 160 420 190 410 226" fill="none" class="edge" stroke-width="1.5" marker-end="url(#dm)"/>
<text x="510" y="150" font-size="11" font-weight="400" class="quiet" text-anchor="start">az eltolás kiválasztja a szót</text>
<rect x="620" y="160" width="230" height="64" rx="8" class="accf"/><rect x="620" y="160" width="230" height="64" rx="8" fill="none" class="acc" stroke-width="2"/>
<text x="632" y="182" font-size="12" font-weight="600" class="ink" text-anchor="start">TALÁLAT: V = 1, a tag egyezik</text>
<text x="632" y="202" font-size="11" font-weight="400" class="quiet" text-anchor="start">a szó a gyorsítótárból jön</text>
<rect x="620" y="236" width="230" height="92" rx="8" class="c2f"/><rect x="620" y="236" width="230" height="92" rx="8" fill="none" class="c2s" stroke-width="1.5"/>
<text x="632" y="258" font-size="12" font-weight="600" class="ink" text-anchor="start">HIÁNY: az egész sor betöltése</text>
<text x="632" y="278" font-size="11" font-weight="400" class="quiet" text-anchor="start">a RAM-ból; ha D = 1, előbb a régi</text>
<text x="632" y="294" font-size="11" font-weight="400" class="quiet" text-anchor="start">sort visszaírjuk (write-back),</text>
<text x="632" y="312" font-size="11" font-weight="400" class="quiet" text-anchor="start">majd V = 1, D = 0, új tag</text>
<text x="24" y="360" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Tanpélda: 4 GiB RAM (32 bites címek) és 16 MiB-os gyorsítótár 1024 darab 16 KiB-os sorral. A valódi gyorsítótárak 64 bájtos</text>
<text x="24" y="378" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">és sokkal több sort használnak; a mechanizmus ugyanaz. V (valid): a sor valódi adatot tart; D (dirty): írtak bele, eltér a RAM-tól.</text>
</svg>
