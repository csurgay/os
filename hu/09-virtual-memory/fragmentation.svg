<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440" role="img" aria-label="Belső és külső fragmentáció" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Belső és külső fragmentáció</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .c2{fill:#d9822b}.c2s{stroke:#d9822b}.c2f{fill:#d9822b;fill-opacity:.14}.tint{fill:#f4f3ee}
  .bad{fill:#c8372d}.bads{stroke:#c8372d}.badf{fill:#c8372d;fill-opacity:.14}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}.acct{fill:#7aa9f5}
    .c2{fill:#eb9a4b}.c2s{stroke:#eb9a4b}.c2f{fill:#eb9a4b;fill-opacity:.2}.tint{fill:#22221f}
    .bad{fill:#ff7b70}.bads{stroke:#ff7b70}.badf{fill:#ff7b70;fill-opacity:.2}
  }
</style>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">Belső és külső fragmentáció</text>
<text x="24" y="62" font-size="13" font-weight="600" class="ink" text-anchor="start">Egyenlő méretű blokkok: belső fragmentáció</text>
<rect x="24" y="76" width="200" height="40" rx="2" class="tint"/><rect x="24" y="76" width="200" height="40" rx="2" fill="none" class="edge" stroke-width="1.25"/>
<rect x="24" y="76" width="200" height="40" class="accf"/>
<text x="234" y="101" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">100% foglalt</text>
<rect x="24" y="122" width="200" height="40" rx="2" class="tint"/><rect x="24" y="122" width="200" height="40" rx="2" fill="none" class="edge" stroke-width="1.25"/>
<rect x="24" y="122" width="70" height="40" class="accf"/>
<text x="234" y="147" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">35% foglalt</text>
<rect x="24" y="168" width="200" height="40" rx="2" class="tint"/><rect x="24" y="168" width="200" height="40" rx="2" fill="none" class="edge" stroke-width="1.25"/>
<rect x="24" y="168" width="180" height="40" class="accf"/>
<text x="234" y="193" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">90% foglalt</text>
<rect x="24" y="214" width="200" height="40" rx="2" class="tint"/><rect x="24" y="214" width="200" height="40" rx="2" fill="none" class="edge" stroke-width="1.25"/>
<rect x="24" y="214" width="100" height="40" class="accf"/>
<text x="234" y="239" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">50% foglalt</text>
<text x="24" y="310" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">minden blokk kihasználatlan maradéka a blokkon belül vész el</text>
<text x="24" y="328" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">(mint a félig üres szállítókonténerek)</text>
<text x="460" y="62" font-size="13" font-weight="600" class="ink" text-anchor="start">Változó méretű blokkok: külső fragmentáció</text>
<rect x="460" y="76" width="180" height="30" rx="0" class="accf"/><rect x="460" y="76" width="180" height="30" rx="0" fill="none" class="acc" stroke-width="2"/>
<text x="550" y="95.0" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">1. foglalás</text>
<rect x="460" y="106" width="180" height="44" rx="0" class="accf"/><rect x="460" y="106" width="180" height="44" rx="0" fill="none" class="acc" stroke-width="2"/>
<text x="550" y="132.0" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">2. foglalás</text>
<rect x="460" y="150" width="180" height="34" rx="0" class="tint"/><rect x="460" y="150" width="180" height="34" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<text x="550" y="171.0" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">szabad</text>
<rect x="460" y="184" width="180" height="50" rx="0" class="c2f"/><rect x="460" y="184" width="180" height="50" rx="0" fill="none" class="c2s" stroke-width="1.5"/>
<text x="550" y="213.0" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">5. foglalás</text>
<rect x="460" y="234" width="180" height="28" rx="0" class="tint"/><rect x="460" y="234" width="180" height="28" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<text x="550" y="252.0" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">szabad</text>
<rect x="460" y="262" width="180" height="26" rx="0" class="accf"/><rect x="460" y="262" width="180" height="26" rx="0" fill="none" class="acc" stroke-width="2"/>
<text x="550" y="279.0" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">6. foglalás</text>
<rect x="670" y="120" width="120" height="50" rx="4" class="badf"/><rect x="670" y="120" width="120" height="50" rx="4" fill="none" class="bads" stroke-width="1.5"/>
<text x="730" y="141" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">új kérés</text>
<text x="730" y="158" font-size="11" font-weight="400" class="quiet" text-anchor="middle">50 egység kell</text>
<text x="460" y="310" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">összesen 62 egység szabad, de egyik lyuk sem elég nagy;</text>
<text x="460" y="328" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">a tömörítés (töredezettségmentesítés) egymás mellé tolná a blokkokat</text>
<text x="24" y="372" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">A fragmentált memória olyan, mint a zebra, a tömörített pedig mint egy ló, amelynek minden sötét csíkja egy foltba gyűlt.</text>
