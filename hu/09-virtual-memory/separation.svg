<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Több program egy RAM-ban: ki kit véd, és mi lesz, ha még egy érkezik?" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Több program egy RAM-ban: ki kit véd, és mi lesz, ha még egy érkezik?</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .c2{fill:#d9822b}.c2s{stroke:#d9822b}.c2f{fill:#d9822b;fill-opacity:.14}.tint{fill:#f4f3ee}
  .bad{fill:#c8372d}.bads{stroke:#c8372d}.badf{fill:#c8372d;fill-opacity:.14}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}.acct{fill:#7aa9f5}
    .c2{fill:#eb9a4b}.c2s{stroke:#eb9a4b}.c2f{fill:#eb9a4b;fill-opacity:.2}.tint{fill:#22221f}
    .bad{fill:#ff7b70}.bads{stroke:#ff7b70}.badf{fill:#ff7b70;fill-opacity:.2}
  }
</style>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">Több program egy RAM-ban: ki kit véd, és mi lesz, ha még egy érkezik?</text>
<rect x="60" y="52" width="160" height="40" rx="0" class="tint"/><rect x="60" y="52" width="160" height="40" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<text x="140" y="76.0" font-size="12" font-weight="600" class="ink" text-anchor="middle">OS</text>
<rect x="60" y="92" width="160" height="56" rx="0" class="accf"/><rect x="60" y="92" width="160" height="56" rx="0" fill="none" class="acc" stroke-width="2"/>
<text x="140" y="124.0" font-size="12" font-weight="600" class="ink" text-anchor="middle">1. folyamat</text>
<rect x="60" y="148" width="160" height="50" rx="0" class="c2f"/><rect x="60" y="148" width="160" height="50" rx="0" fill="none" class="c2s" stroke-width="1.5"/>
<text x="140" y="177.0" font-size="12" font-weight="600" class="ink" text-anchor="middle">2. folyamat</text>
<rect x="60" y="198" width="160" height="40" rx="0" class="accf"/><rect x="60" y="198" width="160" height="40" rx="0" fill="none" class="acc" stroke-width="2"/>
<text x="140" y="222.0" font-size="12" font-weight="600" class="ink" text-anchor="middle">3. folyamat</text>
<rect x="60" y="238" width="160" height="24" rx="0" class="tint"/><rect x="60" y="238" width="160" height="24" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<text x="140" y="254.0" font-size="12" font-weight="400" class="quiet" text-anchor="middle">szabad</text>
<rect x="60" y="262" width="160" height="60" rx="0" class="c2f"/><rect x="60" y="262" width="160" height="60" rx="0" fill="none" class="c2s" stroke-width="1.5"/>
<text x="140" y="296.0" font-size="12" font-weight="600" class="ink" text-anchor="middle">4. folyamat</text>
<rect x="60" y="322" width="160" height="30" rx="0" class="tint"/><rect x="60" y="322" width="160" height="30" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<text x="140" y="341.0" font-size="12" font-weight="400" class="quiet" text-anchor="middle">szabad</text>
<text x="140" y="372" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">fizikai RAM</text>
<rect x="260" y="120" width="120" height="70" rx="6" class="badf"/><rect x="260" y="120" width="120" height="70" rx="6" fill="none" class="bads" stroke-width="1.5"/>
<text x="320" y="150" font-size="12" font-weight="600" class="ink" text-anchor="middle">5. folyamat</text>
<text x="320" y="168" font-size="11" font-weight="400" class="quiet" text-anchor="middle">70 egység kell</text>
<text x="420" y="72" font-size="13" font-weight="600" class="ink" text-anchor="start">Védelem</text>
<text x="420" y="90" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">az 1. folyamat nem olvashatja és nem írhatja felül a 2. folyamatot vagy az OS-t</text>
<text x="420" y="128" font-size="13" font-weight="600" class="ink" text-anchor="start">Áthelyezés</text>
<text x="420" y="146" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">a program nem tudhatja előre, melyik címre töltik be</text>
<text x="420" y="184" font-size="13" font-weight="600" class="ink" text-anchor="start">Fragmentáció</text>
<text x="420" y="202" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">54 egység szabad, de két lyukban: az 5. folyamat nem fér el</text>
<text x="420" y="240" font-size="13" font-weight="600" class="ink" text-anchor="start">Méret</text>
<text x="420" y="258" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">a folyamatoknak együtt több memória kellhet, mint amennyi RAM van</text>
<text x="420" y="310" font-size="11.5" font-weight="400" class="acct" text-anchor="start">A virtuális memória mind a négyre választ ad: minden folyamat saját, privát,</text>
<text x="420" y="328" font-size="11.5" font-weight="400" class="acct" text-anchor="start">összefüggő címtartományt kap 0-tól a maximumig, a RAM-ra és a lemezre leképezve.</text>
</svg>
