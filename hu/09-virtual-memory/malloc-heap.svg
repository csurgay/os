<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="920" height="430" role="img" aria-label="Honnan kap memóriát a malloc: kis blokkokhoz a heapből (brk), nagyokhoz saját leképezésből (mmap)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Honnan kap memóriát a malloc: kis blokkokhoz a heapből (brk), nagyokhoz saját leképezésből (mmap)</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .c2{fill:#d9822b}.c2s{stroke:#d9822b}.c2f{fill:#d9822b;fill-opacity:.14}.tint{fill:#f4f3ee}
  .bad{fill:#c8372d}.bads{stroke:#c8372d}.badf{fill:#c8372d;fill-opacity:.14}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}.acct{fill:#7aa9f5}
    .c2{fill:#eb9a4b}.c2s{stroke:#eb9a4b}.c2f{fill:#eb9a4b;fill-opacity:.2}.tint{fill:#22221f}
    .bad{fill:#ff7b70}.bads{stroke:#ff7b70}.badf{fill:#ff7b70;fill-opacity:.2}
  }
</style>
<defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="edgef"/></marker><marker id="ma2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="acct"/></marker></defs>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">Honnan kap memóriát a malloc: kis blokkokhoz a heapből (brk), nagyokhoz saját leképezésből (mmap)</text>
<text x="40" y="56" font-size="12" font-weight="600" class="ink" text-anchor="start">egy folyamat virtuális címtartománya</text>
<rect x="40" y="66" width="220" height="40" rx="0" class="tint"/><rect x="40" y="66" width="220" height="40" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<text x="150.0" y="90.0" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">verem (fő szál)</text>
<rect x="40" y="106" width="220" height="26" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<rect x="40" y="132" width="220" height="30" rx="0" class="tint"/><rect x="40" y="132" width="220" height="30" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<text x="150.0" y="151.0" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">megosztott könyvtárak (libc)</text>
<rect x="40" y="162" width="220" height="40" rx="0" class="c2f"/><rect x="40" y="162" width="220" height="40" rx="0" fill="none" class="c2s" stroke-width="1.5"/>
<text x="150.0" y="179.0" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">1 MiB-os blokk: saját mmap</text>
<text x="150.0" y="194.0" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">munmap szabadítja fel</text>
<rect x="40" y="202" width="220" height="48" rx="0" class="accf"/><rect x="40" y="202" width="220" height="48" rx="0" fill="none" class="acc" stroke-width="2"/>
<text x="150.0" y="223.0" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">a 2. szál arenája</text>
<text x="150.0" y="238.0" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">64 MiB lefoglalva, ezen belül nő</text>
<rect x="40" y="250" width="220" height="46" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<rect x="40" y="296" width="220" height="70" rx="0" class="accf"/><rect x="40" y="296" width="220" height="70" rx="0" fill="none" class="acc" stroke-width="2"/>
<text x="150.0" y="335.0" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">heap (fő arena)</text>
<rect x="40" y="366" width="220" height="30" rx="0" class="tint"/><rect x="40" y="366" width="220" height="30" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<text x="150.0" y="385.0" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">programkód és adatok</text>
<text x="150.0" y="268" font-size="11" font-weight="400" class="quiet" text-anchor="middle">nem használt</text>
<text x="150.0" y="122" font-size="11" font-weight="400" class="quiet" text-anchor="middle">nem használt</text>
<text x="150.0" y="289" font-size="11.5" font-weight="600" class="acct" text-anchor="middle">↑ program break, a brk() mozgatja</text>
<text x="40" y="414" font-size="10.5" font-weight="400" class="quiet" text-anchor="start">fent a magas címek; a heap felfelé nő, a leképezések a verem alá kerülnek</text>
<text x="420" y="56" font-size="12" font-weight="600" class="ink" text-anchor="start">a heap belseje: chunkok, mindegyik méretfejléccel</text>
<rect x="420" y="70" width="60" height="36" rx="0" class="c2f"/><rect x="420" y="70" width="60" height="36" rx="0" fill="none" class="c2s" stroke-width="1.5"/>
<rect x="420" y="70" width="6" height="36" class="edgef"/>
<text x="453.0" y="93" font-size="11" font-weight="600" class="ink" text-anchor="middle">foglalt</text>
<rect x="480" y="70" width="54" height="36" rx="0" class="accf"/><rect x="480" y="70" width="54" height="36" rx="0" fill="none" class="acc" stroke-width="2"/>
<rect x="480" y="70" width="6" height="36" class="edgef"/>
<text x="510.0" y="93" font-size="11" font-weight="400" class="ink" text-anchor="middle">szabad</text>
<rect x="534" y="70" width="76" height="36" rx="0" class="c2f"/><rect x="534" y="70" width="76" height="36" rx="0" fill="none" class="c2s" stroke-width="1.5"/>
<rect x="534" y="70" width="6" height="36" class="edgef"/>
<text x="575.0" y="93" font-size="11" font-weight="600" class="ink" text-anchor="middle">foglalt</text>
<rect x="610" y="70" width="30" height="36" rx="0" class="c2f"/><rect x="610" y="70" width="30" height="36" rx="0" fill="none" class="c2s" stroke-width="1.5"/>
<rect x="610" y="70" width="6" height="36" class="edgef"/>
<rect x="640" y="70" width="60" height="36" rx="0" class="accf"/><rect x="640" y="70" width="60" height="36" rx="0" fill="none" class="acc" stroke-width="2"/>
<rect x="640" y="70" width="6" height="36" class="edgef"/>
<text x="673.0" y="93" font-size="11" font-weight="400" class="ink" text-anchor="middle">szabad</text>
<rect x="700" y="70" width="70" height="36" rx="0" class="c2f"/><rect x="700" y="70" width="70" height="36" rx="0" fill="none" class="c2s" stroke-width="1.5"/>
<rect x="700" y="70" width="6" height="36" class="edgef"/>
<text x="738.0" y="93" font-size="11" font-weight="600" class="ink" text-anchor="middle">foglalt</text>
<rect x="770" y="70" width="70" height="36" rx="0" class="tint"/><rect x="770" y="70" width="70" height="36" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<rect x="770" y="70" width="6" height="36" class="edgef"/>
<text x="808.0" y="93" font-size="11" font-weight="400" class="quiet" text-anchor="middle">top</text>
<text x="420" y="124" font-size="10.5" font-weight="400" class="quiet" text-anchor="start">szürke szél = fejléc (méret, jelzőbitek); „top” = a szabad maradék a program breakig</text>
<text x="420" y="146" font-size="11.5" font-weight="600" class="ink" text-anchor="start">a szabad chunkok binekben várnak; a malloc nagyjából ebben a sorrendben nézi:</text>
<rect x="420" y="152" width="110" height="28" rx="4" class="accf"/><rect x="420" y="152" width="110" height="28" rx="4" fill="none" class="acc" stroke-width="2"/>
<text x="475" y="170" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">tcache</text>
<text x="540" y="170" font-size="11" font-weight="400" class="quiet" text-anchor="start">szálanként, méretenként 7 chunk, 1 KiB-ig: semmilyen zár</text>
<rect x="420" y="188" width="110" height="28" rx="4" class="accf"/><rect x="420" y="188" width="110" height="28" rx="4" fill="none" class="acc" stroke-width="2"/>
<text x="475" y="206" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">fast bins</text>
<text x="540" y="206" font-size="11" font-weight="400" class="quiet" text-anchor="start">kis méretek (alapból 128 B-ig), összeolvasztás nélkül</text>
<rect x="420" y="224" width="110" height="28" rx="4" class="accf"/><rect x="420" y="224" width="110" height="28" rx="4" fill="none" class="acc" stroke-width="2"/>
<text x="475" y="242" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">small bins</text>
<text x="540" y="242" font-size="11" font-weight="400" class="quiet" text-anchor="start">binenként egyetlen pontos méret, 1 KiB alatt</text>
<rect x="420" y="260" width="110" height="28" rx="4" class="accf"/><rect x="420" y="260" width="110" height="28" rx="4" fill="none" class="acc" stroke-width="2"/>
<text x="475" y="278" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">unsorted bin</text>
<text x="540" y="278" font-size="11" font-weight="400" class="quiet" text-anchor="start">friss szabad chunkok; a következő malloc rendezi el</text>
<rect x="420" y="296" width="110" height="28" rx="4" class="accf"/><rect x="420" y="296" width="110" height="28" rx="4" fill="none" class="acc" stroke-width="2"/>
<text x="475" y="314" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">large bins</text>
<text x="540" y="314" font-size="11" font-weight="400" class="quiet" text-anchor="start">mérettartományok, méret szerint rendezve, best fit</text>
<text x="420" y="346" font-size="11.5" font-weight="400" class="ink" text-anchor="start">ha egyik bin sem jó: a chunkot a top chunkból vágja le;</text>
<text x="420" y="364" font-size="11.5" font-weight="400" class="c2" text-anchor="start">ha a top túl kicsi: a brk() megnöveli a heapet, de az mmap-küszöböt</text>
<text x="420" y="382" font-size="11.5" font-weight="400" class="c2" text-anchor="start">(kezdetben 128 KiB) elérő kérés saját leképezést kap</text>
</svg>
