<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 358" width="760" height="358" role="img" aria-label="A memória virtualizálása: két címfordítás, szoftveresen vagy hardveresen">
<title>A memória virtualizálása: két címfordítás, szoftveresen vagy hardveresen</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .c2{fill:#d9822b}.c2s{stroke:#d9822b}.c2f{fill:#d9822b;fill-opacity:.14}.tint{fill:#f4f3ee}
  .bad{fill:#c8372d}.bads{stroke:#c8372d}.badf{fill:#c8372d;fill-opacity:.14}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}.acct{fill:#7aa9f5}
    .c2{fill:#eb9a4b}.c2s{stroke:#eb9a4b}.c2f{fill:#eb9a4b;fill-opacity:.2}.tint{fill:#22221f}
    .bad{fill:#ff7b70}.bads{stroke:#ff7b70}.badf{fill:#ff7b70;fill-opacity:.2}
  }
</style>
<defs><marker id="np" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="edgef"/></marker><marker id="npa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="acct"/></marker></defs>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">A memória virtualizálása: két címfordítás, szoftveresen vagy hardveresen</text>
<rect x="24" y="92" width="180" height="50" rx="6" class="tint"/><rect x="24" y="92" width="180" height="50" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="114.0" y="113.82" font-size="12" font-weight="600" class="ink" text-anchor="middle">vendég virtuális</text>
<text x="114.0" y="128.82" font-size="12" font-weight="400" class="quiet" text-anchor="middle">cím (GVA)</text>
<rect x="290" y="92" width="180" height="50" rx="6" class="tint"/><rect x="290" y="92" width="180" height="50" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="380.0" y="113.82" font-size="12" font-weight="600" class="ink" text-anchor="middle">vendég fizikai</text>
<text x="380.0" y="128.82" font-size="12" font-weight="400" class="quiet" text-anchor="middle">cím (GPA)</text>
<rect x="556" y="92" width="180" height="50" rx="6" class="tint"/><rect x="556" y="92" width="180" height="50" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="646.0" y="113.82" font-size="12" font-weight="600" class="ink" text-anchor="middle">gazdagép-fizikai</text>
<text x="646.0" y="128.82" font-size="12" font-weight="400" class="quiet" text-anchor="middle">cím (HPA)</text>
<path d="M204 117H286" fill="none" class="edge" stroke-width="1.5" marker-end="url(#np)"/>
<text x="245" y="80" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">vendég laptábla</text>
<text x="245" y="64" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">a vendég OS tartja fenn</text>
<path d="M470 117H552" fill="none" class="edge" stroke-width="1.5" marker-end="url(#np)"/>
<text x="511" y="80" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">EPT / NPT</text>
<text x="511" y="64" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">a hypervisor tartja fenn</text>
<path d="M114 144C114 211 180 211 246 211" fill="none" class="acc" stroke-width="1.5" stroke-dasharray="6 4"/>
<path d="M514 211C610 211 646 202 646 148" fill="none" class="acc" stroke-width="1.5" marker-end="url(#npa)" stroke-dasharray="6 4"/>
<rect x="250" y="190" width="260" height="42" rx="6" class="accf"/><rect x="250" y="190" width="260" height="42" rx="6" fill="none" class="acc" stroke-width="2"/>
<text x="380.0" y="207.89" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">shadow laptábla: GVA → HPA</text>
<text x="380.0" y="222.39" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">a hypervisor építi és tartja szinkronban</text>
<text x="24" y="272" font-size="11.5" font-weight="400" class="ink" text-anchor="start">Szoftveresen (szaggatott; kb. 2008 előtt): a hypervisor írásvédi a vendég laptábláit, minden módosításra trap jön, és egy</text>
<text x="24" y="290" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">shadow táblát tart fenn, ezt használja a valódi MMU. A TLB-hiány olcsó marad, de a vendég minden laptábla-módosítása VM exit.</text>
<text x="24" y="320" font-size="11.5" font-weight="400" class="ink" text-anchor="start">Hardveresen (AMD NPT 2007-től, Intel EPT 2008-tól): TLB-hiánykor maga az MMU járja be mindkét táblát, és GVA → HPA-t tárol.</text>
<text x="24" y="338" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">A laptábla-módosítás nem okoz exitet, de két négyszintű táblával egy TLB-hiány 4 helyett akár 24 memóriahivatkozás.</text>
</svg>
