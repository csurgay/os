<text x="24" y="372" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Véletlenszerű mutatókövetés egy 2,8 GHz-es Xeonon (felhőbeli VM): kb. 1,6 ns (4–5 ciklus) az L1-ben, 4,4 ns az L2-ben,</text>
<text x="24" y="390" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">25 ns a más bérlőkkel közös L3-ban, 110–180 ns a RAM-ból. Logaritmikus skálák; minden lépcső egy hierarchiaszint.</text>
