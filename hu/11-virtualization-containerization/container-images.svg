<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" width="760" height="352" role="img" aria-label="Az image saját felhasználói teret hoz; minden konténer a gazdagép kernelén osztozik">
<title>Az image saját felhasználói teret hoz; minden konténer a gazdagép kernelén osztozik</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .c2{fill:#d9822b}.c2s{stroke:#d9822b}.c2f{fill:#d9822b;fill-opacity:.14}.tint{fill:#f4f3ee}
  .bad{fill:#c8372d}.bads{stroke:#c8372d}.badf{fill:#c8372d;fill-opacity:.14}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}.acct{fill:#7aa9f5}
    .c2{fill:#eb9a4b}.c2s{stroke:#eb9a4b}.c2f{fill:#eb9a4b;fill-opacity:.2}.tint{fill:#22221f}
    .bad{fill:#ff7b70}.bads{stroke:#ff7b70}.badf{fill:#ff7b70;fill-opacity:.2}
  }
</style>
<defs><marker id="ct" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="edgef"/></marker></defs>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">Az image saját felhasználói teret hoz; minden konténer a gazdagép kernelén osztozik</text>
<text x="24" y="66" font-size="13" font-weight="600" class="ink" text-anchor="start">Két image ugyanarra az alapra építve</text>
<rect x="24" y="80" width="150" height="34" rx="4" class="c2f"/><rect x="24" y="80" width="150" height="34" rx="4" fill="none" class="c2s" stroke-width="1.5"/>
<text x="99.0" y="102" font-size="12" font-weight="400" class="ink" text-anchor="middle">webalkalmazás</text>
<rect x="24" y="118" width="150" height="34" rx="4" class="tint"/><rect x="24" y="118" width="150" height="34" rx="4" fill="none" class="edge" stroke-width="1.25"/>
<text x="99.0" y="140" font-size="12" font-weight="400" class="ink" text-anchor="middle">Python-csomagok</text>
<text x="99.0" y="216" font-size="11.5" font-weight="600" class="quiet" text-anchor="middle">1. image</text>
<rect x="190" y="80" width="150" height="34" rx="4" class="c2f"/><rect x="190" y="80" width="150" height="34" rx="4" fill="none" class="c2s" stroke-width="1.5"/>
<text x="265.0" y="102" font-size="12" font-weight="400" class="ink" text-anchor="middle">számlázó app</text>
<rect x="190" y="118" width="150" height="34" rx="4" class="tint"/><rect x="190" y="118" width="150" height="34" rx="4" fill="none" class="edge" stroke-width="1.25"/>
<text x="265.0" y="140" font-size="12" font-weight="400" class="ink" text-anchor="middle">Java runtime</text>
<text x="265.0" y="216" font-size="11.5" font-weight="600" class="quiet" text-anchor="middle">2. image</text>
<rect x="24" y="156" width="316" height="42" rx="4" class="accf"/><rect x="24" y="156" width="316" height="42" rx="4" fill="none" class="acc" stroke-width="2"/>
<text x="182" y="182" font-size="12" font-weight="600" class="ink" text-anchor="middle">alapréteg: UBI 9 (egy példány a lemezen)</text>
<text x="24" y="262" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">A rétegek csak olvashatók, és hash azonosítja őket,</text>
<text x="24" y="278" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">így a közös alapot csak egyszer tárolják és töltik le.</text>
<text x="400" y="66" font-size="13" font-weight="600" class="ink" text-anchor="start">Egy gazdagép három konténerrel</text>
<rect x="400" y="80" width="100" height="86" rx="6" class="c2f"/><rect x="400" y="80" width="100" height="86" rx="6" fill="none" class="c2s" stroke-width="1.5"/>
<text x="450.0" y="104" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">alkalmazás</text>
<text x="450.0" y="128" font-size="12" font-weight="600" class="ink" text-anchor="middle">UBI 9</text>
<text x="450.0" y="146" font-size="11" font-weight="400" class="quiet" text-anchor="middle">felhasználói tér</text>
<path d="M450.0 166V196" fill="none" class="edge" stroke-width="1.25" marker-end="url(#ct)"/>
<rect x="518" y="80" width="100" height="86" rx="6" class="tint"/><rect x="518" y="80" width="100" height="86" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="568.0" y="104" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">alkalmazás</text>
<text x="568.0" y="128" font-size="12" font-weight="600" class="ink" text-anchor="middle">AlmaLinux 9</text>
<text x="568.0" y="146" font-size="11" font-weight="400" class="quiet" text-anchor="middle">felhasználói tér</text>
<path d="M568.0 166V196" fill="none" class="edge" stroke-width="1.25" marker-end="url(#ct)"/>
<rect x="636" y="80" width="100" height="86" rx="6" class="tint"/><rect x="636" y="80" width="100" height="86" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="686.0" y="104" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">alkalmazás</text>
<text x="686.0" y="128" font-size="12" font-weight="600" class="ink" text-anchor="middle">Fedora</text>
<text x="686.0" y="146" font-size="11" font-weight="400" class="quiet" text-anchor="middle">felhasználói tér</text>
<path d="M686.0 166V196" fill="none" class="edge" stroke-width="1.25" marker-end="url(#ct)"/>
<rect x="400" y="198" width="336" height="40" rx="6" class="accf"/><rect x="400" y="198" width="336" height="40" rx="6" fill="none" class="acc" stroke-width="2"/>
<text x="568.0" y="223" font-size="12.5" font-weight="600" class="ink" text-anchor="middle">egyetlen Linux kernel: a gazdagépé (pl. RHEL 9)</text>
<rect x="400" y="244" width="336" height="30" rx="6" class="tint"/><rect x="400" y="244" width="336" height="30" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="568.0" y="264" font-size="12" font-weight="400" class="ink" text-anchor="middle">hardver</text>
<text x="24" y="314" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Nyilak: rendszerhívások. Minden konténer ugyanahhoz a kernelhez beszél, ezért RHEL/UBI image-ekhez a Red Hat csak azonos</text>
<text x="24" y="332" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">főverziójú gazdagépet támogat teljesen; más párosításokat csak közönséges, nem privilegizált terhelésre (kompatibilitási mátrix).</text>
</svg>
