<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">Hol fut a hypervisor: 1-es típus, 2-es típus és KVM</text>
<text x="24" y="62" font-size="13" font-weight="600" class="ink" text-anchor="start">1-es típus (bare metal)</text>
