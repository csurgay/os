<text x="24" y="376" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">1-es típus: a hypervisoré a hardver. 2-es típus: egy közönséges OS-en futó program, és annak drivereit használja.</text>
<text x="24" y="394" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">A KVM magát a Linux kernelt teszi hypervisorrá; minden VM egy közönséges folyamat (QEMU), virtuális CPU-nként egy szállal.</text>
