<text x="384.0" y="338.14" font-size="11.5" font-weight="400" class="ink" text-anchor="middle">hardver (VT-x / AMD-V támogatással)</text>
<text x="516" y="62" font-size="13" font-weight="600" class="ink" text-anchor="start">KVM (a Linux a hypervisor)</text>
<text x="516" y="80" font-size="11" font-weight="400" class="quiet" text-anchor="start">KVM + QEMU, Firecracker</text>
