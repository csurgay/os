<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 408" width="760" height="408" role="img" aria-label="OverlayFS: csak olvasható alsó rétegek, egy írható felső réteg, egy egyesített nézet">
<title>OverlayFS: csak olvasható alsó rétegek, egy írható felső réteg, egy egyesített nézet</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .c2{fill:#d9822b}.c2s{stroke:#d9822b}.c2f{fill:#d9822b;fill-opacity:.14}.tint{fill:#f4f3ee}
  .bad{fill:#c8372d}.bads{stroke:#c8372d}.badf{fill:#c8372d;fill-opacity:.14}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}.acct{fill:#7aa9f5}
    .c2{fill:#eb9a4b}.c2s{stroke:#eb9a4b}.c2f{fill:#eb9a4b;fill-opacity:.2}.tint{fill:#22221f}
    .bad{fill:#ff7b70}.bads{stroke:#ff7b70}.badf{fill:#ff7b70;fill-opacity:.2}
  }
</style>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">OverlayFS: csak olvasható alsó rétegek, egy írható felső réteg, egy egyesített nézet</text>
<text x="292" y="62" font-size="12" font-weight="600" class="ink" text-anchor="middle">os-release</text>
<text x="412" y="62" font-size="12" font-weight="600" class="ink" text-anchor="middle">app.conf</text>
<text x="532" y="62" font-size="12" font-weight="600" class="ink" text-anchor="middle">app.py</text>
<text x="652" y="62" font-size="12" font-weight="600" class="ink" text-anchor="middle">new.txt</text>
<text x="24" y="102" font-size="12.5" font-weight="600" class="ink" text-anchor="start">merged</text>
<text x="24" y="120" font-size="11" font-weight="400" class="quiet" text-anchor="start">amit a konténer lát</text>
<text x="24" y="172" font-size="12.5" font-weight="600" class="ink" text-anchor="start">upperdir</text>
<text x="24" y="190" font-size="11" font-weight="400" class="quiet" text-anchor="start">írható: a konténer rétege</text>
<text x="24" y="242" font-size="12.5" font-weight="600" class="ink" text-anchor="start">lowerdir 1</text>
<text x="24" y="260" font-size="11" font-weight="400" class="quiet" text-anchor="start">alkalmazásréteg (csak olv.)</text>
<text x="24" y="312" font-size="12.5" font-weight="600" class="ink" text-anchor="start">lowerdir 2</text>
<text x="24" y="330" font-size="11" font-weight="400" class="quiet" text-anchor="start">alapréteg (csak olvasható)</text>
<rect x="236" y="296" width="112" height="40" rx="6" class="accf"/><rect x="236" y="296" width="112" height="40" rx="6" fill="none" class="acc" stroke-width="2"/>
<text x="292.0" y="319.96" font-size="11" font-weight="400" class="ink" text-anchor="middle">base v1</text>
<rect x="356" y="296" width="112" height="40" rx="6" class="accf"/><rect x="356" y="296" width="112" height="40" rx="6" fill="none" class="acc" stroke-width="2"/>
<text x="412.0" y="319.96" font-size="11" font-weight="400" class="ink" text-anchor="middle">config, base</text>
<rect x="476" y="226" width="112" height="40" rx="6" class="accf"/><rect x="476" y="226" width="112" height="40" rx="6" fill="none" class="acc" stroke-width="2"/>
<text x="532.0" y="249.96" font-size="11" font-weight="400" class="ink" text-anchor="middle">print('hi')</text>
<rect x="236" y="156" width="112" height="40" rx="6" class="badf"/><rect x="236" y="156" width="112" height="40" rx="6" fill="none" class="bads" stroke-width="1.5"/>
<text x="292.0" y="179.96" font-size="11" font-weight="400" class="ink" text-anchor="middle">whiteout (c 0,0)</text>
<rect x="356" y="156" width="112" height="40" rx="6" class="c2f"/><rect x="356" y="156" width="112" height="40" rx="6" fill="none" class="c2s" stroke-width="1.5"/>
<text x="412.0" y="179.96" font-size="11" font-weight="400" class="ink" text-anchor="middle">felmásolva, átírva</text>
<rect x="596" y="156" width="112" height="40" rx="6" class="c2f"/><rect x="596" y="156" width="112" height="40" rx="6" fill="none" class="c2s" stroke-width="1.5"/>
<text x="652.0" y="179.96" font-size="11" font-weight="400" class="ink" text-anchor="middle">scratch</text>
<rect x="356" y="86" width="112" height="40" rx="6" class="tint"/><rect x="356" y="86" width="112" height="40" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="412.0" y="109.96" font-size="11" font-weight="400" class="ink" text-anchor="middle">a felsőből</text>
<rect x="476" y="86" width="112" height="40" rx="6" class="tint"/><rect x="476" y="86" width="112" height="40" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="532.0" y="109.96" font-size="11" font-weight="400" class="ink" text-anchor="middle">a lower 1-ből</text>
<rect x="596" y="86" width="112" height="40" rx="6" class="tint"/><rect x="596" y="86" width="112" height="40" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="652.0" y="109.96" font-size="11" font-weight="400" class="ink" text-anchor="middle">a felsőből</text>
<rect x="236" y="86" width="112" height="40" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="292.0" y="109.96" font-size="11" font-weight="400" class="quiet" text-anchor="middle">(eltakarva)</text>
<text x="24" y="372" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">A fájlt felülről lefelé keresi; az első réteg nyer, amelyben megvan. Egy alsó fájl módosítása előbb felmásolja;</text>
<text x="24" y="390" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">a törlése whiteoutot hagy a felső rétegben. Az alsó rétegek sosem változnak, így sok konténer osztozhat rajtuk.</text>
</svg>
