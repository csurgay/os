<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 434" width="900" height="434" role="img" aria-label="A Linux ütemezési osztályai a legmagasabb prioritástól a legalacsonyabbig" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>A Linux ütemezési osztályai a legmagasabb prioritástól a legalacsonyabbig</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .c2{fill:#d9822b}.c2s{stroke:#d9822b}.c2f{fill:#d9822b;fill-opacity:.14}.tint{fill:#f4f3ee}
  .bad{fill:#c8372d}.bads{stroke:#c8372d}.badf{fill:#c8372d;fill-opacity:.14}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}.acct{fill:#7aa9f5}
    .c2{fill:#eb9a4b}.c2s{stroke:#eb9a4b}.c2f{fill:#eb9a4b;fill-opacity:.2}.tint{fill:#22221f}
    .bad{fill:#ff7b70}.bads{stroke:#ff7b70}.badf{fill:#ff7b70;fill-opacity:.2}
  }
</style>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">A Linux ütemezési osztályai a legmagasabb prioritástól a legalacsonyabbig</text>
<rect x="24" y="48" width="760" height="36" rx="6" class="tint"/><rect x="24" y="48" width="760" height="36" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="40" y="71" font-size="12.5" font-weight="600" class="ink" text-anchor="start">stop</text>
<text x="184" y="71" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">kernelen belüli: CPU-k menet közbeni be- és kikapcsolása, feladatok átköltöztetése</text>
<rect x="24" y="92" width="760" height="36" rx="6" class="badf"/><rect x="24" y="92" width="760" height="36" rx="6" fill="none" class="bads" stroke-width="1.5"/>
<text x="40" y="115" font-size="12.5" font-weight="600" class="ink" text-anchor="start">deadline</text>
<text x="184" y="115" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">SCHED_DEADLINE: futásidő / határidő / periódus, a legkorábbi határidő először</text>
<rect x="24" y="136" width="760" height="36" rx="6" class="c2f"/><rect x="24" y="136" width="760" height="36" rx="6" fill="none" class="c2s" stroke-width="1.5"/>
<text x="40" y="159" font-size="12.5" font-weight="600" class="ink" text-anchor="start">valós idejű</text>
<text x="184" y="159" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">SCHED_FIFO, SCHED_RR: statikus prioritás 1–99, mindig a magasabb fut először</text>
<rect x="24" y="180" width="760" height="36" rx="6" class="accf"/><rect x="24" y="180" width="760" height="36" rx="6" fill="none" class="acc" stroke-width="2"/>
<text x="40" y="203" font-size="12.5" font-weight="600" class="ink" text-anchor="start">méltányos (EEVDF)</text>
<text x="184" y="203" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">SCHED_NORMAL (= SCHED_OTHER), SCHED_BATCH, SCHED_IDLE: súly szerinti részesedés (nice −20 … 19)</text>
<rect x="24" y="224" width="760" height="36" rx="6" class="tint"/><rect x="24" y="224" width="760" height="36" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="40" y="247" font-size="12.5" font-weight="600" class="ink" text-anchor="start">ext</text>
<text x="184" y="247" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">sched_ext: BPF-programként betöltött ütemező (opcionális, Linux 6.12+)</text>
<rect x="24" y="268" width="760" height="36" rx="6" class="tint"/><rect x="24" y="268" width="760" height="36" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="40" y="291" font-size="12.5" font-weight="600" class="ink" text-anchor="start">idle</text>
<text x="184" y="291" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">az idle (tétlen) feladat: csak akkor fut, ha semmi más nem tud</text>
<text x="24" y="330" font-size="13" font-weight="600" class="ink" text-anchor="start">A méltányos osztályon belül: két processzorigényes feladat egy magon, mérve (shares.sh)</text>
<text x="24" y="365" font-size="12" font-weight="600" class="ink" text-anchor="start">nice 0 vs. nice 5</text>
<rect x="170" y="346" width="422.3" height="28" class="accf"/><rect x="170" y="346" width="422.3" height="28" fill="none" class="acc" stroke-width="1.5"/>
<rect x="592.3" y="346" width="137.7" height="28" class="c2f"/><rect x="592.3" y="346" width="137.7" height="28" fill="none" class="c2s" stroke-width="1.5"/>
<text x="180" y="365" font-size="11.5" font-weight="600" class="ink" text-anchor="start">75% mért</text>
<text x="740" y="365" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">a súlyok alapján 75,3%</text>
<text x="24" y="405" font-size="12" font-weight="600" class="ink" text-anchor="start">nice 0 vs. nice 10</text>
<rect x="170" y="386" width="505.9" height="28" class="accf"/><rect x="170" y="386" width="505.9" height="28" fill="none" class="acc" stroke-width="1.5"/>
<rect x="675.9" y="386" width="54.1" height="28" class="c2f"/><rect x="675.9" y="386" width="54.1" height="28" fill="none" class="c2s" stroke-width="1.5"/>
<text x="180" y="405" font-size="11.5" font-weight="600" class="ink" text-anchor="start">90% mért</text>
<text x="740" y="405" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">a súlyok alapján 90,3%</text>
</svg>
