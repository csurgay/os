<path d="M244 294H236V410H244" fill="none" class="edge" stroke-width="1.5"/>
<text x="228" y="350.0" font-size="11.5" font-weight="600" class="ink" text-anchor="end">felhasználói módú</text>
<text x="228" y="366.0" font-size="11" font-weight="400" class="quiet" text-anchor="end">prioritások</text>
<path d="M100 56V276" fill="none" class="edge" stroke-width="1.25"/>
<text x="92" y="155.0" font-size="11.5" font-weight="600" class="ink" text-anchor="end">kernelmódú</text>
<text x="92" y="171.0" font-size="11.5" font-weight="600" class="ink" text-anchor="end">alvási</text>
<text x="92" y="187.0" font-size="11.5" font-weight="600" class="ink" text-anchor="end">prioritások</text>
<path d="M810 404V60" fill="none" class="edge" stroke-width="1.4" marker-end="url(#up)"/>
<text x="802" y="116" font-size="11" font-weight="400" class="quiet" text-anchor="end">magasabb</text>
<text x="802" y="130" font-size="11" font-weight="400" class="quiet" text-anchor="end">prioritás</text>
<text x="572" y="50" font-size="10.5" font-weight="400" class="quiet" text-anchor="start">alvó folyamatok sora</text>
<text x="24" y="438" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">A kernelben elalvó folyamat a várt eseménytől kapja a prioritását, így ébredés után minden felhasználói módú folyamat</text>
<text x="24" y="456" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">előtt fut, és hamar felszabadítja a nála lévő puffereket és inode-okat. PZERO fölött szignál nem ébresztheti fel (Linux: D állapot);</text>
<text x="24" y="474" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">PZERO és PUSER között igen (Linux: S állapot). A létrán lejjebb numerikusan nagyobb prioritásérték tartozik.</text>
</svg>
