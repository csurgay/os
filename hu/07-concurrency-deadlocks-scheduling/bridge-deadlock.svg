<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 302" width="800" height="302" role="img" aria-label="Holtpont egy egysávos hídon és az erőforrásgráfja" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Holtpont egy egysávos hídon és az erőforrásgráfja</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .c2{fill:#d9822b}.c2s{stroke:#d9822b}.c2f{fill:#d9822b;fill-opacity:.14}.tint{fill:#f4f3ee}
  .bad{fill:#c8372d}.bads{stroke:#c8372d}.badf{fill:#c8372d;fill-opacity:.14}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}.acct{fill:#7aa9f5}
    .c2{fill:#eb9a4b}.c2s{stroke:#eb9a4b}.c2f{fill:#eb9a4b;fill-opacity:.2}.tint{fill:#22221f}
    .bad{fill:#ff7b70}.bads{stroke:#ff7b70}.badf{fill:#ff7b70;fill-opacity:.2}
  }
</style>
<defs><marker id="br" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="edgef"/></marker><marker id="brb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="bad"/></marker></defs>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">Holtpont egy egysávos hídon és az erőforrásgráfja</text>
<rect x="60" y="100" width="160" height="40" rx="2" class="accf"/><rect x="60" y="100" width="160" height="40" rx="2" fill="none" class="acc" stroke-width="2"/>
<rect x="220" y="100" width="160" height="40" rx="2" class="accf"/><rect x="220" y="100" width="160" height="40" rx="2" fill="none" class="acc" stroke-width="2"/>
<text x="140" y="125" font-size="12" font-weight="600" class="ink" text-anchor="middle">nyugati fél</text>
<text x="300" y="125" font-size="12" font-weight="600" class="ink" text-anchor="middle">keleti fél</text>
<path d="M20 140H60M380 140H420" class="edge" stroke-width="3"/>
<rect x="110" y="70" width="60" height="24" rx="10" class="c2f"/><rect x="110" y="70" width="60" height="24" rx="10" fill="none" class="c2s" stroke-width="1.5"/>
<text x="140" y="87" font-size="11" font-weight="600" class="ink" text-anchor="middle">A autó →</text>
<rect x="270" y="146" width="60" height="24" rx="10" class="c2f"/><rect x="270" y="146" width="60" height="24" rx="10" fill="none" class="c2s" stroke-width="1.5"/>
<text x="300" y="163" font-size="11" font-weight="600" class="ink" text-anchor="middle">← B autó</text>
<text x="220" y="206" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">A a nyugati felet birtokolja, és a keletire van szüksége;</text>
<text x="220" y="224" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">B a keleti felet birtokolja, és a nyugatira van szüksége.</text>
<text x="500" y="64" font-size="13" font-weight="600" class="ink" text-anchor="start">Erőforrás-foglalási gráf</text>
<ellipse cx="530" cy="110" rx="26" ry="20" class="c2f"/><ellipse cx="530" cy="110" rx="26" ry="20" fill="none" class="c2s" stroke-width="1.75"/>
<text x="530" y="114" font-size="11" font-weight="600" class="ink" text-anchor="middle">A autó</text>
<ellipse cx="730" cy="190" rx="26" ry="20" class="c2f"/><ellipse cx="730" cy="190" rx="26" ry="20" fill="none" class="c2s" stroke-width="1.75"/>
<text x="730" y="194" font-size="11" font-weight="600" class="ink" text-anchor="middle">B autó</text>
<rect x="700" y="92" width="60" height="36" rx="4" class="accf"/><rect x="700" y="92" width="60" height="36" rx="4" fill="none" class="acc" stroke-width="2"/>
<text x="730" y="114" font-size="11" font-weight="600" class="ink" text-anchor="middle">nyugat</text>
<rect x="500" y="172" width="60" height="36" rx="4" class="accf"/><rect x="500" y="172" width="60" height="36" rx="4" fill="none" class="acc" stroke-width="2"/>
<text x="530" y="194" font-size="11" font-weight="600" class="ink" text-anchor="middle">kelet</text>
<path d="M700 110H558" fill="none" class="edge" stroke-width="1.5" marker-end="url(#br)"/>
<text x="630" y="102" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">birtokolja</text>
<path d="M530 132V170" fill="none" class="bads" stroke-width="1.5" marker-end="url(#brb)"/>
<text x="538" y="155" font-size="10.5" font-weight="400" class="quiet" text-anchor="start">akarja</text>
<path d="M560 190H702" fill="none" class="edge" stroke-width="1.5" marker-end="url(#br)"/>
<text x="630" y="182" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">birtokolja</text>
<path d="M730 168V130" fill="none" class="bads" stroke-width="1.5" marker-end="url(#brb)"/>
<text x="722" y="155" font-size="10.5" font-weight="400" class="quiet" text-anchor="end">akarja</text>
<text x="500" y="240" font-size="11.5" font-weight="400" class="bad" text-anchor="start">Kör: A → kelet → B → nyugat → A</text>
<text x="24" y="268" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Javítás: globális sorrendben foglalni a feleket (előbb a nyugatit: nem alakulhat ki kör), vagy az egész hidat</text>
<text x="24" y="286" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">egy szemaforral (közlekedési lámpával) védett erőforrásnak tekinteni: így egy autó sem vár úgy, hogy közben egy felet birtokol.</text>
</svg>
