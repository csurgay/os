<text x="710" y="278" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">kör = holtpont.</text>
<text x="710" y="302" font-size="11.5" font-weight="600" class="ink" text-anchor="start">Több példány:</text>
<text x="710" y="318" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">a kör szükséges,</text>
<text x="710" y="334" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">de nem elégséges.</text>
<text x="420" y="344" font-size="11.5" font-weight="600" class="bad" text-anchor="start">1 → ÉK → 2 → ÉNy → 3 → DNy → 4 → DK → 1</text>
