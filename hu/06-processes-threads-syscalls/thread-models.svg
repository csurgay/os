<text x="24" y="368" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">N:1: a váltás olcsó, de egy blokkoló rendszerhívás minden szálat megállít, és csak egy CPU-t használ.</text>
<text x="24" y="386" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">1:1: valódi párhuzamosság és független blokkolás; minden szál egy kerneltaskba és kernelbeli váltásba kerül.</text>
<text x="24" y="404" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">M:N: sok olcsó szál néhány kernelszálon; a futtatókörnyezetnek ki kell kerülnie a blokkoló hívásokat.</text>
<text x="24" y="424" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Narancs körök: a program által létrehozott szálak; kék: a kernel által ütemezett szálak.</text>
