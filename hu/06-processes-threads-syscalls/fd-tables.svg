<text x="24" y="344" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">A pipe() mindkét véget a shellnek adja; fork után az 1. gyerek dup2(író vég, 1), a 2. gyerek dup2(olvasó vég, 0) hívást végez;</text>
<text x="24" y="362" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">a 2. gyerek megnyitja a hosts.txt-t is, és dup2(fd, 1). Minden fölösleges leírót bezárnak, majd mindkét gyerek execve()-t hív:</text>
<text x="24" y="380" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">az ls és a grep egyszerűen a 0-s, 1-es és 2-es leírót használja, és sosem tud a pipe-ról vagy a fájlról.</text>
</svg>
