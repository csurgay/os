<text x="400.0" y="164.39" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">csak olvasás</text>
<rect x="300" y="204" width="200" height="34" rx="4" fill="none" class="edge" stroke-width="1.25"/>
