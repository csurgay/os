<text x="616" y="346" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">kód és adat</text>
<text x="616" y="362" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">együtt</text>
<text x="200" y="460" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Kiemelve: a lehívási fázis regiszterei (PC, MAR, MBR, CIR)</text>
