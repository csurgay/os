<text x="342" y="264" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">sorrendvezérlés</text>
<rect x="40" y="308" width="117" height="72" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="52" y="332" font-size="13" font-weight="600" class="ink" text-anchor="start">SR</text>
<text x="52" y="352" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">állapotbitek:</text>
<text x="52" y="368" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">S, Z, O (és mások)</text>
