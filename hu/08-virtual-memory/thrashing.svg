<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 376" width="800" height="376" role="img" aria-label="Laphiba-arány a keretek számának függvényében (szimuláció, pagesim.py thrash)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Laphiba-arány a keretek számának függvényében (szimuláció, pagesim.py thrash)</title>
<style>
