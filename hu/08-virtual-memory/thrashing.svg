<text x="24" y="360" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Ha kevesebb kerete van, mint a munkahalmaza, a folyamat hivatkozásainak nagy része laphibát okoz, és a lemezre várakozik.</text>
