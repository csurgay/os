<text x="24" y="362" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Minden tábla pontosan egy 4 KiB-os lapot tölt ki (512 darab 8 bájtos bejegyzés). Táblák csak a címtartomány használt részeihez</text>
<text x="24" y="380" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">léteznek, így egy kis folyamatnak egy óriási lapos tábla helyett néhány lapnyi tábla elég. Az ár: fordításonként akár négy</text>
<text x="24" y="398" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">további memóriaolvasás, ezért fontos a TLB. Az újabb CPU-k ötödik szintet is kínálnak (57 bites címek).</text>
