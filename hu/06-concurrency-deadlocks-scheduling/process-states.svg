<text x="790" y="305" font-size="13" font-weight="600" class="ink" text-anchor="middle">zombi</text>
<ellipse cx="150" cy="478" rx="74" ry="30" class="c2f"/><ellipse cx="150" cy="478" rx="74" ry="30" fill="none" class="c2s" stroke-width="1.75"/>
<text x="150" y="474" font-size="12" font-weight="600" class="ink" text-anchor="middle">felfüggesztett</text>
<text x="150" y="490" font-size="12" font-weight="600" class="ink" text-anchor="middle">futásra kész</text>
<ellipse cx="420" cy="478" rx="74" ry="30" class="c2f"/><ellipse cx="420" cy="478" rx="74" ry="30" fill="none" class="c2s" stroke-width="1.75"/>
<text x="420" y="474" font-size="12" font-weight="600" class="ink" text-anchor="middle">felfüggesztett</text>
<text x="420" y="490" font-size="12" font-weight="600" class="ink" text-anchor="middle">várakozó</text>
<path d="M626 96C460 96 330 130 306 206" fill="none" class="edge" stroke-width="1.4" marker-end="url(#st)"/>
<text x="440" y="92" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">befogadás: fork() + exec()</text>
<path d="M650 256C700 270 720 280 732 290" fill="none" class="edge" stroke-width="1.4" marker-end="url(#st)"/>
<text x="668" y="236" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">exit()</text>
<text x="668" y="251" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">vagy leállítják</text>
<path d="M790 274V126" fill="none" class="edge" stroke-width="1.4" marker-end="url(#st)"/>
<text x="800" y="196" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">a szülő</text>
<text x="800" y="211" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">wait()-je</text>
<text x="800" y="226" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">begyűjti</text>
<path d="M372 232H516" fill="none" class="edge" stroke-width="1.4" marker-end="url(#st)"/>
<text x="444" y="224" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">kiosztás</text>
<path d="M532 262C500 282 400 282 352 264" fill="none" class="edge" stroke-width="1.4" marker-end="url(#st)"/>
<text x="444" y="296" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">lejárt időszelet / yield</text>
