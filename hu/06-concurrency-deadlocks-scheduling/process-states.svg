<text x="624" y="312" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">várakozás:</text>
<text x="624" y="327" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">I/O, zár,</text>
<text x="624" y="342" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">szemafor</text>
<path d="M376 342C320 340 290 310 294 272" fill="none" class="edge" stroke-width="1.4" marker-end="url(#st)"/>
<text x="318" y="316" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">esemény</text>
<path d="M250 260C210 320 170 390 152 446" fill="none" class="edge" stroke-width="1.4" marker-end="url(#st)"/>
<text x="176" y="370" font-size="11.5" font-weight="400" class="quiet" text-anchor="end">kivitel</text>
<path d="M180 450C210 380 250 320 272 268" fill="none" class="edge" stroke-width="1.4" marker-end="url(#st)" stroke-dasharray="4 4"/>
<text x="222" y="400" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">behozás</text>
<path d="M440 368C436 400 430 420 425 446" fill="none" class="edge" stroke-width="1.4" marker-end="url(#st)"/>
<text x="446" y="412" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">kivitel</text>
<path d="M346 478H226" fill="none" class="edge" stroke-width="1.4" marker-end="url(#st)"/>
<text x="286" y="470" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">esemény</text>
<text x="24" y="566" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Stallingsnál: Ready/Suspend és Blocked/Suspend. Linuxban a futásra kész és a futó egyaránt „R”, a várakozó S vagy D,</text>
<text x="24" y="584" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">a felfüggesztett állapotok szerepét pedig a leállított folyamatok (T) és a lapozóterületre kivitt memória tölti be.</text>
