<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 552" width="880" height="552" role="img" aria-label="Így dönt a Linux egy olvasási, írási vagy végrehajtási kérésről: az első egyezés dönt">
<title>Így dönt a Linux egy olvasási, írási vagy végrehajtási kérésről: az első egyezés dönt</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .c2{fill:#d9822b}.c2s{stroke:#d9822b}.c2f{fill:#d9822b;fill-opacity:.14}.tint{fill:#f4f3ee}
  .bad{fill:#c8372d}.bads{stroke:#c8372d}.badf{fill:#c8372d;fill-opacity:.14}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}.acct{fill:#7aa9f5}
    .c2{fill:#eb9a4b}.c2s{stroke:#eb9a4b}.c2f{fill:#eb9a4b;fill-opacity:.2}.tint{fill:#22221f}
    .bad{fill:#ff7b70}.bads{stroke:#ff7b70}.badf{fill:#ff7b70;fill-opacity:.2}
  }
</style>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">Így dönt a Linux egy olvasási, írási vagy végrehajtási kérésről: az első egyezés dönt</text>
<marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="edgef"/></marker>
<rect x="40" y="56" width="340" height="56" rx="8" class="tint"/><rect x="40" y="56" width="340" height="56" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="56" y="79" font-size="12.5" font-weight="600" class="ink" text-anchor="start">1.  Van-e a folyamatnak CAP_DAC_OVERRIDE-ja?</text>
<text x="76" y="98" font-size="11" font-weight="400" class="quiet" text-anchor="start">(a rootnak van)</text>
<rect x="456" y="56" width="384" height="56" rx="8" class="accf"/><rect x="456" y="56" width="384" height="56" rx="8" fill="none" class="acc" stroke-width="2"/>
<text x="470" y="79" font-size="12.5" font-weight="600" class="ink" text-anchor="start">engedélyezve, a bitek megnézése nélkül</text>
<text x="470" y="98" font-size="11" font-weight="400" class="ink" text-anchor="start">(végrehajtás: csak ha van beállított x bit)</text>
<path d="M380 84H454" fill="none" class="edge" stroke-width="1.5" marker-end="url(#a2)"/>
<text x="417" y="78" font-size="11" font-weight="600" class="acct" text-anchor="middle">igen</text>
<path d="M210 112V130" fill="none" class="edge" stroke-width="1.25" marker-end="url(#a2)"/>
<text x="220" y="125" font-size="11" font-weight="600" class="quiet" text-anchor="start">nem</text>
<rect x="40" y="132" width="340" height="56" rx="8" class="tint"/><rect x="40" y="132" width="340" height="56" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="56" y="155" font-size="12.5" font-weight="600" class="ink" text-anchor="start">2.  Effektív UID = a fájl tulajdonosa?</text>
<rect x="456" y="132" width="384" height="56" rx="8" class="c2f"/><rect x="456" y="132" width="384" height="56" rx="8" fill="none" class="c2s" stroke-width="1.5"/>
<text x="470" y="155" font-size="12.5" font-weight="600" class="ink" text-anchor="start">a tulajdonos bitjei (user::) döntenek, vége</text>
<text x="470" y="174" font-size="11" font-weight="400" class="ink" text-anchor="start">akkor is, ha a csoport vagy mások többet kapnának</text>
<path d="M380 160H454" fill="none" class="edge" stroke-width="1.5" marker-end="url(#a2)"/>
<text x="417" y="154" font-size="11" font-weight="600" class="acct" text-anchor="middle">igen</text>
<path d="M210 188V206" fill="none" class="edge" stroke-width="1.25" marker-end="url(#a2)"/>
<text x="220" y="201" font-size="11" font-weight="600" class="quiet" text-anchor="start">nem</text>
<rect x="40" y="208" width="340" height="56" rx="8" class="tint"/><rect x="40" y="208" width="340" height="56" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="56" y="231" font-size="12.5" font-weight="600" class="ink" text-anchor="start">3.  Van-e névvel megadott user-bejegyzés?</text>
<text x="76" y="250" font-size="11" font-weight="400" class="quiet" text-anchor="start">(csak ACL esetén: user:cons3:…)</text>
<rect x="456" y="208" width="384" height="56" rx="8" class="c2f"/><rect x="456" y="208" width="384" height="56" rx="8" fill="none" class="c2s" stroke-width="1.5"/>
<text x="470" y="231" font-size="12.5" font-weight="600" class="ink" text-anchor="start">az a bejegyzés ÉS a maszk dönt, vége</text>
<path d="M380 236H454" fill="none" class="edge" stroke-width="1.5" marker-end="url(#a2)"/>
<text x="417" y="230" font-size="11" font-weight="600" class="acct" text-anchor="middle">igen</text>
<path d="M210 264V282" fill="none" class="edge" stroke-width="1.25" marker-end="url(#a2)"/>
<text x="220" y="277" font-size="11" font-weight="600" class="quiet" text-anchor="start">nem</text>
<rect x="40" y="284" width="340" height="56" rx="8" class="tint"/><rect x="40" y="284" width="340" height="56" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="56" y="307" font-size="12.5" font-weight="600" class="ink" text-anchor="start">4.  A folyamat a tulajdonos csoportban van,</text>
<text x="76" y="326" font-size="11" font-weight="400" class="quiet" text-anchor="start">vagy az ACL egy névvel megadott csoportjában?</text>
<rect x="456" y="284" width="384" height="56" rx="8" class="c2f"/><rect x="456" y="284" width="384" height="56" rx="8" fill="none" class="c2s" stroke-width="1.5"/>
<text x="470" y="307" font-size="12.5" font-weight="600" class="ink" text-anchor="start">engedélyezve, ha egy illeszkedő csoportbejegyzés</text>
<text x="470" y="326" font-size="11" font-weight="400" class="ink" text-anchor="start">megadja (ÉS a maszk), különben elutasítva</text>
<path d="M380 312H454" fill="none" class="edge" stroke-width="1.5" marker-end="url(#a2)"/>
<text x="417" y="306" font-size="11" font-weight="600" class="acct" text-anchor="middle">igen</text>
<path d="M210 340V358" fill="none" class="edge" stroke-width="1.25" marker-end="url(#a2)"/>
<text x="220" y="353" font-size="11" font-weight="600" class="quiet" text-anchor="start">nem</text>
<rect x="40" y="360" width="340" height="56" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="56" y="383" font-size="12.5" font-weight="600" class="ink" text-anchor="start">5.  Különben: mindenki más</text>
<rect x="456" y="360" width="384" height="56" rx="8" class="c2f"/><rect x="456" y="360" width="384" height="56" rx="8" fill="none" class="c2s" stroke-width="1.5"/>
<text x="470" y="383" font-size="12.5" font-weight="600" class="ink" text-anchor="start">a mindenki más bitjei (other::) döntenek</text>
<path d="M380 388H454" fill="none" class="edge" stroke-width="1.5" marker-end="url(#a2)"/>
<rect x="40" y="442" width="800" height="74" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="56" y="464" font-size="12.5" font-weight="600" class="ink" text-anchor="start">Példa: -------rwx  john  john  note.txt</text>
<text x="56" y="484" font-size="11.5" font-weight="400" class="ink" text-anchor="start">john a tulajdonos: a 2. lépés illeszkedik, a tulajdonos bitjei ---, így john nem fér hozzá.</text>
<text x="56" y="502" font-size="11.5" font-weight="400" class="ink" text-anchor="start">user1 az 5. lépésig semmivel sem illeszkedik: a mindenki más bitjei rwx, így olvashat. A jogok nem adódnak össze.</text>
<text x="40" y="538" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">ACL nélkül nincs 3. lépés, nincsenek névvel megadott csoportok, és maszk sincs; a bitek önmagukban döntenek.</text>
</svg>
