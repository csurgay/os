<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 402" width="760" height="402" role="img" aria-label="Az operációs rendszer a hardver és a programok között helyezkedik el" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Az operációs rendszer a hardver és a programok között helyezkedik el</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .c2{fill:#d9822b}.c2s{stroke:#d9822b}.c2f{fill:#d9822b;fill-opacity:.14}.tint{fill:#f4f3ee}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}.acct{fill:#7aa9f5}
    .c2{fill:#eb9a4b}.c2s{stroke:#eb9a4b}.c2f{fill:#eb9a4b;fill-opacity:.2}.tint{fill:#22221f}
  }
</style>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">Az operációs rendszer a hardver és a programok között helyezkedik el</text>
<rect x="150" y="72" width="340" height="42" rx="6" class="tint"/><rect x="150" y="72" width="340" height="42" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="166" y="91" font-size="13" font-weight="600" class="ink" text-anchor="start">Alkalmazói programok</text>
<text x="166" y="107" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">webböngésző, játék, banki rendszer</text>
<rect x="150" y="120" width="340" height="42" rx="6" class="c2f"/><rect x="150" y="120" width="340" height="42" rx="6" fill="none" class="c2s" stroke-width="1.5"/>
<text x="166" y="139" font-size="13" font-weight="600" class="ink" text-anchor="start">Rendszerprogramok</text>
<text x="166" y="155" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">shell, fordítóprogramok, szerkesztők, segédprogramok</text>
<rect x="150" y="168" width="340" height="42" rx="6" class="accf"/><rect x="150" y="168" width="340" height="42" rx="6" fill="none" class="acc" stroke-width="2"/>
<text x="166" y="187" font-size="13" font-weight="600" class="ink" text-anchor="start">Kernel</text>
<text x="166" y="203" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">folyamat-, memória-, eszköz- és fájlkezelés</text>
<rect x="150" y="216" width="340" height="42" rx="6" class="tint"/><rect x="150" y="216" width="340" height="42" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="166" y="235" font-size="13" font-weight="600" class="ink" text-anchor="start">Gépi nyelv</text>
<text x="166" y="251" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">a CPU utasításkészlete (ISA)</text>
<rect x="150" y="264" width="340" height="42" rx="6" class="tint"/><rect x="150" y="264" width="340" height="42" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="166" y="283" font-size="13" font-weight="600" class="ink" text-anchor="start">Mikroarchitektúra</text>
<text x="166" y="299" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">hogyan hajtja végre a CPU az utasításokat</text>
<rect x="150" y="312" width="340" height="42" rx="6" class="tint"/><rect x="150" y="312" width="340" height="42" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="166" y="331" font-size="13" font-weight="600" class="ink" text-anchor="start">Fizikai eszközök</text>
<text x="166" y="347" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">chipek, vezetékek, lemezek</text>
<path d="M506 168h10V210h-10" fill="none" class="acc" stroke-width="2"/>
<text x="524" y="186" font-size="11.5" font-weight="600" class="acct" text-anchor="start">az OS szűk</text>
<text x="524" y="202" font-size="11.5" font-weight="600" class="acct" text-anchor="start">értelemben</text>
<path d="M626 120h10V210h-10" fill="none" class="c2s" stroke-width="2"/>
<text x="644" y="162" font-size="11.5" font-weight="600" class="ink" text-anchor="start">az OS tág</text>
<text x="644" y="178" font-size="11.5" font-weight="600" class="ink" text-anchor="start">értelemben</text>
<line x1="142" y1="165" x2="498" y2="165" class="acc" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="138" y="148" font-size="11.5" font-weight="400" class="quiet" text-anchor="end">felhasználói mód</text>
<text x="138" y="169" font-size="11.5" font-weight="600" class="acct" text-anchor="end">rendszerhívások</text>
<text x="138" y="190" font-size="11.5" font-weight="400" class="quiet" text-anchor="end">kernelmód</text>
<text x="138" y="238" font-size="11.5" font-weight="400" class="quiet" text-anchor="end">hardver</text>
<text x="24" y="382" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Tanenbaum (2001) nyomán. Hogy hol ér véget az OS, definíció kérdése: a firmware és a mikrokód határeset.</text>
</svg>
