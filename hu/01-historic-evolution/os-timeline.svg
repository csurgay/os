<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-label="Minden korszak új OS-ötletet hozott; az ötletek túlélték a gépeket" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Minden korszak új OS-ötletet hozott; az ötletek túlélték a gépeket</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .c2{fill:#d9822b}.c2s{stroke:#d9822b}.c2f{fill:#d9822b;fill-opacity:.14}.tint{fill:#f4f3ee}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}.acct{fill:#7aa9f5}
    .c2{fill:#eb9a4b}.c2s{stroke:#eb9a4b}.c2f{fill:#eb9a4b;fill-opacity:.2}.tint{fill:#22221f}
  }
</style>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">Minden korszak új OS-ötletet hozott; az ötletek túlélték a gépeket</text>
<text x="24" y="50" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Az egyes megközelítések hozzávetőleges kezdete (ahol az ötlet ma is él, a sáv napjainkig tart)</text>
<line x1="200.0" y1="80" x2="200.0" y2="420" class="grid"/>
<text x="200.0" y="438" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">1940</text>
<line x1="261.6" y1="80" x2="261.6" y2="420" class="grid"/>
<text x="261.6470588235294" y="438" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">1950</text>
<line x1="323.3" y1="80" x2="323.3" y2="420" class="grid"/>
<text x="323.29411764705884" y="438" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">1960</text>
<line x1="384.9" y1="80" x2="384.9" y2="420" class="grid"/>
<text x="384.94117647058823" y="438" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">1970</text>
<line x1="446.6" y1="80" x2="446.6" y2="420" class="grid"/>
<text x="446.5882352941177" y="438" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">1980</text>
<line x1="508.2" y1="80" x2="508.2" y2="420" class="grid"/>
<text x="508.2352941176471" y="438" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">1990</text>
<line x1="569.9" y1="80" x2="569.9" y2="420" class="grid"/>
<text x="569.8823529411765" y="438" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">2000</text>
<line x1="631.5" y1="80" x2="631.5" y2="420" class="grid"/>
<text x="631.5294117647059" y="438" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">2010</text>
<line x1="693.2" y1="80" x2="693.2" y2="420" class="grid"/>
<text x="693.1764705882354" y="438" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">2020</text>
<text x="24" y="101" font-size="12.5" font-weight="600" class="ink" text-anchor="start">Közvetlen gépkezelés</text>
<rect x="230.8235294117647" y="87" width="67.81176470588235" height="18" rx="4" class="tint"/><rect x="230.8235294117647" y="87" width="67.81176470588235" height="18" rx="4" fill="none" class="edge" stroke-width="1.25"/>
<text x="306.63529411764705" y="100" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">kapcsolók, lámpák, kapcsolótáblák</text>
<text x="24" y="141" font-size="12.5" font-weight="600" class="ink" text-anchor="start">Kötegelt feldolgozás</text>
<rect x="298.63529411764705" y="127" width="425.36470588235295" height="18" rx="4" class="accf"/><rect x="298.63529411764705" y="127" width="425.36470588235295" height="18" rx="4" fill="none" class="acc" stroke-width="2"/>
<text x="306.63529411764705" y="140" font-size="11.5" font-weight="400" class="ink" text-anchor="start">GM-NAA I/O (1956)</text>
<text x="24" y="181" font-size="12.5" font-weight="600" class="ink" text-anchor="start">Multiprogramozás</text>
<rect x="335.6235294117647" y="167" width="388.3764705882353" height="18" rx="4" class="accf"/><rect x="335.6235294117647" y="167" width="388.3764705882353" height="18" rx="4" fill="none" class="acc" stroke-width="2"/>
<text x="343.6235294117647" y="180" font-size="11.5" font-weight="400" class="ink" text-anchor="start">Atlas Supervisor (1962)</text>
<text x="24" y="221" font-size="12.5" font-weight="600" class="ink" text-anchor="start">Időosztás</text>
<rect x="329.4588235294118" y="207" width="394.5411764705882" height="18" rx="4" class="accf"/><rect x="329.4588235294118" y="207" width="394.5411764705882" height="18" rx="4" fill="none" class="acc" stroke-width="2"/>
<text x="337.4588235294118" y="220" font-size="11.5" font-weight="400" class="ink" text-anchor="start">CTSS (1961), Multics, Unix (1969)</text>
<text x="24" y="261" font-size="12.5" font-weight="600" class="ink" text-anchor="start">Miniszámítógépek</text>
<rect x="354.11764705882354" y="247" width="154.11764705882354" height="18" rx="4" class="tint"/><rect x="354.11764705882354" y="247" width="154.11764705882354" height="18" rx="4" fill="none" class="edge" stroke-width="1.25"/>
<text x="516.2352941176471" y="260" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">PDP-8, PDP-11, VAX</text>
<text x="24" y="301" font-size="12.5" font-weight="600" class="ink" text-anchor="start">Személyi számítógépek</text>
<rect x="409.6" y="287" width="314.4" height="18" rx="4" class="tint"/><rect x="409.6" y="287" width="314.4" height="18" rx="4" fill="none" class="edge" stroke-width="1.25"/>
<text x="417.6" y="300" font-size="11.5" font-weight="400" class="ink" text-anchor="start">CP/M (1974), IBM PC + DOS (1981), Mac (1984)</text>
<text x="24" y="341" font-size="12.5" font-weight="600" class="ink" text-anchor="start">Hálózatba kötött rendszerek</text>
<rect x="465.08235294117645" y="327" width="258.91764705882355" height="18" rx="4" class="tint"/><rect x="465.08235294117645" y="327" width="258.91764705882355" height="18" rx="4" fill="none" class="edge" stroke-width="1.25"/>
<text x="473.08235294117645" y="340" font-size="11.5" font-weight="400" class="ink" text-anchor="start">az ARPANET áttér a TCP/IP-re (1983)</text>
<text x="24" y="381" font-size="12.5" font-weight="600" class="ink" text-anchor="start">Akkus, hordozható eszközök</text>
<rect x="520.5647058823529" y="367" width="203.43529411764712" height="18" rx="4" class="tint"/><rect x="520.5647058823529" y="367" width="203.43529411764712" height="18" rx="4" fill="none" class="edge" stroke-width="1.25"/>
<text x="528.5647058823529" y="380" font-size="11.5" font-weight="400" class="ink" text-anchor="start">laptopok, majd telefonok</text>
<text x="24" y="464" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">1945 előtt: abakusz (memória + gyors összeadás), Hollerith lyukkártyás tabulátora (1890-es népszámlálás), háborús gépek.</text>
<text x="24" y="482" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Kiemelve: az a három ötlet, amely szükségessé tette az operációs rendszert.</text>
</svg>
