<text x="24" y="404" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Folytonos nyíl: a lap a RAM-ban van. Szaggatott: a lap most lemezen van; elérése laphibát okoz, az OS visszatölti.</text>
<text x="24" y="422" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Egyik program sem érhet el olyan keretet, amelyet az OS nem rendelt hozzá: ez a memóriavédelem.</text>
