<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 296" width="780" height="296" role="img" aria-label="Egy művelet, több út: a kezdőtől a szakértőig" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Egy művelet, több út: a kezdőtől a szakértőig</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .c2{fill:#d9822b}.c2s{stroke:#d9822b}.c2f{fill:#d9822b;fill-opacity:.14}.tint{fill:#f4f3ee}
  .bad{fill:#c8372d}.bads{stroke:#c8372d}.badf{fill:#c8372d;fill-opacity:.14}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}.acct{fill:#7aa9f5}
    .c2{fill:#eb9a4b}.c2s{stroke:#eb9a4b}.c2f{fill:#eb9a4b;fill-opacity:.2}.tint{fill:#22221f}
    .bad{fill:#ff7b70}.bads{stroke:#ff7b70}.badf{fill:#ff7b70;fill-opacity:.2}
  }
</style>
<defs><marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="edgef"/></marker></defs>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">Egy művelet, több út: a kezdőtől a szakértőig</text>
<rect x="24" y="52" width="250" height="40" rx="6" class="tint"/><rect x="24" y="52" width="250" height="40" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="36" y="77" font-size="12.5" font-weight="600" class="ink" text-anchor="start">Menü: Szerkesztés → Másolás</text>
<text x="292" y="70" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">látható, semmit sem kell megjegyezni</text>
<text x="292" y="86" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">leglassabb: 2 célpontra kell mutatni</text>
<rect x="24" y="104" width="250" height="40" rx="6" class="tint"/><rect x="24" y="104" width="250" height="40" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="36" y="129" font-size="12.5" font-weight="600" class="ink" text-anchor="start">Helyi menü (jobb kattintás)</text>
<text x="292" y="122" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">az objektum mellett látható</text>
<text x="292" y="138" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">közepes</text>
<rect x="24" y="156" width="250" height="40" rx="6" class="tint"/><rect x="24" y="156" width="250" height="40" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="36" y="181" font-size="12.5" font-weight="600" class="ink" text-anchor="start">Húzás egérrel (Ctrl+húzás)</text>
<text x="292" y="174" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">közvetlen manipuláció</text>
<text x="292" y="190" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">gyors közeli célpontoknál</text>
<rect x="24" y="208" width="250" height="40" rx="6" class="accf"/><rect x="24" y="208" width="250" height="40" rx="6" fill="none" class="acc" stroke-width="2"/>
<text x="36" y="233" font-size="12.5" font-weight="600" class="ink" text-anchor="start">Billentyűparancs: Ctrl+C</text>
<text x="292" y="226" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">fel kell idézni</text>
<text x="292" y="242" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">leggyorsabb, a kéz a billentyűkön marad</text>
<path d="M560 60V250" fill="none" class="edge" stroke-width="1.5" marker-end="url(#pa)"/>
<text x="574" y="70" font-size="12" font-weight="600" class="ink" text-anchor="start">kezdő</text>
<text x="574" y="88" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">felismerés,</text>
<text x="574" y="104" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">a menü kiírja a gyorsbillentyűt</text>
<text x="574" y="232" font-size="12" font-weight="600" class="ink" text-anchor="start">szakértő</text>
<text x="574" y="250" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">felidézés, gyorsaság</text>
<text x="24" y="278" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">A menü a parancs mellé írja a billentyűparancsot, és ezzel meg is tanítja: a szakértővé válás útja be van építve.</text>
</svg>
