<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 364" width="780" height="364" role="img" aria-label="Az affective computing mint hurok: érzékelés, előrejelzés, módosítás" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Az affective computing mint hurok: érzékelés, előrejelzés, módosítás</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .c2{fill:#d9822b}.c2s{stroke:#d9822b}.c2f{fill:#d9822b;fill-opacity:.14}.tint{fill:#f4f3ee}
  .bad{fill:#c8372d}.bads{stroke:#c8372d}.badf{fill:#c8372d;fill-opacity:.14}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}.acct{fill:#7aa9f5}
    .c2{fill:#eb9a4b}.c2s{stroke:#eb9a4b}.c2f{fill:#eb9a4b;fill-opacity:.2}.tint{fill:#22221f}
    .bad{fill:#ff7b70}.bads{stroke:#ff7b70}.badf{fill:#ff7b70;fill-opacity:.2}
  }
</style>
<defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="edgef"/></marker></defs>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">Az affective computing mint hurok: érzékelés, előrejelzés, módosítás</text>
<rect x="280" y="56" width="220" height="56" rx="8" class="c2f"/><rect x="280" y="56" width="220" height="56" rx="8" fill="none" class="c2s" stroke-width="1.5"/>
<text x="390" y="80" font-size="12.5" font-weight="600" class="ink" text-anchor="middle">felhasználó érzelmi állapota</text>
<text x="390" y="98" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">hat a figyelemre, észlelésre, döntésre</text>
<rect x="520" y="150" width="220" height="56" rx="8" class="accf"/><rect x="520" y="150" width="220" height="56" rx="8" fill="none" class="acc" stroke-width="2"/>
<text x="630" y="174" font-size="12.5" font-weight="600" class="ink" text-anchor="middle">érzékelés</text>
<text x="630" y="192" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">kattintás, időzés, gépelés, arc, hang</text>
<rect x="280" y="244" width="220" height="56" rx="8" class="accf"/><rect x="280" y="244" width="220" height="56" rx="8" fill="none" class="acc" stroke-width="2"/>
<text x="390" y="268" font-size="12.5" font-weight="600" class="ink" text-anchor="middle">előrejelzés</text>
<text x="390" y="286" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">modell: mi köti le ezt a felhasználót?</text>
<rect x="40" y="150" width="220" height="56" rx="8" class="accf"/><rect x="40" y="150" width="220" height="56" rx="8" fill="none" class="acc" stroke-width="2"/>
<text x="150" y="174" font-size="12.5" font-weight="600" class="ink" text-anchor="middle">módosítás (mit mutasson)</text>
<text x="150" y="192" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">hírfolyam, értesítés, a válasz hangneme</text>
<path d="M500 84C560 90 600 110 620 146" fill="none" class="edge" stroke-width="1.25" marker-end="url(#af)"/>
<path d="M620 206C610 240 560 262 504 268" fill="none" class="edge" stroke-width="1.25" marker-end="url(#af)"/>
<path d="M278 270C200 266 160 240 150 210" fill="none" class="edge" stroke-width="1.25" marker-end="url(#af)"/>
<path d="M150 148C160 110 210 90 276 84" fill="none" class="edge" stroke-width="1.25" marker-end="url(#af)"/>
<text x="24" y="330" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Ugyanaz a hurok szolgálhatja a felhasználót (az oktatóprogram lelassít, ha a diák frusztrált), vagy kihasználhatja</text>
<text x="24" y="348" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">(a hírfolyam megtanulja, hogy az irigység vagy a FOMO görgetésre készteti). A célfüggvény dönt.</text>
</svg>
