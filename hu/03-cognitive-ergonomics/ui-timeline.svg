<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="920" height="360" role="img" aria-label="Hogyan beszéltek az emberek az operációs rendszerekkel" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Hogyan beszéltek az emberek az operációs rendszerekkel</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .c2{fill:#d9822b}.c2s{stroke:#d9822b}.c2f{fill:#d9822b;fill-opacity:.14}.tint{fill:#f4f3ee}
  .bad{fill:#c8372d}.bads{stroke:#c8372d}.badf{fill:#c8372d;fill-opacity:.14}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}.acct{fill:#7aa9f5}
    .c2{fill:#eb9a4b}.c2s{stroke:#eb9a4b}.c2f{fill:#eb9a4b;fill-opacity:.2}.tint{fill:#22221f}
    .bad{fill:#ff7b70}.bads{stroke:#ff7b70}.badf{fill:#ff7b70;fill-opacity:.2}
  }
</style>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">Hogyan beszéltek az emberek az operációs rendszerekkel</text>
<path d="M40 300H900" fill="none" class="edge" stroke-width="1.5"/>
<line x1="40.0" y1="296" x2="40.0" y2="304" class="edge" stroke-width="1.25"/>
<text x="40.0" y="320" font-size="11" font-weight="400" class="quiet" text-anchor="middle">1960</text>
<line x1="162.9" y1="296" x2="162.9" y2="304" class="edge" stroke-width="1.25"/>
<text x="162.85714285714286" y="320" font-size="11" font-weight="400" class="quiet" text-anchor="middle">1970</text>
<line x1="285.7" y1="296" x2="285.7" y2="304" class="edge" stroke-width="1.25"/>
<text x="285.7142857142857" y="320" font-size="11" font-weight="400" class="quiet" text-anchor="middle">1980</text>
<line x1="408.6" y1="296" x2="408.6" y2="304" class="edge" stroke-width="1.25"/>
<text x="408.57142857142856" y="320" font-size="11" font-weight="400" class="quiet" text-anchor="middle">1990</text>
<line x1="531.4" y1="296" x2="531.4" y2="304" class="edge" stroke-width="1.25"/>
<text x="531.4285714285714" y="320" font-size="11" font-weight="400" class="quiet" text-anchor="middle">2000</text>
<line x1="654.3" y1="296" x2="654.3" y2="304" class="edge" stroke-width="1.25"/>
<text x="654.2857142857143" y="320" font-size="11" font-weight="400" class="quiet" text-anchor="middle">2010</text>
<line x1="777.1" y1="296" x2="777.1" y2="304" class="edge" stroke-width="1.25"/>
<text x="777.1428571428571" y="320" font-size="11" font-weight="400" class="quiet" text-anchor="middle">2020</text>
<line x1="900.0" y1="296" x2="900.0" y2="304" class="edge" stroke-width="1.25"/>
<text x="900.0" y="320" font-size="11" font-weight="400" class="quiet" text-anchor="middle">2030</text>
<rect x="40.0" y="60" width="860.0" height="30" rx="6" class="tint"/><rect x="40.0" y="60" width="860.0" height="30" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="48.0" y="80" font-size="12" font-weight="600" class="ink" text-anchor="start">Parancssor</text>
<text x="892.0" y="80" font-size="11" font-weight="400" class="quiet" text-anchor="end">távgépíró, majd terminál; ma is a rendszergazda eszköze</text>
<rect x="199.71428571428572" y="104" width="700.2857142857142" height="30" rx="6" class="accf"/><rect x="199.71428571428572" y="104" width="700.2857142857142" height="30" rx="6" fill="none" class="acc" stroke-width="2"/>
<text x="207.71428571428572" y="124" font-size="12" font-weight="600" class="ink" text-anchor="start">Asztali GUI</text>
<text x="892.0" y="124" font-size="11" font-weight="400" class="quiet" text-anchor="end">Alto 1973, Star 1981, Mac 1984, Windows 95</text>
<rect x="445.42857142857144" y="148" width="172.0" height="30" rx="6" class="tint"/><rect x="445.42857142857144" y="148" width="172.0" height="30" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="453.42857142857144" y="168" font-size="12" font-weight="600" class="ink" text-anchor="start">Toll és PDA</text>
<text x="437.42857142857144" y="168" font-size="11" font-weight="400" class="quiet" text-anchor="end">Newton 1993, PalmPilot 1996</text>
<rect x="617.4285714285714" y="192" width="282.57142857142856" height="30" rx="6" class="c2f"/><rect x="617.4285714285714" y="192" width="282.57142857142856" height="30" rx="6" fill="none" class="c2s" stroke-width="1.5"/>
<text x="625.4285714285714" y="212" font-size="12" font-weight="600" class="ink" text-anchor="start">Érintőképernyős telefon</text>
<text x="609.4285714285714" y="212" font-size="11" font-weight="400" class="quiet" text-anchor="end">iPhone 2007, Android 2008; lapos dizájn 2013–14</text>
<rect x="666.5714285714286" y="236" width="233.42857142857144" height="30" rx="6" class="tint"/><rect x="666.5714285714286" y="236" width="233.42857142857144" height="30" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="674.5714285714286" y="256" font-size="12" font-weight="600" class="ink" text-anchor="start">Viselhető, hang, térbeli</text>
<text x="658.5714285714286" y="256" font-size="11" font-weight="400" class="quiet" text-anchor="end">Siri 2011, Glass 2013, Watch 2015, Vision Pro 2024</text>
<text x="24" y="344" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Minden új stílus hozzáadódott, nem helyettesített: a telefon Unix-szerű kernelt rejt, és a parancssor ma is ott van.</text>
</svg>
