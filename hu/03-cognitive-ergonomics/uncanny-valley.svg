<text x="291.6" y="149.4" font-size="11" font-weight="400" class="quiet" text-anchor="end">várt: emberibb = rokonszenvesebb</text>
<circle cx="118.0" cy="222.2" r="4.5" class="c2"/>
<text x="130.0" y="244.2" font-size="12" font-weight="600" class="ink" text-anchor="start">ipari robot</text>
<circle cx="437.2" cy="149.4" r="4.5" class="c2"/>
<text x="429.2" y="137.4" font-size="12" font-weight="600" class="ink" text-anchor="end">játék- / kedvencrobot</text>
<circle cx="538.0" cy="340.5" r="4.5" class="c2"/>
<text x="550.0" y="344.5" font-size="12" font-weight="600" class="ink" text-anchor="start">„majdnem emberi”</text>
<circle cx="650.0" cy="100.0" r="4.5" class="c2"/>
<text x="642.0" y="88.0" font-size="12" font-weight="600" class="ink" text-anchor="end">valódi ember</text>
<text x="550.0" y="360.5" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">a hátborzongató völgy</text>
<text x="24" y="384" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Mori intuícióból rajzolta a görbét; szerinte a mozgás mélyíti. A későbbi kísérletek bizonyos ingereknél</text>
<text x="24" y="402" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">alátámasztják a mélyedést, de alakja és okai vitatottak. Tanácsa: az első csúcsot célozzuk, ne a teljes hasonlóságot.</text>
