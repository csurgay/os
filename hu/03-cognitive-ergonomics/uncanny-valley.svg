<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">A hátborzongató völgy (Mori, 1970): hipotézis, nem mért törvény</text>
<path d="M90 350V70" fill="none" class="edge" stroke-width="1.5"/>
<path d="M90 230H680" fill="none" class="edge" stroke-width="1.5"/>
<g transform="translate(50 170) rotate(-90)"><text x="0" y="0" font-size="12" font-weight="600" class="ink" text-anchor="middle">rokonszenv</text></g>
<text x="760" y="234" font-size="12" font-weight="600" class="ink" text-anchor="end">emberhez való</text>
<text x="760" y="250" font-size="12" font-weight="600" class="ink" text-anchor="end">hasonlóság →</text>
<text x="82" y="234" font-size="11" font-weight="400" class="quiet" text-anchor="end">0</text>
<path d="M90.0 227.4 C108.7 223.1 164.7 210.7 202.0 201.4 C239.3 192.1 281.3 179.7 314.0 171.5 C346.7 163.3 377.5 155.7 398.0 152.0 C418.5 148.3 425.1 146.2 437.2 149.4 C449.3 152.7 460.5 152.7 470.8 171.5 C481.1 190.3 487.6 234.3 498.8 262.5 C510.0 290.7 524.9 341.6 538.0 340.5 C551.1 339.4 567.9 280.9 577.2 256.0 C586.5 231.1 588.4 210.5 594.0 191.0 C599.6 171.5 601.5 154.2 610.8 139.0 C620.1 123.8 643.5 106.5 650.0 100.0" fill="none" class="acc" stroke-width="2.5"/>
