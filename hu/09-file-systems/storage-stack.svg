<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 454" width="900" height="454" role="img" aria-label="A rendszerhívástól az eszközig: a tárolási verem rétegei Linuxon" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>A rendszerhívástól az eszközig: a tárolási verem rétegei Linuxon</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .c2{fill:#d9822b}.c2s{stroke:#d9822b}.c2f{fill:#d9822b;fill-opacity:.14}.tint{fill:#f4f3ee}
  .bad{fill:#c8372d}.bads{stroke:#c8372d}.badf{fill:#c8372d;fill-opacity:.14}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}.acct{fill:#7aa9f5}
    .c2{fill:#eb9a4b}.c2s{stroke:#eb9a4b}.c2f{fill:#eb9a4b;fill-opacity:.2}.tint{fill:#22221f}
    .bad{fill:#ff7b70}.bads{stroke:#ff7b70}.badf{fill:#ff7b70;fill-opacity:.2}
  }
</style>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">A rendszerhívástól az eszközig: a tárolási verem rétegei Linuxon</text>
<marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="edgef"/></marker>
<rect x="60" y="54" width="760" height="42" rx="6" class="tint"/><rect x="60" y="54" width="760" height="42" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="76" y="80" font-size="13" font-weight="600" class="ink" text-anchor="start">alkalmazás</text>
<text x="300" y="80" font-size="12" font-weight="400" class="quiet" text-anchor="start">open() read() write() close() rename() fsync() …</text>
<path d="M440 96V108" fill="none" class="edge" stroke-width="1.25" marker-end="url(#a4)"/>
<rect x="60" y="108" width="760" height="42" rx="6" class="accf"/><rect x="60" y="108" width="760" height="42" rx="6" fill="none" class="acc" stroke-width="2"/>
<text x="76" y="134" font-size="13" font-weight="600" class="ink" text-anchor="start">virtuális fájlrendszer (VFS)</text>
<text x="300" y="134" font-size="12" font-weight="400" class="ink" text-anchor="start">egy felület minden fájlrendszerhez; dentry és inode cache</text>
<path d="M440 150V162" fill="none" class="edge" stroke-width="1.25" marker-end="url(#a4)"/>
<rect x="60" y="162" width="760" height="42" rx="6" class="c2f"/><rect x="60" y="162" width="760" height="42" rx="6" fill="none" class="c2s" stroke-width="1.5"/>
<text x="76" y="188" font-size="13" font-weight="600" class="ink" text-anchor="start">page cache</text>
<text x="300" y="188" font-size="12" font-weight="400" class="ink" text-anchor="start">fájladatok a RAM-ban; az írás késleltetett (visszaírás)</text>
<path d="M440 204V216" fill="none" class="edge" stroke-width="1.25" marker-end="url(#a4)"/>
<rect x="60" y="216" width="760" height="42" rx="6" class="accf"/><rect x="60" y="216" width="760" height="42" rx="6" fill="none" class="acc" stroke-width="2"/>
<text x="76" y="242" font-size="13" font-weight="600" class="ink" text-anchor="start">fájlrendszer</text>
<text x="300" y="242" font-size="12" font-weight="400" class="ink" text-anchor="start">ext4 · XFS · Btrfs · vfat · ntfs3 · tmpfs · proc · NFS …</text>
<path d="M440 258V270" fill="none" class="edge" stroke-width="1.25" marker-end="url(#a4)"/>
<rect x="60" y="270" width="760" height="42" rx="6" class="tint"/><rect x="60" y="270" width="760" height="42" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="76" y="296" font-size="13" font-weight="600" class="ink" text-anchor="start">blokkréteg</text>
<text x="300" y="296" font-size="12" font-weight="400" class="quiet" text-anchor="start">számozott blokkokra vonatkozó kérések; összevonás és I/O-ütemezés</text>
<path d="M440 312V324" fill="none" class="edge" stroke-width="1.25" marker-end="url(#a4)"/>
<rect x="60" y="324" width="760" height="42" rx="6" class="tint"/><rect x="60" y="324" width="760" height="42" rx="6" fill="none" class="edge" stroke-width="1.25"/>
<text x="76" y="350" font-size="13" font-weight="600" class="ink" text-anchor="start">eszközmeghajtó</text>
<text x="300" y="350" font-size="12" font-weight="400" class="quiet" text-anchor="start">NVMe · SATA (AHCI) · SCSI · virtio-blk · USB-háttértár</text>
<path d="M440 366V378" fill="none" class="edge" stroke-width="1.25" marker-end="url(#a4)"/>
<rect x="60" y="378" width="760" height="42" rx="6" class="c2f"/><rect x="60" y="378" width="760" height="42" rx="6" fill="none" class="c2s" stroke-width="1.5"/>
<text x="76" y="404" font-size="13" font-weight="600" class="ink" text-anchor="start">háttértár</text>
<text x="300" y="404" font-size="12" font-weight="400" class="ink" text-anchor="start">SSD (flash + FTL) vagy merevlemez (lemezek + firmware)</text>
<text x="826" y="80" font-size="11" font-weight="400" class="quiet" text-anchor="start">felhasználói</text>
<text x="826" y="93" font-size="11" font-weight="400" class="quiet" text-anchor="start">tér</text>
<path d="M40 102H850" fill="none" class="edge" stroke-width="1" stroke-dasharray="5 4"/>
<text x="826" y="120" font-size="11" font-weight="400" class="quiet" text-anchor="start">kernel</text>
<text x="24" y="440" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">A pszeudo-fájlrendszerek (proc, sysfs, tmpfs) a VFS-nél vagy a page cache-nél megállnak: nincs alattuk eszköz.</text>
</svg>
