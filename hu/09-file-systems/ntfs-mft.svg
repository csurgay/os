<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 446" width="880" height="446" role="img" aria-label="NTFS: minden fájl, és minden fájl egy 1 KiB-os rekord a Master File Table-ben" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>NTFS: minden fájl, és minden fájl egy 1 KiB-os rekord a Master File Table-ben</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .c2{fill:#d9822b}.c2s{stroke:#d9822b}.c2f{fill:#d9822b;fill-opacity:.14}.tint{fill:#f4f3ee}
  .bad{fill:#c8372d}.bads{stroke:#c8372d}.badf{fill:#c8372d;fill-opacity:.14}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}.acct{fill:#7aa9f5}
    .c2{fill:#eb9a4b}.c2s{stroke:#eb9a4b}.c2f{fill:#eb9a4b;fill-opacity:.2}.tint{fill:#22221f}
    .bad{fill:#ff7b70}.bads{stroke:#ff7b70}.badf{fill:#ff7b70;fill-opacity:.2}
  }
</style>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">NTFS: minden fájl, és minden fájl egy 1 KiB-os rekord a Master File Table-ben</text>
<marker id="a10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="edgef"/></marker>
<text x="24" y="62" font-size="12.5" font-weight="600" class="ink" text-anchor="start">az MFT (maga is fájl: $MFT)</text>
<rect x="24" y="74" width="160" height="24" rx="3" class="tint"/><rect x="24" y="74" width="160" height="24" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="34" y="90" font-size="11" font-weight="600" class="ink" text-anchor="start">0</text>
<text x="64" y="90" font-size="11" font-weight="400" class="ink" text-anchor="start">$MFT</text>
<rect x="24" y="102" width="160" height="24" rx="3" class="tint"/><rect x="24" y="102" width="160" height="24" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="34" y="118" font-size="11" font-weight="600" class="ink" text-anchor="start">1</text>
<text x="64" y="118" font-size="11" font-weight="400" class="ink" text-anchor="start">$MFTMirr</text>
<rect x="24" y="130" width="160" height="24" rx="3" class="tint"/><rect x="24" y="130" width="160" height="24" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="34" y="146" font-size="11" font-weight="600" class="ink" text-anchor="start">2</text>
<text x="64" y="146" font-size="11" font-weight="400" class="ink" text-anchor="start">$LogFile</text>
<rect x="24" y="158" width="160" height="24" rx="3" class="tint"/><rect x="24" y="158" width="160" height="24" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="34" y="174" font-size="11" font-weight="600" class="ink" text-anchor="start">3</text>
<text x="64" y="174" font-size="11" font-weight="400" class="ink" text-anchor="start">$Volume</text>
<rect x="24" y="186" width="160" height="24" rx="3" class="tint"/><rect x="24" y="186" width="160" height="24" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="34" y="202" font-size="11" font-weight="600" class="ink" text-anchor="start">5</text>
<text x="64" y="202" font-size="11" font-weight="400" class="ink" text-anchor="start">gyökérkönyvtár</text>
<rect x="24" y="214" width="160" height="24" rx="3" class="tint"/><rect x="24" y="214" width="160" height="24" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="34" y="230" font-size="11" font-weight="600" class="ink" text-anchor="start">6</text>
<text x="64" y="230" font-size="11" font-weight="400" class="ink" text-anchor="start">$Bitmap</text>
<rect x="24" y="242" width="160" height="24" rx="3" class="tint"/><rect x="24" y="242" width="160" height="24" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="34" y="258" font-size="11" font-weight="600" class="ink" text-anchor="start">…</text>
<text x="64" y="258" font-size="11" font-weight="400" class="ink" text-anchor="start"></text>
<rect x="24" y="270" width="160" height="24" rx="3" class="accf"/><rect x="24" y="270" width="160" height="24" rx="3" fill="none" class="acc" stroke-width="2"/>
<text x="34" y="286" font-size="11" font-weight="600" class="ink" text-anchor="start">64</text>
<text x="64" y="286" font-size="11" font-weight="400" class="ink" text-anchor="start">hello.txt</text>
<rect x="24" y="298" width="160" height="24" rx="3" class="c2f"/><rect x="24" y="298" width="160" height="24" rx="3" fill="none" class="c2s" stroke-width="1.5"/>
<text x="34" y="314" font-size="11" font-weight="600" class="ink" text-anchor="start">65</text>
<text x="64" y="314" font-size="11" font-weight="400" class="ink" text-anchor="start">big.bin</text>
<path d="M184 284H250" fill="none" class="edge" stroke-width="1.25" marker-end="url(#a10)"/>
<path d="M184 312C220 312 220 360 250 360" fill="none" class="edge" stroke-width="1.25" marker-end="url(#a10)"/>
<rect x="250" y="222" width="600" height="100" rx="8" class="accf"/><rect x="250" y="222" width="600" height="100" rx="8" fill="none" class="acc" stroke-width="2"/>
<text x="262" y="242" font-size="12" font-weight="600" class="ink" text-anchor="start">64. rekord: hello.txt (12 bájt) — az adat rezidens</text>
<rect x="262" y="254" width="140" height="56" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="268" y="272" font-size="9.5" font-weight="600" class="ink" text-anchor="start">$STANDARD_INFORMATION</text>
<text x="268" y="290" font-size="10.5" font-weight="400" class="quiet" text-anchor="start">idők, jelzőbitek</text>
<rect x="408" y="254" width="140" height="56" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="414" y="272" font-size="10.5" font-weight="600" class="ink" text-anchor="start">$FILE_NAME</text>
<text x="414" y="290" font-size="10.5" font-weight="400" class="quiet" text-anchor="start">név, szülőkönyvtár</text>
<rect x="554" y="254" width="140" height="56" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="560" y="272" font-size="9.5" font-weight="600" class="ink" text-anchor="start">$SECURITY_DESCRIPTOR</text>
<text x="560" y="290" font-size="10.5" font-weight="400" class="quiet" text-anchor="start">hozzáférési jogok</text>
<rect x="700" y="254" width="140" height="56" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="706" y="272" font-size="10.5" font-weight="600" class="ink" text-anchor="start">$DATA</text>
<text x="706" y="290" font-size="10.5" font-weight="400" class="quiet" text-anchor="start">maga a "hello, NTFS"</text>
<rect x="250" y="336" width="600" height="70" rx="8" class="c2f"/><rect x="250" y="336" width="600" height="70" rx="8" fill="none" class="c2s" stroke-width="1.5"/>
<text x="262" y="356" font-size="12" font-weight="600" class="ink" text-anchor="start">65. rekord: big.bin (3 MiB) — az adat nem rezidens</text>
<text x="262" y="378" font-size="11.5" font-weight="400" class="ink" text-anchor="start">a $DATA run listet tárol: VCN 0, LCN 0x206a, hossz 0x300 klaszter</text>
<text x="262" y="396" font-size="11" font-weight="400" class="quiet" text-anchor="start">(a fájl 0. klasztere a lemez 8298. klaszterén kezdődik, és 768 klaszteren át tart)</text>
<text x="24" y="432" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">A kis fájlok (nagyjából 700 bájtig) teljes egészében az MFT-rekordjukban élnek; a könyvtárak $FILE_NAME bejegyzések B+ fái.</text>
</svg>
