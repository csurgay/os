<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 402" width="880" height="402" role="img" aria-label="A könyvtár (név, inode) bejegyzésekből álló fájl: kicsiben lista, nagyban hasítófa" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>A könyvtár (név, inode) bejegyzésekből álló fájl: kicsiben lista, nagyban hasítófa</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .c2{fill:#d9822b}.c2s{stroke:#d9822b}.c2f{fill:#d9822b;fill-opacity:.14}.tint{fill:#f4f3ee}
  .bad{fill:#c8372d}.bads{stroke:#c8372d}.badf{fill:#c8372d;fill-opacity:.14}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}.acct{fill:#7aa9f5}
    .c2{fill:#eb9a4b}.c2s{stroke:#eb9a4b}.c2f{fill:#eb9a4b;fill-opacity:.2}.tint{fill:#22221f}
    .bad{fill:#ff7b70}.bads{stroke:#ff7b70}.badf{fill:#ff7b70;fill-opacity:.2}
  }
</style>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">A könyvtár (név, inode) bejegyzésekből álló fájl: kicsiben lista, nagyban hasítófa</text>
<marker id="a7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="edgef"/></marker>
<text x="24" y="62" font-size="12.5" font-weight="600" class="ink" text-anchor="start">lineáris lista (ext2, FAT, ext4 kis könyvtárakhoz): keresés az elejétől</text>
<rect x="24" y="74" width="58" height="50" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="30" y="92" font-size="10.5" font-weight="400" class="quiet" text-anchor="start">inode 2</text>
<text x="30" y="108" font-size="10.5" font-weight="400" class="quiet" text-anchor="start">hossz 12</text>
<text x="30" y="120" font-size="11" font-weight="600" class="ink" text-anchor="start">.</text>
<rect x="86" y="74" width="64" height="50" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="92" y="92" font-size="10.5" font-weight="400" class="quiet" text-anchor="start">inode 2</text>
<text x="92" y="108" font-size="10.5" font-weight="400" class="quiet" text-anchor="start">hossz 12</text>
<text x="92" y="120" font-size="11" font-weight="600" class="ink" text-anchor="start">..</text>
<rect x="154" y="74" width="112" height="50" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="160" y="92" font-size="10.5" font-weight="400" class="quiet" text-anchor="start">inode 11</text>
<text x="160" y="108" font-size="10.5" font-weight="400" class="quiet" text-anchor="start">hossz 20</text>
<text x="160" y="120" font-size="11" font-weight="600" class="ink" text-anchor="start">lost+found</text>
<rect x="270" y="74" width="106" height="50" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="276" y="92" font-size="10.5" font-weight="400" class="quiet" text-anchor="start">inode 14</text>
<text x="276" y="108" font-size="10.5" font-weight="400" class="quiet" text-anchor="start">hossz 20</text>
<text x="276" y="120" font-size="11" font-weight="600" class="ink" text-anchor="start">host-link</text>
<rect x="380" y="74" width="100" height="50" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="386" y="92" font-size="10.5" font-weight="400" class="quiet" text-anchor="start">inode 12</text>
<text x="386" y="108" font-size="10.5" font-weight="400" class="quiet" text-anchor="start">hossz 16</text>
<text x="386" y="120" font-size="11" font-weight="600" class="ink" text-anchor="start">hard.txt</text>
<rect x="484" y="74" width="100" height="50" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="490" y="92" font-size="10.5" font-weight="400" class="quiet" text-anchor="start">inode 13</text>
<text x="490" y="108" font-size="10.5" font-weight="400" class="quiet" text-anchor="start">hossz 16</text>
<text x="490" y="120" font-size="11" font-weight="600" class="ink" text-anchor="start">soft.txt</text>
<rect x="588" y="74" width="70" height="50" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="594" y="92" font-size="10.5" font-weight="400" class="quiet" text-anchor="start">inode 15</text>
<text x="594" y="108" font-size="10.5" font-weight="400" class="quiet" text-anchor="start">hossz 12</text>
<text x="594" y="120" font-size="11" font-weight="600" class="ink" text-anchor="start">dir</text>
<rect x="662" y="74" width="106" height="50" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="668" y="92" font-size="10.5" font-weight="400" class="quiet" text-anchor="start">inode 19</text>
<text x="668" y="108" font-size="10.5" font-weight="400" class="quiet" text-anchor="start">hossz 3976</text>
<text x="668" y="120" font-size="11" font-weight="600" class="ink" text-anchor="start">photo.jpg</text>
<text x="24" y="144" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Minden bejegyzés tárolja a hosszát; a törölt bejegyzést elnyeli az előző, a helye újra felhasználható. Keresés: O(n).</text>
<text x="24" y="180" font-size="12.5" font-weight="600" class="ink" text-anchor="start">hasítófa (ext4 htree; az XFS és az NTFS B+ fát használ): a név hasítása, majd a fa követése</text>
<rect x="320" y="196" width="240" height="76" rx="8" class="accf"/><rect x="320" y="196" width="240" height="76" rx="8" fill="none" class="acc" stroke-width="2"/>
<text x="440" y="216" font-size="12" font-weight="600" class="ink" text-anchor="middle">gyökérblokk</text>
<text x="440" y="236" font-size="11" font-weight="400" class="ink" text-anchor="middle">hash 0x00000000 → 1. blokk</text>
<text x="440" y="252" font-size="11" font-weight="400" class="ink" text-anchor="middle">hash 0x2092d826 → 6. blokk  …</text>
<rect x="60" y="310" width="160" height="50" rx="4" fill="none" class="edge" stroke-width="1.25"/>
<text x="140" y="332" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">1. levélblokk</text>
<text x="140" y="350" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">az adott hash-tartomány</text>
<path d="M440 272L140 308" fill="none" class="edge" stroke-width="1.25" marker-end="url(#a7)"/>
<rect x="260" y="310" width="160" height="50" rx="4" fill="none" class="edge" stroke-width="1.25"/>
<text x="340" y="332" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">6. levélblokk</text>
<text x="340" y="350" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">az adott hash-tartomány</text>
<path d="M440 272L340 308" fill="none" class="edge" stroke-width="1.25" marker-end="url(#a7)"/>
<rect x="460" y="310" width="160" height="50" rx="4" fill="none" class="edge" stroke-width="1.25"/>
<text x="540" y="332" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">4. levélblokk</text>
<text x="540" y="350" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">az adott hash-tartomány</text>
<path d="M440 272L540 308" fill="none" class="edge" stroke-width="1.25" marker-end="url(#a7)"/>
<rect x="660" y="310" width="160" height="50" rx="4" class="tint"/><rect x="660" y="310" width="160" height="50" rx="4" fill="none" class="edge" stroke-width="1.25"/>
<text x="740" y="332" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">… 10 levél</text>
<text x="740" y="350" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle"></text>
<path d="M440 272L740 308" fill="none" class="edge" stroke-width="1.25" marker-end="url(#a7)"/>
<text x="24" y="388" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Mérés 2000 fájllal: egy gyökérblokk és 10 levélblokk. Egy keresés a gyökeret és egy levelet olvassa: O(n) helyett O(log n).</text>
</svg>
