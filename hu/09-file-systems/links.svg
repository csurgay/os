<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 424" width="880" height="424" role="img" aria-label="Hard link: második név ugyanahhoz az inode-hoz.  Szimbolikus link: elérési utat tartalmazó kis fájl" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Hard link: második név ugyanahhoz az inode-hoz.  Szimbolikus link: elérési utat tartalmazó kis fájl</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .c2{fill:#d9822b}.c2s{stroke:#d9822b}.c2f{fill:#d9822b;fill-opacity:.14}.tint{fill:#f4f3ee}
  .bad{fill:#c8372d}.bads{stroke:#c8372d}.badf{fill:#c8372d;fill-opacity:.14}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}.acct{fill:#7aa9f5}
    .c2{fill:#eb9a4b}.c2s{stroke:#eb9a4b}.c2f{fill:#eb9a4b;fill-opacity:.2}.tint{fill:#22221f}
    .bad{fill:#ff7b70}.bads{stroke:#ff7b70}.badf{fill:#ff7b70;fill-opacity:.2}
  }
</style>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">Hard link: második név ugyanahhoz az inode-hoz.  Szimbolikus link: elérési utat tartalmazó kis fájl</text>
<marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="edgef"/></marker>
<rect x="24" y="60" width="210" height="150" rx="8" class="tint"/><rect x="24" y="60" width="210" height="150" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="36" y="82" font-size="12.5" font-weight="600" class="ink" text-anchor="start">a /mnt/lab könyvtár</text>
<rect x="36" y="88" width="186" height="26" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="46" y="106" font-size="12" font-weight="400" class="ink" text-anchor="start">notes.txt</text>
<text x="210" y="106" font-size="12" font-weight="600" class="acct" text-anchor="end">12</text>
<rect x="36" y="122" width="186" height="26" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="46" y="140" font-size="12" font-weight="400" class="ink" text-anchor="start">hard.txt</text>
<text x="210" y="140" font-size="12" font-weight="600" class="acct" text-anchor="end">12</text>
<rect x="36" y="156" width="186" height="26" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="46" y="174" font-size="12" font-weight="400" class="ink" text-anchor="start">soft.txt</text>
<text x="210" y="174" font-size="12" font-weight="600" class="acct" text-anchor="end">13</text>
<path d="M222 101C280 101 300 112 330 118" fill="none" class="acc" stroke-width="1.8" marker-end="url(#a6)"/>
<path d="M222 135C280 135 300 128 330 124" fill="none" class="acc" stroke-width="1.8" marker-end="url(#a6)"/>
<path d="M222 169C280 169 300 210 330 226" fill="none" class="c2s" stroke-width="1.8" marker-end="url(#a6)"/>
<rect x="330" y="90" width="200" height="70" rx="8" class="accf"/><rect x="330" y="90" width="200" height="70" rx="8" fill="none" class="acc" stroke-width="2"/>
<text x="342" y="112" font-size="12" font-weight="600" class="ink" text-anchor="start">12-es inode, közönséges fájl</text>
<text x="342" y="132" font-size="12" font-weight="400" class="ink" text-anchor="start">linkszám: 2</text>
<text x="342" y="150" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">méret: 19</text>
<path d="M530 125H586" fill="none" class="edge" stroke-width="1.25" marker-end="url(#a6)"/>
<rect x="586" y="104" width="190" height="42" rx="4" fill="none" class="edge" stroke-width="1.25"/>
<text x="600" y="130" font-size="12" font-weight="400" class="ink" text-anchor="start">"hello, file system"</text>
<rect x="330" y="196" width="200" height="64" rx="8" class="c2f"/><rect x="330" y="196" width="200" height="64" rx="8" fill="none" class="c2s" stroke-width="1.5"/>
<text x="342" y="218" font-size="12" font-weight="600" class="ink" text-anchor="start">13-as inode, szimb. link</text>
<text x="342" y="240" font-size="12" font-weight="400" class="ink" text-anchor="start">tartalma: "notes.txt"</text>
<text x="550" y="216" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">az elérési utat minden használatkor újra feloldja:</text>
<text x="550" y="232" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">az rm notes.txt után a link lóg</text>
<text x="36" y="296" font-size="11.5" font-weight="600" class="ink" text-anchor="start"></text>
<text x="200" y="296" font-size="11.5" font-weight="600" class="ink" text-anchor="start">hard link</text>
<text x="560" y="296" font-size="11.5" font-weight="600" class="ink" text-anchor="start">szimbolikus link</text>
<text x="36" y="316" font-size="11.5" font-weight="600" class="ink" text-anchor="start">mire mutat</text>
<text x="200" y="316" font-size="11.5" font-weight="400" class="ink" text-anchor="start">egy inode-ra (sorszám szerint)</text>
<text x="560" y="316" font-size="11.5" font-weight="400" class="ink" text-anchor="start">egy elérési útra (név szerint)</text>
<text x="36" y="336" font-size="11.5" font-weight="600" class="ink" text-anchor="start">saját inode</text>
<text x="200" y="336" font-size="11.5" font-weight="400" class="ink" text-anchor="start">nincs: ugyanaz az inode, linkszám + 1</text>
<text x="560" y="336" font-size="11.5" font-weight="400" class="ink" text-anchor="start">van, „symlink” típusú</text>
<text x="36" y="356" font-size="11.5" font-weight="600" class="ink" text-anchor="start">a cél törlése</text>
<text x="200" y="356" font-size="11.5" font-weight="400" class="ink" text-anchor="start">az adat marad, amíg az utolsó link is el nem tűnik</text>
<text x="560" y="356" font-size="11.5" font-weight="400" class="ink" text-anchor="start">a link lóg</text>
<text x="36" y="376" font-size="11.5" font-weight="600" class="ink" text-anchor="start">másik fájlrendszer</text>
<text x="200" y="376" font-size="11.5" font-weight="400" class="ink" text-anchor="start">lehetetlen (az inode-sorszámok helyiek)</text>
<text x="560" y="376" font-size="11.5" font-weight="400" class="ink" text-anchor="start">lehetséges</text>
<text x="36" y="396" font-size="11.5" font-weight="600" class="ink" text-anchor="start">könyvtárak</text>
<text x="200" y="396" font-size="11.5" font-weight="400" class="ink" text-anchor="start">nem megengedett (ciklusokat hozna létre)</text>
<text x="560" y="396" font-size="11.5" font-weight="400" class="ink" text-anchor="start">megengedett</text>
</svg>
