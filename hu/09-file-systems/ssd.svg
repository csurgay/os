<text x="680" y="389" font-size="11" font-weight="400" class="ink" text-anchor="start">törölt lap</text>
<text x="24" y="456" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">olvasás és programozás (írás): egy lap, 4–16 KiB, néhányszor 10 µs-tól 1 ms-ig   ·   törlés: egy egész, több száz lapos blokk, több ms</text>
<text x="24" y="474" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Egy lapot nem lehet a helyén felülírni: az új változat egy törölt lapra kerül, a régi pedig érvénytelenné válik.</text>
