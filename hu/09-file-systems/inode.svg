<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 388" width="880" height="388" role="img" aria-label="A könyvtárbejegyzés nevet ad egy inode-nak; az inode leírja a fájlt, és megtalálja az adatait" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>A könyvtárbejegyzés nevet ad egy inode-nak; az inode leírja a fájlt, és megtalálja az adatait</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .c2{fill:#d9822b}.c2s{stroke:#d9822b}.c2f{fill:#d9822b;fill-opacity:.14}.tint{fill:#f4f3ee}
  .bad{fill:#c8372d}.bads{stroke:#c8372d}.badf{fill:#c8372d;fill-opacity:.14}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}.acct{fill:#7aa9f5}
    .c2{fill:#eb9a4b}.c2s{stroke:#eb9a4b}.c2f{fill:#eb9a4b;fill-opacity:.2}.tint{fill:#22221f}
    .bad{fill:#ff7b70}.bads{stroke:#ff7b70}.badf{fill:#ff7b70;fill-opacity:.2}
  }
</style>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">A könyvtárbejegyzés nevet ad egy inode-nak; az inode leírja a fájlt, és megtalálja az adatait</text>
<marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="edgef"/></marker>
<rect x="24" y="60" width="170" height="96" rx="8" class="tint"/><rect x="24" y="60" width="170" height="96" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="36" y="82" font-size="12.5" font-weight="600" class="ink" text-anchor="start">könyvtárbejegyzés</text>
<text x="36" y="106" font-size="12" font-weight="400" class="ink" text-anchor="start">név: photo.jpg</text>
<text x="36" y="126" font-size="12" font-weight="600" class="acct" text-anchor="start">inode-sorszám: 19</text>
<path d="M194 120H236" fill="none" class="edge" stroke-width="1.25" marker-end="url(#a5)"/>
<rect x="236" y="60" width="250" height="286" rx="8" class="accf"/><rect x="236" y="60" width="250" height="286" rx="8" fill="none" class="acc" stroke-width="2"/>
<text x="250" y="82" font-size="12.5" font-weight="600" class="ink" text-anchor="start">19-es inode (ext4-ben 256 bájt)</text>
<text x="250" y="106" font-size="11.5" font-weight="400" class="ink" text-anchor="start">típus és jogosultságok (rw-r--r--)</text>
<text x="250" y="126" font-size="11.5" font-weight="400" class="ink" text-anchor="start">tulajdonos (uid) és csoport (gid)</text>
<text x="250" y="146" font-size="11.5" font-weight="400" class="ink" text-anchor="start">méret: 307 200 bájt</text>
<text x="250" y="166" font-size="11.5" font-weight="400" class="ink" text-anchor="start">linkszám: 1</text>
<text x="250" y="186" font-size="11.5" font-weight="400" class="ink" text-anchor="start">idők: access, modify, change, birth</text>
<text x="250" y="206" font-size="11.5" font-weight="400" class="ink" text-anchor="start">jelzőbitek (extentek, …)</text>
<text x="250" y="246" font-size="11.5" font-weight="600" class="ink" text-anchor="start">hol vannak az adatok:</text>
<text x="250" y="266" font-size="11.5" font-weight="400" class="ink" text-anchor="start">ext2/ext3: blokkmutatók  ↗</text>
<text x="250" y="286" font-size="11.5" font-weight="400" class="ink" text-anchor="start">ext4: extentek  ↘</text>
<text x="250" y="330" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">név nincs: a nevek a könyvtárakban élnek</text>
<text x="520" y="70" font-size="12.5" font-weight="600" class="ink" text-anchor="start">klasszikus Unix / ext2: blokkmutatók</text>
<rect x="520" y="84" width="150" height="24" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="530" y="100" font-size="11" font-weight="400" class="ink" text-anchor="start">12 közvetlen mutató</text>
<path d="M670 96H700" fill="none" class="edge" stroke-width="1.25" marker-end="url(#a5)"/>
<rect x="702" y="86" width="18" height="20" rx="2" class="c2f"/><rect x="702" y="86" width="18" height="20" rx="2" fill="none" class="c2s" stroke-width="1.5"/>
<rect x="520" y="114" width="150" height="24" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="530" y="130" font-size="11" font-weight="400" class="ink" text-anchor="start">egyszeresen indirekt</text>
<path d="M670 126H720" fill="none" class="edge" stroke-width="1.25" marker-end="url(#a5)"/>
<rect x="722" y="116" width="18" height="20" rx="2" fill="none" class="edge" stroke-width="1.25"/>
<rect x="728" y="114" width="18" height="20" rx="2" class="c2f"/><rect x="728" y="114" width="18" height="20" rx="2" fill="none" class="c2s" stroke-width="1.5"/>
<rect x="520" y="144" width="150" height="24" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="530" y="160" font-size="11" font-weight="400" class="ink" text-anchor="start">kétszeresen indirekt</text>
<path d="M670 156H740" fill="none" class="edge" stroke-width="1.25" marker-end="url(#a5)"/>
<rect x="742" y="146" width="18" height="20" rx="2" fill="none" class="edge" stroke-width="1.25"/>
<rect x="748" y="144" width="18" height="20" rx="2" fill="none" class="edge" stroke-width="1.25"/>
<rect x="754" y="142" width="18" height="20" rx="2" class="c2f"/><rect x="754" y="142" width="18" height="20" rx="2" fill="none" class="c2s" stroke-width="1.5"/>
<rect x="520" y="174" width="150" height="24" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="530" y="190" font-size="11" font-weight="400" class="ink" text-anchor="start">háromszorosan indirekt</text>
<path d="M670 186H760" fill="none" class="edge" stroke-width="1.25" marker-end="url(#a5)"/>
<rect x="762" y="176" width="18" height="20" rx="2" fill="none" class="edge" stroke-width="1.25"/>
<rect x="768" y="174" width="18" height="20" rx="2" fill="none" class="edge" stroke-width="1.25"/>
<rect x="774" y="172" width="18" height="20" rx="2" fill="none" class="edge" stroke-width="1.25"/>
<rect x="780" y="170" width="18" height="20" rx="2" class="c2f"/><rect x="780" y="170" width="18" height="20" rx="2" fill="none" class="c2s" stroke-width="1.5"/>
<text x="520" y="216" font-size="11" font-weight="400" class="quiet" text-anchor="start">4 KiB-os blokkok: 48 KiB közvetlenül, aztán indirekt</text>
<text x="520" y="232" font-size="11" font-weight="400" class="quiet" text-anchor="start">blokkonként további 1024 mutató, és így tovább</text>
<text x="520" y="268" font-size="12.5" font-weight="600" class="ink" text-anchor="start">ext4: extentek</text>
<rect x="520" y="280" width="330" height="46" rx="4" class="c2f"/><rect x="520" y="280" width="330" height="46" rx="4" fill="none" class="c2s" stroke-width="1.5"/>
<text x="532" y="300" font-size="12" font-weight="600" class="ink" text-anchor="start">fájlblokkok 0–74  →  lemezblokkok 2581–2655</text>
<text x="532" y="318" font-size="11" font-weight="400" class="quiet" text-anchor="start">egy extent: kezdet, hossz (max. 32 768 blokk = 128 MiB)</text>
<path d="M486 300H520" fill="none" class="edge" stroke-width="1.25" marker-end="url(#a5)"/>
<text x="24" y="372" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Legfeljebb 4 extent fér el magában az inode-ban; a nagyobb vagy fragmentált fájlok extentblokkokból álló kis fát kapnak.</text>
</svg>
