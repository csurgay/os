<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440" role="img" aria-label="Internal and external fragmentation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Internal and external fragmentation</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .c2{fill:#d9822b}.c2s{stroke:#d9822b}.c2f{fill:#d9822b;fill-opacity:.14}.tint{fill:#f4f3ee}
  .bad{fill:#c8372d}.bads{stroke:#c8372d}.badf{fill:#c8372d;fill-opacity:.14}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}.acct{fill:#7aa9f5}
    .c2{fill:#eb9a4b}.c2s{stroke:#eb9a4b}.c2f{fill:#eb9a4b;fill-opacity:.2}.tint{fill:#22221f}
    .bad{fill:#ff7b70}.bads{stroke:#ff7b70}.badf{fill:#ff7b70;fill-opacity:.2}
  }
</style>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">Internal and external fragmentation</text>
<text x="24" y="62" font-size="13" font-weight="600" class="ink" text-anchor="start">Equal-sized blocks: internal fragmentation</text>
<rect x="24" y="76" width="200" height="40" rx="2" class="tint"/><rect x="24" y="76" width="200" height="40" rx="2" fill="none" class="edge" stroke-width="1.25"/>
<rect x="24" y="76" width="200" height="40" class="accf"/>
<text x="234" y="101" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">100% used</text>
<rect x="24" y="122" width="200" height="40" rx="2" class="tint"/><rect x="24" y="122" width="200" height="40" rx="2" fill="none" class="edge" stroke-width="1.25"/>
<rect x="24" y="122" width="70" height="40" class="accf"/>
<text x="234" y="147" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">35% used</text>
<rect x="24" y="168" width="200" height="40" rx="2" class="tint"/><rect x="24" y="168" width="200" height="40" rx="2" fill="none" class="edge" stroke-width="1.25"/>
<rect x="24" y="168" width="180" height="40" class="accf"/>
<text x="234" y="193" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">90% used</text>
<rect x="24" y="214" width="200" height="40" rx="2" class="tint"/><rect x="24" y="214" width="200" height="40" rx="2" fill="none" class="edge" stroke-width="1.25"/>
<rect x="24" y="214" width="100" height="40" class="accf"/>
<text x="234" y="239" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">50% used</text>
<text x="24" y="310" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">the unused rest of each block is lost inside it</text>
<text x="24" y="328" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">(like half-empty shipping containers)</text>
<text x="460" y="62" font-size="13" font-weight="600" class="ink" text-anchor="start">Variable-sized blocks: external fragmentation</text>
<rect x="460" y="76" width="180" height="30" rx="0" class="accf"/><rect x="460" y="76" width="180" height="30" rx="0" fill="none" class="acc" stroke-width="2"/>
<text x="550" y="95.0" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">allocation 1</text>
<rect x="460" y="106" width="180" height="44" rx="0" class="accf"/><rect x="460" y="106" width="180" height="44" rx="0" fill="none" class="acc" stroke-width="2"/>
<text x="550" y="132.0" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">allocation 2</text>
<rect x="460" y="150" width="180" height="34" rx="0" class="tint"/><rect x="460" y="150" width="180" height="34" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<text x="550" y="171.0" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">free</text>
<rect x="460" y="184" width="180" height="50" rx="0" class="c2f"/><rect x="460" y="184" width="180" height="50" rx="0" fill="none" class="c2s" stroke-width="1.5"/>
<text x="550" y="213.0" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">allocation 5</text>
<rect x="460" y="234" width="180" height="28" rx="0" class="tint"/><rect x="460" y="234" width="180" height="28" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<text x="550" y="252.0" font-size="11.5" font-weight="400" class="quiet" text-anchor="middle">free</text>
<rect x="460" y="262" width="180" height="26" rx="0" class="accf"/><rect x="460" y="262" width="180" height="26" rx="0" fill="none" class="acc" stroke-width="2"/>
<text x="550" y="279.0" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">allocation 6</text>
<rect x="670" y="120" width="120" height="50" rx="4" class="badf"/><rect x="670" y="120" width="120" height="50" rx="4" fill="none" class="bads" stroke-width="1.5"/>
<text x="730" y="141" font-size="11.5" font-weight="600" class="ink" text-anchor="middle">new request</text>
<text x="730" y="158" font-size="11" font-weight="400" class="quiet" text-anchor="middle">needs 50</text>
<text x="460" y="310" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">62 units free in total, but no hole is big enough;</text>
<text x="460" y="328" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">compaction (defragmentation) would move the blocks together</text>
<text x="24" y="372" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">The lecture notes' picture: a fragmented memory is a zebra, a defragmented one a horse with all its dark stripes in one patch.</text>
<rect x="24" y="386" width="10" height="20" class="acct"/>
<rect x="44" y="386" width="10" height="20" class="tint"/>
<rect x="64" y="386" width="10" height="20" class="acct"/>
<rect x="84" y="386" width="10" height="20" class="tint"/>
<rect x="104" y="386" width="10" height="20" class="acct"/>
<rect x="124" y="386" width="10" height="20" class="tint"/>
<rect x="144" y="386" width="10" height="20" class="acct"/>
<rect x="164" y="386" width="10" height="20" class="tint"/>
<rect x="184" y="386" width="10" height="20" class="acct"/>
<rect x="204" y="386" width="10" height="20" class="tint"/>
<rect x="224" y="386" width="10" height="20" class="acct"/>
<rect x="244" y="386" width="10" height="20" class="tint"/>
<rect x="300" y="386" width="120" height="20" class="acct"/><rect x="420" y="386" width="120" height="20" class="tint"/>
<rect x="300" y="386" width="240" height="20" fill="none" class="edge"/><rect x="24" y="386" width="240" height="20" fill="none" class="edge"/>
<text x="144" y="424" font-size="11" font-weight="400" class="quiet" text-anchor="middle">fragmented (zebra)</text>
<text x="420" y="424" font-size="11" font-weight="400" class="quiet" text-anchor="middle">defragmented (horse)</text>
</svg>
