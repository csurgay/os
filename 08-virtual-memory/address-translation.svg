<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 354" width="880" height="354" role="img" aria-label="Address translation with a page table (32-bit addresses, 4 KiB pages)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Address translation with a page table (32-bit addresses, 4 KiB pages)</title>
<style>
  .ink{fill:#1f1f1f}.quiet{fill:#6b6b66}.edge{stroke:#b5b4a8}.edgef{fill:#b5b4a8}
  .grid{stroke:#e3e2da}.acc{stroke:#2f6fd6}.accf{fill:#2f6fd6;fill-opacity:.12}.acct{fill:#2f6fd6}
  .c2{fill:#d9822b}.c2s{stroke:#d9822b}.c2f{fill:#d9822b;fill-opacity:.14}.tint{fill:#f4f3ee}
  .bad{fill:#c8372d}.bads{stroke:#c8372d}.badf{fill:#c8372d;fill-opacity:.14}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e8e3}.quiet{fill:#a3a39c}.edge{stroke:#6f6e66}.edgef{fill:#6f6e66}
    .grid{stroke:#3a3a35}.acc{stroke:#5b93ef}.accf{fill:#5b93ef;fill-opacity:.18}.acct{fill:#7aa9f5}
    .c2{fill:#eb9a4b}.c2s{stroke:#eb9a4b}.c2f{fill:#eb9a4b;fill-opacity:.2}.tint{fill:#22221f}
    .bad{fill:#ff7b70}.bads{stroke:#ff7b70}.badf{fill:#ff7b70;fill-opacity:.2}
  }
</style>
<defs><marker id="tr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="edgef"/></marker></defs>
<text x="24" y="30" font-size="15" font-weight="600" class="ink" text-anchor="start">Address translation with a page table (32-bit addresses, 4 KiB pages)</text>
<text x="60" y="58" font-size="12" font-weight="600" class="quiet" text-anchor="start">virtual address</text>
<rect x="60" y="66" width="320" height="34" rx="3" class="accf"/><rect x="60" y="66" width="320" height="34" rx="3" fill="none" class="acc" stroke-width="2"/>
<text x="220" y="88" font-size="12" font-weight="600" class="ink" text-anchor="middle">page number (20 bits)</text>
<rect x="380" y="66" width="192" height="34" rx="3" class="tint"/><rect x="380" y="66" width="192" height="34" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="476" y="88" font-size="12" font-weight="600" class="ink" text-anchor="middle">offset (12 bits)</text>
<rect x="40" y="170" width="150" height="34" rx="4" class="c2f"/><rect x="40" y="170" width="150" height="34" rx="4" fill="none" class="c2s" stroke-width="1.5"/>
<text x="115" y="192" font-size="12" font-weight="600" class="ink" text-anchor="middle">PTP register</text>
<text x="115" y="222" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">(CR3 on x86; part of</text>
<text x="115" y="236" font-size="10.5" font-weight="400" class="quiet" text-anchor="middle">each process's context)</text>
<text x="250" y="142" font-size="12" font-weight="600" class="ink" text-anchor="start">page table of this process</text>
<rect x="250" y="150" width="26" height="24" rx="0" class="tint"/><rect x="250" y="150" width="26" height="24" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<text x="263.0" y="166" font-size="10.5" font-weight="600" class="ink" text-anchor="middle">V</text>
<rect x="276" y="150" width="60" height="24" rx="0" class="tint"/><rect x="276" y="150" width="60" height="24" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<text x="306.0" y="166" font-size="10.5" font-weight="600" class="ink" text-anchor="middle">R/W/X</text>
<rect x="336" y="150" width="120" height="24" rx="0" class="tint"/><rect x="336" y="150" width="120" height="24" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<text x="396.0" y="166" font-size="10.5" font-weight="600" class="ink" text-anchor="middle">frame number</text>
<rect x="250" y="174" width="26" height="26" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<rect x="276" y="174" width="60" height="26" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<rect x="336" y="174" width="120" height="26" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<rect x="250" y="200" width="26" height="26" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<rect x="276" y="200" width="60" height="26" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<rect x="336" y="200" width="120" height="26" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<rect x="250" y="226" width="26" height="26" rx="0" class="accf"/><rect x="250" y="226" width="26" height="26" rx="0" fill="none" class="acc" stroke-width="2"/>
<rect x="276" y="226" width="60" height="26" rx="0" class="accf"/><rect x="276" y="226" width="60" height="26" rx="0" fill="none" class="acc" stroke-width="2"/>
<rect x="336" y="226" width="120" height="26" rx="0" class="accf"/><rect x="336" y="226" width="120" height="26" rx="0" fill="none" class="acc" stroke-width="2"/>
<text x="263" y="244" font-size="11" font-weight="600" class="ink" text-anchor="middle">1</text>
<text x="306" y="244" font-size="11" font-weight="600" class="ink" text-anchor="middle">R W -</text>
<text x="396" y="244" font-size="11" font-weight="600" class="ink" text-anchor="middle">0x12dc6</text>
<rect x="250" y="252" width="26" height="26" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<rect x="276" y="252" width="60" height="26" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<rect x="336" y="252" width="120" height="26" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<rect x="250" y="278" width="26" height="26" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<rect x="276" y="278" width="60" height="26" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<rect x="336" y="278" width="120" height="26" rx="0" fill="none" class="edge" stroke-width="1.25"/>
<path d="M220 100C220 160 236 236 246 239" fill="none" class="edge" stroke-width="1.5" marker-end="url(#tr)"/>
<text x="150" y="128" font-size="11" font-weight="400" class="quiet" text-anchor="start">index</text>
<path d="M190 187C220 187 230 180 246 180" fill="none" class="edge" stroke-width="1.5" marker-end="url(#tr)"/>
<text x="196" y="176" font-size="10.5" font-weight="400" class="quiet" text-anchor="start">start</text>
<text x="560" y="214" font-size="12" font-weight="600" class="quiet" text-anchor="start">physical address</text>
<rect x="560" y="222" width="200" height="34" rx="3" class="accf"/><rect x="560" y="222" width="200" height="34" rx="3" fill="none" class="acc" stroke-width="2"/>
<text x="660" y="244" font-size="12" font-weight="600" class="ink" text-anchor="middle">frame number</text>
<rect x="760" y="222" width="100" height="34" rx="3" class="tint"/><rect x="760" y="222" width="100" height="34" rx="3" fill="none" class="edge" stroke-width="1.25"/>
<text x="810" y="244" font-size="12" font-weight="600" class="ink" text-anchor="middle">offset</text>
<path d="M458 239H556" fill="none" class="edge" stroke-width="1.5" marker-end="url(#tr)"/>
<path d="M476 100C476 130 810 130 810 218" fill="none" class="edge" stroke-width="1.5" marker-end="url(#tr)"/>
<text x="640" y="124" font-size="11" font-weight="400" class="quiet" text-anchor="start">copied unchanged</text>
<text x="24" y="320" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">V = 0: the page is not in RAM; the CPU raises a page fault (an interrupt), and the OS loads the page from disk or stops the program.</text>
<text x="24" y="338" font-size="11.5" font-weight="400" class="quiet" text-anchor="start">Rights (read, write, execute, user/kernel): a forbidden access also faults. One table per process: switching processes switches the PTP.</text>
</svg>
